<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnosis Room</title>
<meta name="description" content="Timed, section-by-section audit checklists for Dine-In and QSR floor checks.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Diagnosis Room">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F2F2;
    --ink:#000000; --ink-600:#4B4B4B; --ink-400:#8A8A8A;
    --line:#E4E4E4; --line-strong:#CFCFCF;
    --accent:#2596E0; --accent-ink:#0F5C8C; --accent-soft:#E1F1FB;
    --good:#2E7D4F; --good-soft:#DCEEE2;
    --bad:#C1392B; --bad-soft:#F6DFDA;
    --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.06);
    --r-s:8px; --r-m:12px; --r-l:18px;
    --font-d:'Poppins',"Segoe UI",sans-serif;
    --font-b:'Poppins',-apple-system,"Segoe UI",sans-serif;
    --font-m:'IBM Plex Mono',"SFMono-Regular",Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0A0A0A; --surface:#161616; --surface-2:#202020;
      --ink:#FFFFFF; --ink-600:#B0B0B0; --ink-400:#7A7A7A;
      --line:#2C2C2C; --line-strong:#3D3D3D;
      --accent:#5CB8F5; --accent-ink:#BEE4FB; --accent-soft:#123349;
      --good:#59B583; --good-soft:#24352B;
      --bad:#E2645A; --bad-soft:#3A2622;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0A0A0A; --surface:#161616; --surface-2:#202020;
    --ink:#FFFFFF; --ink-600:#B0B0B0; --ink-400:#7A7A7A;
    --line:#2C2C2C; --line-strong:#3D3D3D;
    --accent:#5CB8F5; --accent-ink:#BEE4FB; --accent-soft:#123349;
    --good:#59B583; --good-soft:#24352B;
    --bad:#E2645A; --bad-soft:#3A2622;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
  html,body{background:var(--paper);}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-b); margin:0;}
  h1,h2,h3{font-family:var(--font-d); font-weight:800; letter-spacing:-0.01em; text-wrap:balance; margin:0;}
  .mono{font-family:var(--font-m); font-variant-numeric:tabular-nums;}
  button{font-family:var(--font-b); cursor:pointer;}
  input,textarea{font-family:var(--font-b);}
  .shell{max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--paper);}
  .topbar{position:sticky; top:0; z-index:10; background:var(--paper); border-bottom:1px solid var(--line); padding:14px 18px; display:flex; align-items:center; gap:12px;}
  .brand{display:flex; align-items:center; gap:9px; cursor:pointer; border:none; background:none; padding:0;}
  .brand .mark, .sidebar-brand .mark{width:32px; height:32px; border-radius:50%; background:#000; color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-d); font-weight:800; font-style:italic; font-size:15px; letter-spacing:-0.03em; flex:none; overflow:hidden;}
  .brand .name, .sidebar-brand .name{font-family:var(--font-d); font-weight:800; font-size:18px; color:var(--ink);}
  .hamburger{width:36px; height:36px; flex:none; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); border-radius:var(--r-s); font-size:16px; display:flex; align-items:center; justify-content:center; padding:0;}
  .hamburger:hover{background:var(--surface-2);}
  .sidebar-overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:19;}
  .sidebar-overlay.show{opacity:1; pointer-events:auto;}
  .sidebar{position:fixed; top:0; left:0; bottom:0; width:250px; max-width:82vw; background:var(--surface); border-right:1px solid var(--line); z-index:20; transform:translateX(-100%); transition:transform .25s ease; display:flex; flex-direction:column; padding:16px 12px; overflow-y:auto;}
  .sidebar.open{transform:translateX(0);}
  .sidebar-brand{display:flex; align-items:center; gap:9px; padding:6px 8px 16px; border-bottom:1px solid var(--line); margin-bottom:10px;}
  .sidebarbtn{display:flex; align-items:center; justify-content:space-between; gap:8px; text-align:left; width:100%; border:none; background:none; color:var(--ink-600); font-size:14.5px; font-weight:600; padding:11px 10px; border-radius:var(--r-s); margin-bottom:2px;}
  .sidebarbtn:hover:not(:disabled){background:var(--surface-2); color:var(--ink);}
  .sidebarbtn.active{background:var(--ink); color:var(--paper);}
  .sidebarbtn:disabled{opacity:.35; cursor:not-allowed;}
  .sidebarbtn .count{font-size:11.5px; font-family:var(--font-m); opacity:.75;}
  main{flex:1; padding:22px 18px 90px;}
  .eyebrow{font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-400);}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--shadow);}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:var(--r-m); font-weight:700; font-size:14.5px; padding:11px 18px; border:1px solid transparent; transition:transform .12s, background .15s;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-ink);}
  .btn-primary:disabled{background:var(--ink-400); cursor:not-allowed;}
  .btn-ghost{background:var(--surface); color:var(--ink); border-color:var(--line-strong);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-text{background:none; color:var(--ink-600); padding:8px 4px;}
  .btn-text:hover{color:var(--ink);}
  .btn-danger{color:var(--bad);}
  .btn-sm{padding:6px 11px; font-size:13px; border-radius:var(--r-s);}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-600); margin-bottom:6px;}
  .field input, .field textarea{width:100%; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); border-radius:var(--r-s); padding:10px 12px; font-size:15px;}
  .field input:focus, .field textarea:focus, button:focus-visible, .navbtn:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .field textarea{resize:vertical; min-height:88px; line-height:1.45;}

  /* setup */
  .typegrid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:14px 0 20px;}
  .typecard{border:1.5px solid var(--line-strong); border-radius:var(--r-l); padding:16px 14px; background:var(--surface); text-align:left;}
  .typecard.selected{border-color:var(--accent); background:var(--accent-soft);}
  .typecard .ticon{font-size:22px;}
  .typecard .tname{font-family:var(--font-d); font-weight:800; font-size:16px; margin-top:8px;}
  .typecard .tmeta{font-size:12.5px; color:var(--ink-600); margin-top:3px;}
  .formstack{display:flex; flex-direction:column; gap:14px; margin-bottom:22px;}
  .helper{font-size:12.5px; color:var(--ink-400); margin-top:6px;}

  /* audit header */
  .auditbar{position:sticky; top:57px; z-index:9; background:var(--paper); padding:12px 0 14px; border-bottom:1px solid var(--line); margin-bottom:16px;}
  .auditbar .row1{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .badge{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--accent-ink); background:var(--accent-soft); padding:3px 8px; border-radius:20px;}
  .storeline{font-weight:700; font-size:15px; margin-top:6px;}
  .storeline .sub{color:var(--ink-600); font-weight:500; font-size:13px;}
  .timerblock{text-align:right;}
  .timerblock .t{font-size:26px; font-weight:600; line-height:1;}
  .timerblock .lbl{font-size:10.5px; color:var(--ink-400); text-transform:uppercase; letter-spacing:.07em; margin-top:2px;}
  .overallprog{margin-top:12px;}
  .progtrack{height:6px; background:var(--surface-2); border-radius:4px; overflow:hidden;}
  .progfill{height:100%; background:var(--accent); border-radius:4px; transition:width .25s;}
  .progtext{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-600); margin-top:5px;}
  .barctl{display:flex; gap:8px; margin-top:12px;}

  /* sections */
  .section{border:1px solid var(--line); border-radius:var(--r-l); background:var(--surface); margin-bottom:12px; overflow:hidden;}
  .section.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
  .sechead{display:flex; align-items:center; gap:12px; padding:14px 16px; width:100%; background:none; border:none; text-align:left;}
  .secnum{font-family:var(--font-m); font-size:12px; font-weight:600; color:var(--ink-400); width:20px; flex:none;}
  .sectitle{flex:1; min-width:0;}
  .sectitle .sname{font-weight:700; font-size:15px;}
  .sectitle .smeta{font-size:12px; color:var(--ink-600); margin-top:2px; font-family:var(--font-m);}
  .sectimer{font-family:var(--font-m); font-size:13px; color:var(--ink-600); flex:none; display:flex; align-items:center; gap:5px;}
  .sectimer.running{color:var(--accent-ink); font-weight:600;}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--line-strong); flex:none;}
  .dot.running{background:var(--accent);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
  .dot.running{animation:pulse 1.4s ease-in-out infinite;}
  .chev{color:var(--ink-400); flex:none; transition:transform .18s;}
  .section.active .chev{transform:rotate(180deg);}
  .secbody{padding:0 16px 14px;}
  .item{display:flex; align-items:flex-start; gap:11px; padding:10px 2px; border-top:1px solid var(--line);}
  .item:first-child{border-top:none;}
  .chk{width:22px; height:22px; border-radius:6px; border:1.5px solid var(--line-strong); background:var(--surface); flex:none; margin-top:1px; display:flex; align-items:center; justify-content:center; transition:background .12s, border-color .12s;}
  .chk.checked{background:var(--good); border-color:var(--good); color:#fff;}
  .chk.na{background:var(--surface-2); border-color:var(--line-strong); color:var(--ink-400);}
  .itemcol{flex:1; min-width:0;}
  .itemtext{font-size:14.5px; line-height:1.4; padding-top:2px; cursor:default;}
  .itemtext.checked{color:var(--ink-600);}
  .itemtext.na{color:var(--ink-400); text-decoration:line-through;}
  .itemvalue{display:block; margin-top:6px; width:100%; border:1px solid var(--line-strong); border-radius:var(--r-s); padding:6px 10px; font-size:13px; background:var(--surface); color:var(--ink);}
  .naBtn{font-size:11px; font-weight:700; color:var(--ink-400); background:none; border:1px solid var(--line-strong); border-radius:20px; padding:4px 9px; flex:none;}
  .naBtn.on{color:var(--accent-ink); border-color:var(--accent); background:var(--accent-soft);}

  .footerbar{position:fixed; bottom:0; left:0; right:0; background:var(--paper); border-top:1px solid var(--line); padding:12px 18px; display:flex; justify-content:center; z-index:11;}
  .footerbar .inner{max-width:640px; width:100%; display:flex; gap:10px;}
  .footerbar .inner .btn{flex:1;}

  .remarkwrap{padding-top:4px;}
  .dashgrid{display:grid; grid-template-columns:1.3fr 1fr; gap:12px; margin-bottom:20px;}
  @media (max-width:520px){ .dashgrid{grid-template-columns:1fr;} }
  .dashcard{padding:14px 14px 10px;}
  .dashcard-title{font-size:12.5px; font-weight:700; color:var(--ink-600); margin-bottom:10px;}
  .barchart{display:flex; gap:7px; align-items:flex-end; height:96px;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
  .bar-track{width:100%; max-width:26px; height:64px; background:var(--surface-2); border-radius:5px 5px 0 0; display:flex; align-items:flex-end; overflow:hidden;}
  .bar-fill{width:100%; background:var(--accent); border-radius:5px 5px 0 0; min-height:2px; transition:height .3s;}
  .bar-val{font-size:10.5px; font-weight:700; margin-top:4px; font-family:var(--font-m);}
  .bar-lbl{font-size:9.5px; color:var(--ink-400); margin-top:1px;}
  .donutrow{display:flex; align-items:center; gap:14px; height:100%;}
  .donut{width:88px; height:88px; border-radius:50%; background:conic-gradient(var(--donutcolor, var(--accent)) calc(var(--pct)*1%), var(--surface-2) 0); display:flex; align-items:center; justify-content:center; flex:none;}
  .donut-inner{width:64px; height:64px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .donut-val{font-family:var(--font-m); font-weight:700; font-size:16px;}
  .donut-lbl{font-size:9px; color:var(--ink-400); text-transform:uppercase; letter-spacing:.04em; margin-top:1px;}
  .donutstats{flex:1;}
  .donutstats .row{font-size:12.5px; color:var(--ink-600); margin-bottom:4px; display:flex; justify-content:space-between; gap:10px;}
  .donutstats .row b{color:var(--ink); font-family:var(--font-m);}
  .donutstats .row b.bad{color:var(--bad);}
  .stackbar{display:flex; height:14px; border-radius:8px; overflow:hidden; background:var(--surface-2); margin-bottom:12px;}
  .stackbar > div{height:100%; min-width:0;}
  .stacklegend{display:flex; flex-wrap:wrap; gap:10px 16px; font-size:12px; color:var(--ink-600);}
  .stacklegend .dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:5px;}
  .stacklegend b{color:var(--ink); font-family:var(--font-m); margin-left:3px;}
  .lookuprow{display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--line);}
  .lookuprow:last-child{border-bottom:none;}
  .lookuprow.done .lookuptext{text-decoration:line-through; color:var(--ink-400);}
  .lookuptext{flex:1; border:none; background:none; color:var(--ink); font-size:14px; padding:4px 0;}
  .lookuptext:focus{outline:none;}
  .lookuprow select{border:1px solid var(--line-strong); border-radius:var(--r-s); background:var(--surface); color:var(--ink-600); font-size:11.5px; padding:5px 6px; flex:none;}
  .lookupglimpse-item{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .lookupglimpse-item:last-child{border-bottom:none;}
  .weekcal{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:20px;}
  .calcell{background:var(--surface-2); border-radius:var(--r-s); padding:8px 3px; text-align:center; min-height:66px; display:flex; flex-direction:column; align-items:center; gap:2px; border:none;}
  .calcell.today{box-shadow:inset 0 0 0 2px var(--accent);}
  .calcell.has{background:var(--accent-soft); cursor:pointer;}
  .cal-dow{font-size:9.5px; color:var(--ink-400); text-transform:uppercase; font-weight:700;}
  .cal-daynum{font-family:var(--font-m); font-weight:700; font-size:14px; color:var(--ink);}
  .cal-topic{font-size:8.5px; color:var(--accent-ink); line-height:1.2; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; margin-top:1px;}
  .cal-count{font-size:9px; color:var(--accent-ink); font-weight:700; margin-top:1px;}
  .statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:16px 0 20px;}
  .stattile{background:var(--surface-2); border-radius:var(--r-m); padding:12px 12px;}
  .stattile .v{font-family:var(--font-m); font-size:19px; font-weight:600;}
  .stattile .k{font-size:11px; color:var(--ink-600); margin-top:2px;}

  /* summary */
  .sumhead{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .sumrow{display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid var(--line); font-size:14px;}
  .sumrow:first-child{border-top:none;}
  .sumrow .k{color:var(--ink-600);}
  .sumrow .v{font-weight:600; font-family:var(--font-m);}
  .remarkbox{background:var(--surface-2); border-radius:var(--r-m); padding:14px; font-size:14px; line-height:1.5; margin-top:6px; white-space:pre-wrap;}

  /* history */
  .histcard{padding:14px 16px; margin-bottom:10px; cursor:pointer;}
  .histcard:hover{border-color:var(--line-strong);}
  .histtop{display:flex; justify-content:space-between; align-items:center;}
  .histmeta{font-size:12.5px; color:var(--ink-600); margin-top:4px;}
  .histpct{font-family:var(--font-m); font-weight:600; font-size:13px;}
  .pill{font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:20px; text-transform:uppercase; letter-spacing:.04em;}
  .pill.good{color:var(--good); background:var(--good-soft);}
  .pill.warn{color:var(--accent-ink); background:var(--accent-soft);}
  .pill.bad{color:var(--bad); background:var(--bad-soft);}
  .empty{text-align:center; padding:50px 20px; color:var(--ink-400);}
  .empty .big{font-size:34px; margin-bottom:8px;}
  .tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  .tab{border:1px solid var(--line-strong); background:var(--surface); border-radius:20px; padding:6px 13px; font-size:13px; font-weight:600; color:var(--ink-600);}
  .tab.on{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  /* area filter */
  .areagrid{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px;}
  .areachip{border:1px solid var(--line-strong); background:var(--surface); border-radius:20px; padding:8px 14px; font-size:13px; font-weight:600; color:var(--ink-600);}
  .areachip.on{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  /* pricing */
  .pricerow{display:flex; justify-content:space-between; align-items:baseline;}
  .pricetotal{font-family:var(--font-m); font-weight:800; font-size:18px;}

  /* corrective actions */
  .careow{display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line);}
  .careow:first-child{border-top:none;}
  .careow input[type="text"]{flex:1; border:none; border-bottom:1px dashed var(--line-strong); background:none; color:var(--ink); font-size:14px; padding:5px 2px;}
  .careow input[type="date"]{border:1px solid var(--line-strong); border-radius:var(--r-s); padding:6px 8px; font-size:12.5px; background:var(--surface); color:var(--ink); width:132px; flex:none;}
  .cacard2{padding:12px 16px; margin-bottom:10px;}
  .gradebandrow{display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line);}
  .gradebandrow:first-child{border-top:none;}
  .gradebandrow input[type="number"]{width:64px; border:1px solid var(--line-strong); border-radius:var(--r-s); padding:6px 8px; font-size:13px; background:var(--surface); color:var(--ink); flex:none;}
  .gradebandrow input[type="text"]{flex:1; border:none; border-bottom:1px dashed var(--line-strong); background:none; color:var(--ink); font-size:14px; padding:5px 2px;}
  .gradebandrow select{border:1px solid var(--line-strong); border-radius:var(--r-s); padding:6px 8px; font-size:12.5px; background:var(--surface); color:var(--ink); flex:none;}

  /* editor */
  .edsection{padding:14px 16px; margin-bottom:12px;}
  .edhead{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px;}
  .edhead input{font-family:var(--font-d); font-weight:700; font-size:15px; border:none; background:none; color:var(--ink); padding:2px 0; width:100%;}
  .editem{display:flex; align-items:center; gap:8px; padding:6px 0;}
  .editem input{flex:1; border:none; border-bottom:1px dashed var(--line-strong); background:none; color:var(--ink); font-size:14px; padding:5px 2px;}
  .iconbtn{background:none; border:none; color:var(--ink-400); padding:4px; border-radius:6px; flex:none;}
  .iconbtn:hover{color:var(--bad); background:var(--bad-soft);}
  .addrow{display:flex; gap:8px; margin-top:6px;}
  .addrow input{flex:1; border:1px solid var(--line-strong); border-radius:var(--r-s); padding:8px 10px; font-size:13.5px; background:var(--surface); color:var(--ink);}
  .editem-sub{display:flex; align-items:center; gap:8px; padding:0 0 8px; flex-wrap:wrap;}
  .iteminfolabel{flex:1; min-width:140px; border:1px solid var(--line-strong); border-radius:var(--r-s); padding:6px 8px; font-size:12.5px; background:var(--surface); color:var(--ink);}

  .backrow{display:flex; align-items:center; gap:8px; margin-bottom:14px; color:var(--ink-600); font-size:13px; font-weight:600; cursor:pointer; border:none; background:none; padding:0;}
  .backrow:hover{color:var(--ink);}
  .trendwrap{margin-bottom:22px;}
  .trendcap{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-400); font-family:var(--font-m); margin-top:4px;}
  [hidden]{display:none !important;}
</style>
</head>
<body>

<div class="shell" id="app"></div>

<script>
(function(){
  "use strict";
  var LS_T = 'diagnosisroom_templates_v1', LS_H = 'diagnosisroom_history_v1', LS_D = 'diagnosisroom_draft_v1', LS_P = 'diagnosisroom_pricing_v1';
  var LS_A = 'diagnosisroom_actions_v1', LS_SCHED = 'diagnosisroom_schedule_v1', LS_G = 'diagnosisroom_grades_v1';
  var LS_PR = 'diagnosisroom_prospects_v1';
  var LS_LK = 'diagnosisroom_lookups_v1';
  var LS_RO = 'diagnosisroom_reaudit_overrides_v1';
  var LS_CI = 'diagnosisroom_content_v1';

  var DEFAULT_PRICING = {
    currency: '₹',
    dinein: { baseFee: 1500, perSection: 300, perMenuItem: 5 },
    qsr: { baseFee: 1000, perSection: 250, perMenuItem: 3 },
    lowScoreThresholdPct: 80,
    lowScoreSurcharge: 500
  };

  var DEFAULT_SCHEDULE = {
    dinein: { intervalDays: 30 },
    qsr: { intervalDays: 14 }
  };

  var DEFAULT_GRADE_BANDS = [
    { id:'g1', min:90, label:'A — Excellent', tone:'good' },
    { id:'g2', min:75, label:'B — Good', tone:'good' },
    { id:'g3', min:60, label:'C — Needs Improvement', tone:'warn' },
    { id:'g4', min:0,  label:'D — Fail', tone:'bad' }
  ];

  var DEFAULT_TEMPLATES = {
    dinein: { label:'Dine-In', sections:[
      { id:'delivery', name:'Delivery Management', items:[
        'Delivery schedule posted and followed for every vendor',
        'Received goods checked against the purchase order',
        'Cold-chain items probed at receiving (≤ 5°C)',
        'Damaged or short-dated stock rejected and logged',
        'Delivery log signed by receiving staff'
      ]},
      { id:'foodsafety', name:'Food Safety & Storage', items:[
        'FIFO rotation followed in walk-in and dry store',
        'All stored items labelled with prep/use-by date',
        'Fridge and freezer temperature logs current for today',
        'Raw and ready-to-eat items stored separately',
        'Hand-wash stations stocked with soap and towels'
      ]},
      { id:'cleanliness', name:'Cleanliness & Sanitation', items:[
        'Dining floor free of spills, debris and clutter',
        'Restrooms stocked, dry and odour-free',
        'Tables and chairs wiped and reset between covers',
        'Sanitiser buckets at correct concentration on the floor'
      ]},
      { id:'service', name:'Guest Experience & Service', items:[
        'Guests greeted within 60 seconds of being seated',
        'Menus clean and free of torn or missing pages',
        'Order accuracy spot-checked against ticket',
        'Table checked back within 2 minutes of food drop'
      ]}
    ]},
    qsr: { label:'QSR', sections:[
      { id:'delivery', name:'Delivery Management', items:[
        'Delivery schedule posted and followed for every vendor',
        'Received goods checked against the purchase order',
        'Cold-chain items probed at receiving (≤ 5°C)',
        'Damaged or short-dated stock rejected and logged'
      ]},
      { id:'speed', name:'Speed of Service', items:[
        'Front counter order time within target window',
        'Drive-thru queue monitored and communicated to line',
        'Order-ready call times tracked against standard',
        'Staffing on line matches posted peak-hour schedule'
      ]},
      { id:'foodsafety', name:'Food Safety & Storage', items:[
        'Hot-hold units holding at or above 63°C',
        'FIFO rotation followed on line and in back store',
        'Fridge and freezer temperature logs current for today',
        'Hand-wash stations stocked with soap and towels'
      ]},
      { id:'cleanliness', name:'Cleanliness & Sanitation', items:[
        'Counter, trays and condiment station wiped down',
        'Restrooms stocked, dry and odour-free',
        'Sanitiser buckets at correct concentration on the line',
        'Bins emptied and lobby floor clear of spills'
      ]}
    ]}
  };

  function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
  function loadJSON(key, fallback){ try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
  function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

  function seedTemplates(t){
    var out = {};
    ['dinein','qsr'].forEach(function(type){
      out[type] = { label: t[type].label, sections: t[type].sections.map(function(s){
        return { id:s.id, name:s.name, items:(s.items||[]).map(function(it){
          if (typeof it === 'string') return { id:uid(), text:it };
          return it;
        })};
      })};
    });
    return out;
  }

  function todayISO(){ var d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function nowHHMM(){ var d = new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

  var state = {
    view: 'dashboard',
    sidebarOpen: false,
    templates: (function(){ var t = loadJSON(LS_T, null); return t ? t : seedTemplates(DEFAULT_TEMPLATES); })(),
    history: loadJSON(LS_H, []),
    draft: loadJSON(LS_D, null),
    pricing: loadJSON(LS_P, null) || JSON.parse(JSON.stringify(DEFAULT_PRICING)),
    correctiveActions: loadJSON(LS_A, []),
    schedule: loadJSON(LS_SCHED, null) || JSON.parse(JSON.stringify(DEFAULT_SCHEDULE)),
    gradeBands: loadJSON(LS_G, null) || JSON.parse(JSON.stringify(DEFAULT_GRADE_BANDS)),
    prospects: loadJSON(LS_PR, []),
    activeProspectId: null,
    pendingProspectId: null,
    prospectsFilterLocation: 'all',
    prospectsFilterCategory: 'all',
    lookups: loadJSON(LS_LK, []),
    contentIdeas: loadJSON(LS_CI, []),
    reauditOverrides: loadJSON(LS_RO, {}),
    activeContentId: null,
    setup: { type:null, storeName:'', storeLocation:'', contactName:'', contactDesignation:'', contactMobile:'', auditDate: todayISO(), auditTime: nowHHMM(), selectedSections:[], menuItemCount:'' },
    editorTab: 'dinein',
    historyTab: 'all',
    actionsTab: 'corrective',
    actionsShowDone: false,
    viewingAuditId: null,
    summaryReturnView: 'setup'
  };
  if (state.draft) state.view = 'audit';

  function persistTemplates(){ saveJSON(LS_T, state.templates); }
  function persistHistory(){ saveJSON(LS_H, state.history); }
  function persistPricing(){ saveJSON(LS_P, state.pricing); }
  function persistActions(){ saveJSON(LS_A, state.correctiveActions); }
  function persistSchedule(){ saveJSON(LS_SCHED, state.schedule); }
  function persistGrades(){ saveJSON(LS_G, state.gradeBands); }
  function persistProspects(){ saveJSON(LS_PR, state.prospects); }
  function persistLookups(){ saveJSON(LS_LK, state.lookups); }
  function persistContentIdeas(){ saveJSON(LS_CI, state.contentIdeas); }
  function persistReauditOverrides(){ saveJSON(LS_RO, state.reauditOverrides); }
  function persistDraft(){ saveJSON(LS_D, state.draft); }
  function clearDraft(){ state.draft = null; try{ localStorage.removeItem(LS_D); }catch(e){} }

  function fmtTime(ms){
    ms = Math.max(0, ms|0);
    var s = Math.floor(ms/1000);
    var h = Math.floor(s/3600); s -= h*3600;
    var m = Math.floor(s/60); s -= m*60;
    if (h>0) return h+':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }
  function fmtDateShort(ts){ var d = new Date(ts); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
  function dayName(dateStr){ if(!dateStr) return ''; var d = new Date(dateStr+'T00:00:00'); if(isNaN(d)) return ''; return d.toLocaleDateString(undefined,{weekday:'long'}); }
  function fmtAuditWhen(dateStr, timeStr){
    if (!dateStr) return '';
    var d = new Date(dateStr+'T'+(timeStr||'00:00')+':00');
    if (isNaN(d)) return dateStr;
    var day = d.toLocaleDateString(undefined,{weekday:'long'});
    var date = d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
    var time = timeStr ? d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}) : '';
    return day+' · '+date+(time?' · '+time:'');
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // ---------- timer math ----------
  function overallElapsed(d){
    var acc = d.overall.accumMs;
    if (d.overall.runningSince) acc += Date.now() - d.overall.runningSince;
    return acc;
  }
  function sectionElapsed(sec){
    var acc = sec.accumMs;
    if (sec.runningSince) acc += Date.now() - sec.runningSince;
    return acc;
  }
  function stopSection(sec){ if (sec.runningSince){ sec.accumMs += Date.now() - sec.runningSince; sec.runningSince = null; } }
  function startSection(sec){ if (!sec.runningSince) sec.runningSince = Date.now(); }
  function stopOverall(d){ if (d.overall.runningSince){ d.overall.accumMs += Date.now() - d.overall.runningSince; d.overall.runningSince = null; } }
  function startOverall(d){ if (!d.overall.runningSince) d.overall.runningSince = Date.now(); }

  function setActiveSection(d, secId){
    d.sections.forEach(function(s){ if (s.id !== secId) stopSection(s); });
    if (d.activeSectionId === secId){
      d.activeSectionId = null;
    } else {
      d.activeSectionId = secId;
      if (!d.overall.paused){
        var sec = d.sections.filter(function(s){ return s.id===secId; })[0];
        startSection(sec);
      }
    }
  }

  function sectionProgress(sec){
    var total = sec.items.length;
    var checked = sec.items.filter(function(i){ return i.state === 'checked'; });
    var na = sec.items.filter(function(i){ return i.state === 'na'; });
    var pct = total === 0 ? 100 : Math.round(checked.length/total*100);
    return { checked: checked.length, total: total, na: na.length, pct: pct };
  }
  function overallProgress(d){
    var checked=0, total=0;
    d.sections.forEach(function(s){ var p = sectionProgress(s); checked+=p.checked; total+=p.total; });
    return { checked:checked, total:total, pct: total===0?100:Math.round(checked/total*100) };
  }

  // ---------- pricing ----------
  function computePricing(type, sectionCount, menuItemCount, completionPct){
    var cfg = state.pricing[type] || { baseFee:0, perSection:0, perMenuItem:0 };
    var sectionsCost = sectionCount * (cfg.perSection||0);
    var menuCost = (menuItemCount||0) * (cfg.perMenuItem||0);
    var surcharge = completionPct < state.pricing.lowScoreThresholdPct ? (state.pricing.lowScoreSurcharge||0) : 0;
    var total = (cfg.baseFee||0) + sectionsCost + menuCost + surcharge;
    return { base:cfg.baseFee||0, sectionsCost:sectionsCost, menuCost:menuCost, surcharge:surcharge, total:total, currency: state.pricing.currency||'' };
  }

  // ---------- grading ----------
  function computeGrade(pct){
    var bands = state.gradeBands.slice().sort(function(a,b){ return b.min-a.min; });
    for (var i=0;i<bands.length;i++){ if (pct>=bands[i].min) return bands[i]; }
    return bands[bands.length-1] || { label:'—', tone:'warn' };
  }
  function gradeBadge(pct){
    var g = computeGrade(pct);
    return '<span class="pill '+esc(g.tone)+'">'+esc(g.label)+'</span>';
  }

  // ---------- re-audit schedule ----------
  function computeDueList(){
    var latestByStore = {};
    state.history.forEach(function(h){
      var key = (h.storeName||'Unnamed store').trim().toLowerCase();
      if (!latestByStore[key] || h.finishedAt > latestByStore[key].finishedAt) latestByStore[key] = h;
    });
    var todayMs = Date.now();
    return Object.keys(latestByStore).map(function(key){
      var h = latestByStore[key];
      var intervalDays = (state.schedule[h.type]||{}).intervalDays || 30;
      var computedDueAt = h.finishedAt + intervalDays*86400000;
      var override = state.reauditOverrides[key];
      var dueAt = override ? new Date(override+'T00:00:00').getTime() : computedDueAt;
      return {
        key: key, storeName: h.storeName, storeLocation: h.storeLocation, type: h.type,
        lastAuditAt: h.finishedAt, dueAt: dueAt, overridden: !!override, overrideDate: override||'',
        daysUntil: Math.ceil((dueAt-todayMs)/86400000)
      };
    }).sort(function(a,b){ return a.dueAt-b.dueAt; });
  }

  // ---------- build a fresh draft ----------
  function newDraft(type, storeName, storeLocation, contactName, contactDesignation, contactMobile, auditDate, auditTime, selectedSectionIds, menuItemCount){
    var tmpl = state.templates[type];
    var chosen = tmpl.sections.filter(function(s){ return selectedSectionIds.indexOf(s.id) !== -1; });
    if (!chosen.length) chosen = tmpl.sections;
    return {
      id: uid(), type: type, storeName: storeName||'', storeLocation: storeLocation||'',
      contactName: contactName||'', contactDesignation: contactDesignation||'', contactMobile: contactMobile||'',
      auditDate: auditDate||todayISO(), auditTime: auditTime||nowHHMM(),
      menuItemCount: Math.max(0, parseInt(menuItemCount,10)||0),
      startedAt: Date.now(), finishedAt: null, remark:'',
      correctiveActions: [],
      overall: { accumMs:0, runningSince: Date.now(), paused:false },
      activeSectionId: null,
      sections: chosen.map(function(s){
        return { id:s.id, name:s.name, accumMs:0, runningSince:null,
          items: s.items.map(function(it){ return { id:it.id, text:it.text, state:'unchecked', requiresInfo:!!it.requiresInfo, infoLabel:it.infoLabel||'', value:'' }; }) };
      })
    };
  }

  // ---------- render ----------
  var app = document.getElementById('app');

  function render(){
    var v = state.view;
    var html = '';
    if (v==='setup') html = renderSetup();
    else if (v==='audit') html = state.draft ? renderAudit(state.draft) : renderSetup();
    else if (v==='summary') html = renderSummaryView();
    else if (v==='editor') html = renderEditor();
    else if (v==='pricing') html = renderPricingSettings();
    else if (v==='actions') html = renderActionsView();
    else if (v==='prospects') html = renderProspects();
    else if (v==='lookup') html = renderLookup();
    else if (v==='content') html = renderContent();
    else if (v==='dashboard') html = renderDashboard();
    app.innerHTML = topbar() + html;
  }

  function topbar(){
    var draftActive = !!state.draft;
    var lockAttr = draftActive?'disabled title="Finish or discard the current audit first"':'';
    var openActions = state.correctiveActions.filter(function(a){ return !a.done; }).length;
    function item(view, action, label, extra){
      return '<button class="sidebarbtn '+(state.view===view?'active':'')+'" data-action="'+action+'" '+lockAttr+'><span>'+label+'</span>'+(extra?'<span class="count">'+extra+'</span>':'')+'</button>';
    }
    return '' +
      '<div class="topbar">' +
        '<button class="hamburger" data-action="toggle-sidebar" aria-label="Menu">☰</button>' +
        '<button class="brand" data-action="go-dashboard"><span class="mark">dr</span><span class="name">Diagnosis Room</span></button>' +
      '</div>' +
      '<div class="sidebar-overlay '+(state.sidebarOpen?'show':'')+'" data-action="close-sidebar"></div>' +
      '<nav class="sidebar '+(state.sidebarOpen?'open':'')+'">' +
        '<div class="sidebar-brand"><span class="mark">dr</span><span class="name">Diagnosis Room</span></div>' +
        item('dashboard','go-dashboard','Dashboard') +
        item('setup','go-setup','New Audit') +
        item('editor','go-editor','Checklist') +
        item('prospects','go-prospects','Prospects') +
        item('content','go-content','Content', state.contentIdeas.length?String(state.contentIdeas.length):'') +
        item('lookup','go-lookup','Lookup', (function(){ var n=state.lookups.filter(function(l){ return !l.done; }).length; return n?String(n):''; })()) +
        item('actions','go-actions','Actions', openActions?String(openActions):'') +
        item('pricing','go-pricing','Settings') +
      '</nav>';
  }

  function renderSetup(){
    var s = state.setup;
    var types = ['dinein','qsr'];
    var icons = { dinein:'🍽️', qsr:'⚡' };
    var descs = { dinein:'Full-service floor & kitchen walkthrough', qsr:'Counter, drive-thru & speed-of-service' };
    return '<main>' +
      '<div class="eyebrow">New Audit</div>' +
      '<h1 style="font-size:26px;margin-top:6px;">Start a floor check</h1>' +
      '<div class="formstack" style="margin-top:16px;margin-bottom:8px;">' +
        '<div class="field"><label for="contactName">Point of contact — name</label><input id="contactName" data-bind="contactName" placeholder="e.g. Priya Sharma" value="'+esc(s.contactName)+'"></div>' +
        '<div style="display:flex; gap:12px;">' +
          '<div class="field" style="flex:1;"><label for="contactDesignation">Designation</label><input id="contactDesignation" data-bind="contactDesignation" placeholder="e.g. Store Manager" value="'+esc(s.contactDesignation)+'"></div>' +
          '<div class="field" style="flex:1;"><label for="contactMobile">Mobile number</label><input id="contactMobile" type="tel" inputmode="tel" data-bind="contactMobile" placeholder="e.g. 98765 43210" value="'+esc(s.contactMobile)+'"></div>' +
        '</div>' +
      '</div>' +
      '<div class="typegrid">' +
        types.map(function(t){
          var tmpl = state.templates[t];
          var itemCount = tmpl.sections.reduce(function(n,sec){ return n+sec.items.length; },0);
          return '<button class="typecard '+(s.type===t?'selected':'')+'" data-action="pick-type" data-type="'+t+'">' +
            '<div class="ticon">'+icons[t]+'</div>' +
            '<div class="tname">'+tmpl.label+'</div>' +
            '<div class="tmeta">'+descs[t]+'</div>' +
            '<div class="tmeta mono">'+tmpl.sections.length+' sections · '+itemCount+' items</div>' +
          '</button>';
        }).join('') +
      '</div>' +
      (s.type ? renderAreaFilter(s) : '') +
      '<div class="formstack">' +
        '<div class="field"><label for="storeName">Store name</label><input id="storeName" data-bind="storeName" placeholder="e.g. Northside Grill" value="'+esc(s.storeName)+'"></div>' +
        '<div class="field"><label for="storeLocation">Store location</label><input id="storeLocation" data-bind="storeLocation" placeholder="e.g. 44 Riverside Ave, Unit 2" value="'+esc(s.storeLocation)+'"></div>' +
        '<div style="display:flex; gap:12px;">' +
          '<div class="field" style="flex:1;"><label for="auditDate">Audit date</label><input id="auditDate" type="date" data-bind="auditDate" value="'+esc(s.auditDate)+'"></div>' +
          '<div class="field" style="flex:1;"><label for="auditTime">Audit time</label><input id="auditTime" type="time" data-bind="auditTime" value="'+esc(s.auditTime)+'"></div>' +
        '</div>' +
        '<div class="helper" data-dayname style="margin-top:-6px;">'+esc(dayName(s.auditDate))+'</div>' +
        '<div class="field"><label for="menuItemCount">Number of menu items</label><input id="menuItemCount" type="number" min="0" inputmode="numeric" data-bind="menuItemCount" placeholder="e.g. 42" value="'+esc(s.menuItemCount)+'"></div>' +
      '</div>' +
      '<button class="btn btn-primary" style="width:100%;padding:14px;" data-action="start-audit" '+(s.type && s.selectedSections.length ? '' : 'disabled')+'>Start Audit &amp; Timer</button>' +
      '<div class="helper" style="text-align:center;margin-top:10px;">'+(s.type && !s.selectedSections.length ? 'Select at least one area to audit.' : 'The overall timer starts the moment you begin — tap a section below to time it individually.')+'</div>' +
    '</main>';
  }

  function renderAreaFilter(s){
    var tmpl = state.templates[s.type];
    return '<div class="field" style="margin-bottom:20px;">' +
      '<label>Select areas to audit</label>' +
      '<div class="areagrid">' +
        tmpl.sections.map(function(sec){
          var on = s.selectedSections.indexOf(sec.id) !== -1;
          return '<button type="button" class="areachip '+(on?'on':'')+'" data-action="toggle-area" data-sec="'+sec.id+'">'+(on?'✓ ':'')+esc(sec.name)+'</button>';
        }).join('') +
      '</div>' +
      '<div class="helper">Untick a section to run a shorter, focused audit on just the areas you pick.</div>' +
    '</div>';
  }

  function renderAudit(d){
    var tmpl = state.templates[d.type];
    var op = overallProgress(d);
    if (d.finishedAt) return renderRemarkStep(d);

    var secHtml = d.sections.map(function(sec, idx){
      var active = d.activeSectionId === sec.id;
      var running = !!sec.runningSince;
      var p = sectionProgress(sec);
      var itemsHtml = sec.items.map(function(it){
        var checked = it.state==='checked', na = it.state==='na';
        return '<div class="item">' +
          '<button class="chk '+(checked?'checked':'')+' '+(na?'na':'')+'" data-action="toggle-item" data-sec="'+sec.id+'" data-item="'+it.id+'" aria-label="Toggle item">' +
            (checked?'✓':(na?'–':'')) +
          '</button>' +
          '<div class="itemcol">' +
            '<div class="itemtext '+(checked?'checked':'')+' '+(na?'na':'')+'">'+esc(it.text)+'</div>' +
            (it.requiresInfo ? '<input type="text" class="itemvalue" data-bind-item="value" data-sec="'+sec.id+'" data-item="'+it.id+'" placeholder="'+esc(it.infoLabel||'Enter value')+'" value="'+esc(it.value||'')+'">' : '') +
          '</div>' +
          '<button class="naBtn '+(na?'on':'')+'" data-action="toggle-na" data-sec="'+sec.id+'" data-item="'+it.id+'" title="Not Available — counts against the score">N/A</button>' +
        '</div>';
      }).join('');
      return '<div class="section '+(active?'active':'')+'">' +
        '<button class="sechead" data-action="toggle-section" data-sec="'+sec.id+'">' +
          '<div class="secnum mono">'+String(idx+1).padStart(2,'0')+'</div>' +
          '<div class="sectitle"><div class="sname">'+esc(sec.name)+'</div><div class="smeta">'+p.checked+'/'+p.total+' checked'+(p.na?' · '+p.na+' N/A':'')+' '+gradeBadge(p.pct)+'</div></div>' +
          '<div class="sectimer '+(running?'running':'')+'"><span class="dot '+(running?'running':'')+'"></span><span data-timer="sec-'+sec.id+'">'+fmtTime(sectionElapsed(sec))+'</span></div>' +
          '<div class="chev">▼</div>' +
        '</button>' +
        '<div class="secbody" '+(active?'':'hidden')+'>'+itemsHtml+'</div>' +
      '</div>';
    }).join('');

    return '<div class="auditbar"><div style="max-width:640px;margin:0 auto;">' +
        '<div class="row1">' +
          '<div>' +
            '<span class="badge">'+tmpl.label+'</span>' +
            '<div class="storeline">'+(esc(d.storeName)||'Unnamed store')+'<div class="sub">'+(d.storeLocation?esc(d.storeLocation)+' · ':'')+fmtAuditWhen(d.auditDate,d.auditTime)+'</div></div>' +
          '</div>' +
          '<div class="timerblock"><div class="t mono" data-timer="overall">'+fmtTime(overallElapsed(d))+'</div><div class="lbl">Total Time</div></div>' +
        '</div>' +
        '<div class="overallprog"><div class="progtrack"><div class="progfill" style="width:'+op.pct+'%"></div></div>' +

  function renderTrend(list){
    if (list.length < 2) return '';
    var last = list.slice(-12);
    var w = 560, h = 90, pad = 8;
    var vals = last.map(function(h){ return h.totalMs; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (min===max){ min = 0; }
    var pts = last.map(function(h, i){
      var x = pad + (i/(last.length-1)) * (w-2*pad);
      var y = h - pad - ((h.totalMs-min)/(max-min||1)) * (h-2*pad);
      return [x,y];
    });
    var path = pts.map(function(p,i){ return (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
    var lastPt = pts[pts.length-1];
    return '<div class="trendwrap"><h2 style="font-size:15px;margin-bottom:6px;">Total duration trend</h2>' +
      '<div class="card" style="padding:12px 14px;">' +
      '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" role="img" aria-label="Audit duration trend">' +
        '<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2"/>' +
        '<circle cx="'+lastPt[0].toFixed(1)+'" cy="'+lastPt[1].toFixed(1)+'" r="3.5" fill="var(--accent)"/>' +
      '</svg>' +
      '<div class="trendcap"><span>'+fmtDateShort(last[0].finishedAt)+' · '+fmtTime(min===0&&max===0?0:Math.min.apply(null,vals))+'</span><span>longest '+fmtTime(max)+'</span><span>'+fmtDateShort(last[last.length-1].finishedAt)+'</span></div>' +
      '</div></div>';
  }
