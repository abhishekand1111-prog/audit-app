  function findContent(id){ return state.contentIdeas.filter(function(c){ return c.id===id; })[0]; }

  function contentStatus(c){
    if (c.shootDate) return { label:'Shoot '+fmtDateShort(new Date(c.shootDate+'T00:00:00').getTime()), tone: (c.shootDate<todayISO()?'bad':'good') };
    if (c.notScheduled) return { label:'Not scheduled', tone:'warn' };
    return { label:'Draft', tone:'warn' };
  }

  function renderContent(){
    if (state.activeContentId) return renderContentDetail();
    var list = state.contentIdeas.slice().sort(function(a,b){
      if (a.shootDate && b.shootDate) return a.shootDate<b.shootDate?-1:1;
      if (a.shootDate) return -1;
      if (b.shootDate) return 1;
      return (b.createdAt||0)-(a.createdAt||0);
    });
    return '<main>' +
      '<div style="display:flex; justify-content:space-between; align-items:flex-end; gap:10px; flex-wrap:wrap;">' +
        '<div><div class="eyebrow">Content Planner</div><h1 style="font-size:26px;margin-top:6px;">Insta Content &amp; Scripts</h1></div>' +
        '<button class="btn btn-primary btn-sm" data-action="add-content">+ New Idea</button>' +
      '</div>' +
      '<div class="helper" style="margin:8px 0 14px;">Idea, hook, insight, CTA and the full script — all against a shoot day, or park it with "Not scheduled" until ready.</div>' +
      (list.length===0 ? '<div class="empty"><div class="big">🎬</div>No content ideas yet.<br>Add one to start planning your next shoot.</div>' :
        list.map(function(c){
          var st = contentStatus(c);
          return '<div class="card histcard" data-action="open-content" data-id="'+c.id+'">' +
            '<div class="histtop"><span class="badge">'+(c.script&&c.script.trim()?'Scripted':'No script yet')+'</span><span class="pill '+st.tone+'">'+esc(st.label)+'</span></div>' +
            '<div style="font-weight:700;margin-top:8px;">'+esc(c.topic||'Untitled idea')+'</div>' +
            (c.hook ? '<div class="histmeta">Hook: '+esc(c.hook)+'</div>' : '') +
          '</div>';
        }).join('')
      ) +
    '</main>';
  }

  function renderContentDetail(){
    var c = findContent(state.activeContentId);
    if (!c){ state.activeContentId = null; return renderContent(); }

      '<button class="backrow" data-action="back-to-content">← Back to content</button>' +
      '<div class="eyebrow">Content Idea</div>' +

      '<div class="formstack">' +
        '<div class="field"><label for="cTopic">Idea / topic</label><input id="cTopic" data-bind-content="topic" value="'+esc(c.topic)+'" placeholder="e.g. 5 signs your kitchen would fail an audit"></div>' +
        '<div class="field"><label for="cInsight">Insight to be shared</label><textarea id="cInsight" data-bind-content="insight" placeholder="The key point / value viewers walk away with">'+esc(c.insight)+'</textarea></div>' +
        '<div class="field"><label for="cHook">Hook</label><input id="cHook" data-bind-content="hook" value="'+esc(c.hook)+'" placeholder="The first line that stops the scroll"></div>' +
        '<div class="field"><label for="cCta">CTA</label><input id="cCta" data-bind-content="cta" value="'+esc(c.cta)+'" placeholder="e.g. Comment AUDIT for a free checklist"></div>' +

        '<div class="field" style="flex:1; min-width:160px; margin-bottom:0;"><label for="cShootDate">Shoot date</label><input id="cShootDate" type="date" data-bind-content="shootDate" value="'+esc(c.shootDate)+'" '+(c.notScheduled?'disabled':'')+'></div>' +
        '<button type="button" class="naBtn '+(c.notScheduled?'on':'')+'" data-action="toggle-content-notscheduled" style="padding:9px 14px;">'+(c.notScheduled?'✓ Not scheduled':'Not now')+'</button>' +
      '</div>' +
      '<div class="field"><label for="cScript">Script — everything to say/do on shoot day</label><textarea id="cScript" data-bind-content="script" style="min-height:160px;" placeholder="Full script / shot list for the shoot">'+esc(c.script)+'</textarea></div>' +
      '<button class="btn btn-text btn-danger" style="margin-top:10px;" data-action="delete-content" data-id="'+c.id+'">Delete idea</button>' +
    '</main>';
  }

  function renderSearchResultsHtml(){
    var q = (state.searchQuery||'').trim().toLowerCase();
    if (!q) return '<div class="helper">Type to search across prospects, audit history, corrective actions and lookup/task items.</div>';
    var prospects = state.prospects.filter(function(p){ return (p.name||'').toLowerCase().indexOf(q)>=0 || (p.location||'').toLowerCase().indexOf(q)>=0; }).slice(0,20);
    var audits = state.history.filter(function(h){ return (h.storeName||'').toLowerCase().indexOf(q)>=0; }).slice(0,20);
    var actionsRes = state.correctiveActions.filter(function(a){ return (a.description||'').toLowerCase().indexOf(q)>=0 || (a.storeName||'').toLowerCase().indexOf(q)>=0; }).slice(0,20);
    var lookupsRes = state.lookups.filter(function(l){ return (l.text||'').toLowerCase().indexOf(q)>=0; }).slice(0,20);
    var total = prospects.length+audits.length+actionsRes.length+lookupsRes.length;
    if (total===0) return '<div class="empty"><div class="big">🔍</div>No results for "'+esc(state.searchQuery)+'".</div>';
    var html = '';
    if (prospects.length){
      html += '<h2 style="font-size:14px;margin:16px 0 8px;">Prospects ('+prospects.length+')</h2>' +
        prospects.map(function(p){
          return '<div class="card histcard" data-action="goto-prospect" data-id="'+p.id+'"><div style="font-weight:700;">'+esc(p.name||'Unnamed prospect')+'</div><div class="histmeta">'+esc(p.location||'—')+'</div></div>';
        }).join('');
    }
    if (audits.length){
      html += '<h2 style="font-size:14px;margin:16px 0 8px;">Audit History ('+audits.length+')</h2>' +
        audits.map(function(h){
          return '<div class="card histcard" data-action="view-audit" data-id="'+h.id+'"><div style="font-weight:700;">'+esc(h.storeName||'Unnamed store')+'</div><div class="histmeta">'+fmtAuditWhen(h.auditDate,h.auditTime)+' · '+h.completionPct+'%</div></div>';
        }).join('');
    }
    if (actionsRes.length){
      html += '<h2 style="font-size:14px;margin:16px 0 8px;">Corrective Actions ('+actionsRes.length+')</h2>' +
        actionsRes.map(function(a){
          return '<div class="card histcard" data-action="go-actions" data-tab="corrective"><div style="font-weight:700;">'+esc(a.description||'(unspecified)')+'</div><div class="histmeta">'+esc(a.storeName||'Unnamed store')+'</div></div>';
        }).join('');
    }
    if (lookupsRes.length){

        lookupsRes.map(function(l){
          return '<div class="card histcard" data-action="go-lookup"><div style="font-weight:700;">'+esc(l.text||'')+'</div></div>';

  function renderSearch(){
    return '<main>' +
      '<div class="eyebrow">Search</div>' +
      '<h1 style="font-size:26px;margin-top:6px;margin-bottom:14px;">Search everything</h1>' +
      '<input type="text" data-action="search-input" value="'+esc(state.searchQuery||'')+'" placeholder="Search prospects, audits, actions, lookup items…" style="width:100%;border:1px solid var(--line-strong);border-radius:var(--r-s);padding:12px 14px;font-size:16px;background:var(--surface);color:var(--ink);margin-bottom:6px;" autofocus>' +

  var LOOKUP_CATEGORIES = { task:'Task', lookup:'Lookup' };

  function lookupGroup(l){ return l.category==='task' ? 'task' : 'lookup'; }

  function renderLookupSection(title, icon, items, catValue){
    var openN = items.filter(function(l){ return !l.done; }).length;
    var doneN = items.length - openN;
    return '<h2 style="font-size:16px;margin:22px 0 8px;">'+icon+' '+esc(title)+'</h2>' +
      '<div class="statgrid" style="margin-top:0;">' +
        '<div class="stattile"><div class="v">'+openN+'</div><div class="k">Open</div></div>' +
        '<div class="stattile"><div class="v">'+doneN+'</div><div class="k">Done</div></div>' +
      '</div>' +
      '<button class="btn btn-ghost btn-sm" style="margin-bottom:10px;" data-action="add-lookup" data-cat="'+catValue+'">+ Add '+esc(title.toLowerCase())+'</button>' +
      (items.length===0 ? '<div class="empty" style="padding:22px 14px;"><div class="big">'+icon+'</div>Nothing here yet.</div>' :
        '<div class="card" style="padding:4px 16px;">' +
          items.map(function(l){
            return '<div class="lookuprow '+(l.done?'done':'')+'">' +
              '<button class="chk '+(l.done?'checked':'')+'" data-action="toggle-lookup-done" data-id="'+l.id+'" aria-label="Toggle done">'+(l.done?'✓':'')+'</button>' +
              '<textarea rows="1" class="lookuptext" data-action="rename-lookup" data-id="'+l.id+'" placeholder="What needs attention?">'+esc(l.text)+'</textarea>' +
              '<select data-action="lookup-category" data-id="'+l.id+'">' +
                Object.keys(LOOKUP_CATEGORIES).map(function(k){ return '<option value="'+k+'" '+(lookupGroup(l)===k?'selected':'')+'>'+LOOKUP_CATEGORIES[k]+'</option>'; }).join('') +

            '</div>';

  function renderLookup(){
    function sortFn(a,b){ if (!!a.done !== !!b.done) return a.done ? 1 : -1; return (b.createdAt||0)-(a.createdAt||0); }
    var taskItems = state.lookups.filter(function(l){ return lookupGroup(l)==='task'; }).sort(sortFn);
    var lookupItems = state.lookups.filter(function(l){ return lookupGroup(l)==='lookup'; }).sort(sortFn);
    return '<main>' +
      '<div class="eyebrow">Lookup</div>' +
      '<h1 style="font-size:26px;margin-top:6px;margin-bottom:6px;">Tasks &amp; Lookup</h1>' +
      '<div class="helper" style="margin-bottom:14px;">Anything to do or research — not tied to a specific audit.</div>' +
      renderLookupSection('Task', '✅', taskItems, 'task') +
      renderLookupSection('Lookup', '🔎', lookupItems, 'lookup') +
    '</main>';
  }

  function computeSectionInsights(){
    var stats = {};
    state.history.forEach(function(h){
      (h.sections||[]).forEach(function(s){
        var key = h.type+'|'+s.name;
        if (!stats[key]) stats[key] = { name: s.name, type: h.type, sum:0, count:0 };
        var pct = s.total ? (s.checked/s.total*100) : 100;
        stats[key].sum += pct; stats[key].count++;
      });
    });
    var arr = Object.keys(stats).map(function(k){ return stats[k]; });
    arr.forEach(function(s){ s.avgPct = Math.round(s.sum/s.count); });
    arr.sort(function(a,b){ return a.avgPct-b.avgPct; });
    return arr.slice(0,3);
  }

  function renderProblemAreasHtml(){
    if (state.history.length<2) return '';
    var insights = computeSectionInsights();
    if (!insights.length) return '';
    return '<h2 style="font-size:15px;margin-bottom:8px;">Recurring Problem Areas</h2>' +
      '<div class="card" style="padding:4px 16px;margin-bottom:20px;">' +
        insights.map(function(s){
          return '<div style="padding:10px 0;border-top:1px solid var(--line);">' +
            '<div style="display:flex;justify-content:space-between;gap:8px;"><span style="font-weight:700;">'+esc(s.name)+'</span><span class="pill '+(s.avgPct<60?'bad':'warn')+'">'+s.avgPct+'% avg</span></div>' +
            '<div class="histmeta">'+esc((state.templates[s.type]||{}).label||s.type)+' · across '+s.count+' audit'+(s.count>1?'s':'')+'</div>' +
          '</div>';
        }).join('') +
      '</div>';
  }

  function computeAlerts(){
    var todayStr = todayISO();
    var nowMs = Date.now();
    var due = computeDueList();
    var alerts = [];
    due.forEach(function(x){
      if (x.dueAt < nowMs){
        alerts.push({ tone:'bad', icon:'⏰', text: (x.storeName||'Unnamed store')+' — re-audit overdue', action:'go-actions', tab:'schedule' });
      } else {
        var dd = new Date(x.dueAt); var diso = dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');
        if (diso===todayStr) alerts.push({ tone:'warn', icon:'🗓️', text: (x.storeName||'Unnamed store')+' — re-audit due today', action:'go-actions', tab:'schedule' });
      }
    });
    state.prospects.forEach(function(p){
      if (p.plannedAuditDate && p.plannedAuditDate<=todayStr && !p.auditId && !p.declined){
        var overdue = p.plannedAuditDate < todayStr;
        alerts.push({ tone: overdue?'bad':'warn', icon:'⭐', text: (p.name||'Unnamed prospect')+' — scheduled audit '+(overdue?'was due '+fmtDateShort(new Date(p.plannedAuditDate+'T00:00:00').getTime()):'due today')+', needs check-in', action:'goto-prospect', id:p.id });
      }
      if (p.proposalStatus==='meeting_scheduled' && p.proposalMeetingDate && p.proposalMeetingDate<=todayStr && !p.converted && !p.declined){
        var mOverdue = p.proposalMeetingDate < todayStr;
        alerts.push({ tone: mOverdue?'bad':'warn', icon:'🤝', text: (p.name||'Unnamed prospect')+' — proposal meeting '+(mOverdue?'was due '+fmtDateShort(new Date(p.proposalMeetingDate+'T00:00:00').getTime()):'due today')+', follow up', action:'goto-prospect', id:p.id });
      }
    });
    state.contentIdeas.forEach(function(c){
      if (c.shootDate===todayStr){
        alerts.push({ tone:'good', icon:'🎬', text: (c.topic||'Untitled idea')+' — shoot scheduled today', action:'goto-content', id:c.id });
      }
    });
    return alerts;
  }

  function renderAlertsBanner(){
    var alerts = computeAlerts();
    if (!alerts.length) return '';
    var toneColor = { bad:'var(--bad)', warn:'var(--accent)', good:'var(--good)' };
    return '<div class="card" style="border:1.5px solid var(--bad); background:var(--bad-soft); margin-bottom:18px; padding:12px 14px;">' +
      '<div style="font-weight:700; margin-bottom:6px;">🔔 '+alerts.length+' alert'+(alerts.length>1?'s':'')+' today</div>' +
      alerts.map(function(a){
        return '<div data-action="'+a.action+'"'+(a.id?' data-id="'+a.id+'"':'')+(a.tab?' data-tab="'+a.tab+'"':'')+' style="display:flex; align-items:flex-start; gap:8px; padding:6px 0; cursor:pointer; border-left:3px solid '+toneColor[a.tone]+'; padding-left:8px; margin-top:4px;">' +
          '<span>'+a.icon+'</span><span style="flex:1; font-size:13.5px; line-height:1.4;">'+esc(a.text)+'</span>' +
        '</div>';
      }).join('') +
    '</div>';
  }

  function targetProgressRow(label, actual, target, prefix){
    if (!target) return '';
    var pct = Math.min(100, Math.round(actual/target*100));
    var met = actual>=target;
    return '<div style="margin-bottom:10px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:4px;">' +
        '<span style="font-weight:600;">'+label+'</span>' +
        '<span class="mono" style="font-weight:700;">'+prefix+actual+' / '+prefix+target+' <span style="color:'+(met?'var(--good)':'var(--ink-600)')+';">('+pct+'%)</span></span>' +
      '</div>' +
      '<div class="progtrack"><div class="progfill" style="width:'+pct+'%; background:'+(met?'var(--good)':'var(--accent)')+';"></div></div>' +
    '</div>';
  }

  function renderTargetCard(monthName, revenueMonth, clientsMonth){

        '<div style="font-weight:800;font-size:15px;">🎯 '+esc(monthName)+' Target</div>' +

      ) : '<div class="helper" style="margin:0;">No target set for this month yet — <span style="color:var(--accent-ink);font-weight:700;cursor:pointer;" data-action="go-pricing">set one in Settings →</span></div>') +
    '</div>';
  }

  function renderDashboard(){
    var now = Date.now();
    var weekAgo = now - 7*24*60*60*1000;
    var weekAhead = now + 7*24*60*60*1000;

    var auditsWeek = state.history.filter(function(h){ return h.finishedAt>=weekAgo; });
    var avgScore = auditsWeek.length ? Math.round(auditsWeek.reduce(function(n,h){ return n+h.completionPct; },0)/auditsWeek.length) : null;
    var revenueWeek = auditsWeek.reduce(function(n,h){ return n+(h.pricing?h.pricing.total:0); },0);

    var nowD = new Date(now);
    var monthStartMs = new Date(nowD.getFullYear(), nowD.getMonth(), 1).getTime();
    var monthName = nowD.toLocaleDateString(undefined,{month:'long', year:'numeric'});
    var revenueMonth = state.history.filter(function(h){ return h.finishedAt>=monthStartMs; })
      .reduce(function(n,h){ return n+(h.pricing?h.pricing.total:0); },0);
    var clientsMonth = state.prospects.filter(function(p){ return p.converted && (p.convertedAt||0)>=monthStartMs; }).length;

    var actionsOpenedWeek = state.correctiveActions.filter(function(a){ return (a.createdAt||0)>=weekAgo; }).length;
    var actionsResolvedWeek = state.correctiveActions.filter(function(a){ return a.done && (a.resolvedAt||0)>=weekAgo; }).length;
    var openActionsNow = state.correctiveActions.filter(function(a){ return !a.done; }).length;
    var todayStr = todayISO();
    var overdueActions = state.correctiveActions.filter(function(a){ return !a.done && a.dueDate && a.dueDate<todayStr; }).length;

    var prospectsAddedWeek = state.prospects.filter(function(p){ return (p.createdAt||0)>=weekAgo; }).length;
    var prospectsConvertedWeek = state.prospects.filter(function(p){ return p.converted && (p.convertedAt||0)>=weekAgo; }).length;
    var openPipeline = state.prospects.filter(function(p){ return !p.converted; }).length;

    var due = computeDueList();
    var dueSoon = due.filter(function(x){ return x.dueAt<=weekAhead; });
    var overdueDue = due.filter(function(x){ return x.dueAt<now; }).length;

    var topOpenActions = state.correctiveActions.filter(function(a){ return !a.done; }).sort(function(a,b){
      var aOver = !!(a.dueDate && a.dueDate<todayStr), bOver = !!(b.dueDate && b.dueDate<todayStr);
      if (aOver!==bOver) return aOver?-1:1;
      var ad = a.dueDate||'9999-99-99', bd = b.dueDate||'9999-99-99';
      if (ad!==bd) return ad<bd?-1:1;
      return (b.createdAt||0)-(a.createdAt||0);
    }).slice(0,5);

    var totalProspects = state.prospects.length;
    var totalConverted = state.prospects.filter(function(p){ return p.converted; }).length;

    var totalActionsAll = state.correctiveActions.length;
    var resolvedTotal = state.correctiveActions.filter(function(a){ return a.done; }).length;
    var resolutionPct = totalActionsAll ? Math.round(resolvedTotal/totalActionsAll*100) : 0;

    var notAuditedCount = state.prospects.filter(function(p){ return !p.auditId; }).length;
    var auditedOnlyCount = state.prospects.filter(function(p){ return p.auditId && !p.converted && !(p.proposed||'').trim(); }).length;
    var proposedOnlyCount = state.prospects.filter(function(p){ return p.auditId && !p.converted && (p.proposed||'').trim(); }).length;
    var stackSegs = [
      { count: notAuditedCount, color: 'var(--ink-400)', label: 'Not audited' },
      { count: auditedOnlyCount, color: 'var(--accent)', label: 'Audited' },
      { count: proposedOnlyCount, color: 'var(--accent-ink)', label: 'Proposed' },
      { count: totalConverted, color: 'var(--good)', label: 'Converted' }
    ];
    var stackTotal = totalProspects || 1;
    var stackbarHtml = '<div class="stackbar">' + stackSegs.map(function(s){
      return s.count ? '<div style="width:'+(s.count/stackTotal*100)+'%; background:'+s.color+';"></div>' : '';
    }).join('') + '</div>' +
      '<div class="stacklegend">' + stackSegs.map(function(s){
        return '<span><span class="dot" style="background:'+s.color+';"></span>'+s.label+'<b>'+s.count+'</b></span>';
      }).join('') + '</div>';

    var overdueDuePct = due.length ? Math.round(overdueDue/due.length*100) : 0;

    var scoreHistory = state.history.slice().sort(function(a,b){ return a.finishedAt-b.finishedAt; }).slice(-10);
    var sparkHtml = '';
    if (scoreHistory.length >= 2){
      var sw = 300, sh = 64, spad = 6;
      var spts = scoreHistory.map(function(h,i){
        var x = spad + (i/(scoreHistory.length-1)) * (sw-2*spad);
        var y = sh - spad - (h.completionPct/100) * (sh-2*spad);
        return [x,y];
      });
      var spath = spts.map(function(p,i){ return (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
      var slast = spts[spts.length-1];
      sparkHtml = '<div class="card dashcard" style="margin-bottom:20px;">' +
        '<div class="dashcard-title">Score trend (last '+scoreHistory.length+' audits)</div>' +
        '<svg viewBox="0 0 '+sw+' '+sh+'" width="100%" height="'+sh+'" preserveAspectRatio="none">' +
          '<path d="'+spath+'" fill="none" stroke="var(--accent)" stroke-width="2"/>' +
          '<circle cx="'+slast[0].toFixed(1)+'" cy="'+slast[1].toFixed(1)+'" r="3.5" fill="var(--accent)"/>' +
        '</svg>' +
      '</div>';
    }

    var openLookups = state.lookups.filter(function(l){ return !l.done; }).sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
    var doneLookups = state.lookups.length - openLookups.length;

    var weekDays = [];
    for (var wi=0; wi<7; wi++){
      var wd = new Date(); wd.setHours(0,0,0,0); wd.setDate(wd.getDate()+wi);
      var wIso = wd.getFullYear()+'-'+String(wd.getMonth()+1).padStart(2,'0')+'-'+String(wd.getDate()).padStart(2,'0');
      var shoots = state.contentIdeas.filter(function(c){ return c.shootDate===wIso; });
      weekDays.push({ iso: wIso, dow: wd.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2), dayNum: wd.getDate(), isToday: wi===0, shoots: shoots });
    }
    var weekCalHtml = '<div class="weekcal">' + weekDays.map(function(d){
      var has = d.shoots.length>0;
      var first = has ? d.shoots[0] : null;
      return '<div class="calcell '+(has?'has':'')+' '+(d.isToday?'today':'')+'" '+(has?'data-action="goto-content" data-id="'+first.id+'"':'')+'>' +
        '<div class="cal-dow">'+d.dow+'</div>' +
        '<div class="cal-daynum">'+d.dayNum+'</div>' +
        (has ? '<div class="cal-count">'+d.shoots.length+'</div>' : '') +
      '</div>';
    }).join('') + '</div>';

    var reTodayDate = new Date(); reTodayDate.setHours(0,0,0,0);
    var reTodayTime = reTodayDate.getTime();
    function reIsoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
    var reTodayIso = reIsoOf(reTodayDate);
    var dueByDay = {};
    due.forEach(function(x){
      var bucketDate = x.dueAt < now ? new Date(reTodayTime) : new Date(x.dueAt);
      bucketDate.setHours(0,0,0,0);
      var iso = reIsoOf(bucketDate);
      if (!dueByDay[iso]) dueByDay[iso] = [];
      dueByDay[iso].push(x);
    });
    var chosenIso = Object.keys(dueByDay).sort().slice(0,7);
    var reFillCursor = new Date(reTodayDate);
    while (chosenIso.length<7){
      var fIso = reIsoOf(reFillCursor);
      if (chosenIso.indexOf(fIso)===-1) chosenIso.push(fIso);
      reFillCursor.setDate(reFillCursor.getDate()+1);
    }
    chosenIso.sort();
    var reWeekDays = chosenIso.map(function(iso){
      var parts = iso.split('-').map(Number);
      var dObj = new Date(parts[0], parts[1]-1, parts[2]);
      var dowLabel = dObj.getMonth()!==reTodayDate.getMonth() ? dObj.toLocaleDateString(undefined,{month:'short'}).toUpperCase() : dObj.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2);
      return { dow: dowLabel, dayNum: dObj.getDate(), isToday: iso===reTodayIso, items: dueByDay[iso]||[] };
    });
    var reCalHtml = '<div class="weekcal">' + reWeekDays.map(function(d){
      var has = d.items.length>0;
      return '<div class="calcell '+(has?'has':'')+' '+(d.isToday?'today':'')+'" '+(has?'data-action="go-actions"':'')+'>' +
        '<div class="cal-dow">'+d.dow+'</div>' +
        '<div class="cal-daynum">'+d.dayNum+'</div>' +
        (has ? '<div class="cal-count">'+d.items.length+'</div>' : '') +
      '</div>';
    }).join('') + '</div>';

    return '<main>' +
      renderTargetCard(monthName, revenueMonth, clientsMonth) +
      '<div class="eyebrow">Last 7 Days</div>' +
      '<h1 style="font-size:26px;margin-top:6px;margin-bottom:16px;">Welcome back</h1>' +
      renderAlertsBanner() +
      '<button class="btn btn-primary" style="width:100%;padding:14px;margin-bottom:22px;" data-action="go-setup">+ Start New Audit</button>' +

      sparkHtml +

      renderProblemAreasHtml() +

      '<h2 style="font-size:15px;margin-bottom:8px;">Shoot Days This Week</h2>' +
      weekCalHtml +

      '<h2 style="font-size:15px;margin-bottom:8px;">Corrective Actions</h2>' +
      '<div class="statgrid" style="margin-top:0;margin-bottom:12px;">' +
        '<div class="stattile"><div class="v">'+openActionsNow+'</div><div class="k">Open</div></div>' +
        '<div class="stattile"><div class="v" style="'+(overdueActions?'color:var(--bad);':'')+'">'+overdueActions+'</div><div class="k">Overdue</div></div>' +
        '<div class="stattile"><div class="v">'+actionsResolvedWeek+'</div><div class="k">Resolved (7d)</div></div>' +
        '<div class="stattile"><div class="v">'+resolutionPct+'%</div><div class="k">Resolved All-time</div></div>' +
      '</div>' +
      (topOpenActions.length===0 ? '<div class="helper" style="margin-bottom:20px;">No open corrective actions.</div>' :
        '<div style="margin-bottom:'+(openActionsNow>topOpenActions.length?'8px':'20px')+';">' +
          topOpenActions.map(function(a){
            var overdue = a.dueDate && a.dueDate<todayStr;
            return '<div class="card histcard">' +
              '<div class="histtop"><span class="badge">'+esc(a.storeName||'Unnamed store')+'</span>'+(a.dueDate ? '<span class="pill '+(overdue?'bad':'warn')+'">'+(overdue?'Overdue':fmtDateShort(new Date(a.dueDate+'T00:00:00').getTime()))+'</span>' : '')+'</div>' +
              '<div style="font-weight:700;margin-top:8px;">'+esc(a.description||'(unspecified)')+'</div>' +
              '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:8px;" data-action="resolve-action" data-id="'+a.id+'">Mark done</button>' +
            '</div>';
          }).join('') +
        '</div>' +
        (openActionsNow>topOpenActions.length ? '<button class="btn btn-ghost btn-sm" style="margin-bottom:20px;" data-action="go-actions">View all '+openActionsNow+' open actions →</button>' : '')
      ) +

      '<h2 style="font-size:15px;margin-bottom:8px;">Prospects</h2>' +
      '<div class="card dashcard" style="margin-bottom:20px;">' +
        (totalProspects===0 ? '<div class="helper" style="margin:0;">No prospects yet.</div>' : stackbarHtml) +
      '</div>' +
      '<div class="statgrid" style="margin-bottom:20px;">' +
        '<div class="stattile"><div class="v">'+prospectsAddedWeek+'</div><div class="k">Added (7d)</div></div>' +
        '<div class="stattile"><div class="v">'+prospectsConvertedWeek+'</div><div class="k">Converted (7d)</div></div>' +
        '<div class="stattile"><div class="v">'+openPipeline+'</div><div class="k">Open Pipeline</div></div>' +
      '</div>' +

      '<h2 style="font-size:15px;margin-bottom:8px;">Re-audits Due — Next 7</h2>' +
      reCalHtml +
      (due.length===0 ? '<div class="helper" style="margin-top:8px;">Complete an audit to start tracking re-audit schedules.</div>' :
        '<button class="btn btn-ghost btn-sm" style="margin-top:8px;" data-action="go-actions">View schedule →</button>'
      ) +
    '</main>';
  }

  // ---------- ticking ----------
  setInterval(function(){
    if (state.view!=='audit' || !state.draft || state.draft.finishedAt) return;
    var d = state.draft;
    var ot = document.querySelector('[data-timer="overall"]');
    if (ot) ot.textContent = fmtTime(overallElapsed(d));
    d.sections.forEach(function(sec){
      var el = document.querySelector('[data-timer="sec-'+sec.id+'"]');
      if (el) el.textContent = fmtTime(sectionElapsed(sec));
    });
  }, 1000);

  // ---------- CSV download (plain browser save, no artifact sandbox here) ----------
  function downloadCSV(csv, filename){
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function downloadJSON(json, filename){
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  // ---------- event delegation ----------
  app.addEventListener('click', function(e){
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var action = t.dataset.action;
    var d = state.draft;
    if (d && !d.correctiveActions) d.correctiveActions = [];
    if (action.indexOf('go-')===0) state.sidebarOpen = false;

    if (action==='toggle-sidebar'){ state.sidebarOpen = !state.sidebarOpen; render(); }
    else if (action==='close-sidebar'){ state.sidebarOpen = false; render(); }
    else if (action==='go-dashboard'){ if(!state.draft){ state.view='dashboard'; render(); } }
    else if (action==='go-setup'){ if(!state.draft) { state.view='setup'; render(); } }
    else if (action==='go-editor'){ if(!state.draft){ state.view='editor'; render(); } }
    else if (action==='go-pricing'){ if(!state.draft){ state.view='pricing'; render(); } }
    else if (action==='go-actions'){ if(!state.draft){ if (t.dataset.tab) state.actionsTab = t.dataset.tab; state.view='actions'; render(); } }
    else if (action==='go-prospects'){ if(!state.draft){ state.activeProspectId=null; state.view='prospects'; render(); } }
    else if (action==='go-lookup'){ if(!state.draft){ state.view='lookup'; render(); } }
    else if (action==='go-search'){ if(!state.draft){ state.view='search'; render(); } }
    else if (action==='go-content'){ if(!state.draft){ state.activeContentId=null; state.view='content'; render(); } }
    else if (action==='add-content'){
      var newC = { id: uid(), topic:'', insight:'', hook:'', cta:'', shootDate:'', notScheduled:false, script:'', createdAt: Date.now() };
      state.contentIdeas.unshift(newC); persistContentIdeas();
      state.activeContentId = newC.id; render();
    }
    else if (action==='open-content'){ state.activeContentId = t.dataset.id; render(); }
    else if (action==='goto-content'){ if(!state.draft){ state.activeContentId = t.dataset.id; state.view='content'; render(); } }
    else if (action==='back-to-content'){ state.activeContentId = null; render(); }
    else if (action==='delete-content'){
      if (window.confirm('Delete this content idea? This cannot be undone.')){
        state.contentIdeas = state.contentIdeas.filter(function(c){ return c.id!==t.dataset.id; });
        persistContentIdeas();
        state.activeContentId = null; render();
      }
    }
    else if (action==='toggle-content-notscheduled'){
      var nc = findContent(state.activeContentId);
      if (nc){ nc.notScheduled = !nc.notScheduled; if (nc.notScheduled) nc.shootDate=''; persistContentIdeas(); render(); }
    }
    else if (action==='add-lookup'){
      var newLkCat = t.dataset.cat==='lookup' ? 'lookup' : 'task';
      var newLk = { id: uid(), text:'', category:newLkCat, done:false, createdAt: Date.now() };
      state.lookups.unshift(newLk);
      persistLookups(); render();
      var firstInput = app.querySelector('.lookuptext[data-id="'+newLk.id+'"]');
      if (firstInput) firstInput.focus();
    }
    else if (action==='toggle-lookup-done'){
      var lk = state.lookups.filter(function(l){ return l.id===t.dataset.id; })[0];
      if (lk){ lk.done = !lk.done; lk.doneAt = lk.done ? Date.now() : null; persistLookups(); render(); }
    }
    else if (action==='delete-lookup'){
      state.lookups = state.lookups.filter(function(l){ return l.id!==t.dataset.id; });
      persistLookups(); render();
    }
    else if (action==='add-prospect'){
      var newP = { id: uid(), name:'', location:'', address:'', category:'', auditId:null,
        plannedAuditDate:'', checkinNote:'', proposed:'', priceMin:'', priceMax:'', converted:false, convertedAt:null,
        declined:false, declinedAt:null, followUpDate:'', finalPrice:'', timeline:'', createdAt: Date.now(),
        servicesOffered:'', pricingType:'', proposalStatus:'', proposalMeetingDate:'', auditsPerMonth:'',
        contactName:'', contactDesignation:'', contactMobile:'' };
      state.prospects.push(newP); persistProspects();
      state.activeProspectId = newP.id; render();
    }
    else if (action==='open-prospect'){ state.activeProspectId = t.dataset.id; render(); }
    else if (action==='goto-prospect'){ if(!state.draft){ state.activeProspectId = t.dataset.id; state.view='prospects'; render(); } }
    else if (action==='back-to-prospects'){ state.activeProspectId = null; render(); }
    else if (action==='delete-prospect'){
      if (window.confirm('Delete this prospect? This cannot be undone.')){
        state.prospects = state.prospects.filter(function(p){ return p.id!==t.dataset.id; });
        persistProspects();
        state.activeProspectId = null; render();
      }
    }
    else if (action==='start-audit-from-prospect'){
      var sp = findProspect(state.activeProspectId);
      if (!sp || !(sp.name||'').trim()) return;
      state.setup.type = null;
      state.setup.storeName = sp.name;
      state.setup.storeLocation = [sp.location, sp.address].filter(Boolean).join(', ');
      state.setup.contactName = ''; state.setup.contactDesignation = ''; state.setup.contactMobile = '';
      state.setup.selectedSections = [];
      state.setup.menuItemCount = '';
      state.pendingProspectId = sp.id;
      state.view = 'setup'; render();
    }
    else if (action==='start-reaudit'){
      if (state.draft) return;
      var raName = t.dataset.name, raType = t.dataset.type;
      var raMatch = state.prospects.filter(function(p){ return (p.name||'').trim().toLowerCase()===(raName||'').trim().toLowerCase(); })[0];
      state.setup.type = raType;
      state.setup.storeName = raName;
      state.setup.storeLocation = t.dataset.location || (raMatch?raMatch.location:'') || '';
      state.setup.contactName = raMatch ? (raMatch.contactName||'') : '';
      state.setup.contactDesignation = raMatch ? (raMatch.contactDesignation||'') : '';
      state.setup.contactMobile = raMatch ? (raMatch.contactMobile||'') : '';
      state.setup.selectedSections = state.templates[raType] ? state.templates[raType].sections.map(function(s){ return s.id; }) : [];
      state.setup.menuItemCount = '';
      state.pendingProspectId = raMatch ? raMatch.id : null;
      state.view = 'setup'; render();
    }
    else if (action==='clear-reaudit-override'){
      delete state.reauditOverrides[t.dataset.key];
      persistReauditOverrides(); render();
    }
    else if (action==='delete-store-audits'){
      if (window.confirm('Delete ALL audit history for "'+t.dataset.name+'"? This cannot be undone.')){
        var dkey = t.dataset.key;
        state.history = state.history.filter(function(h){ return (h.storeName||'').trim().toLowerCase()!==dkey; });
        persistHistory();
        delete state.reauditOverrides[dkey];
        persistReauditOverrides();
        render();
      }
    }
    else if (action==='toggle-prospect-converted'){
      var cp = findProspect(state.activeProspectId);
      if (cp){
        cp.converted = !cp.converted; cp.convertedAt = cp.converted ? Date.now() : null;
        if (cp.converted){ cp.declined = false; cp.declinedAt = null; }
        persistProspects(); render();
      }
    }
    else if (action==='toggle-prospect-declined'){
      var dp = findProspect(state.activeProspectId);
      if (dp){
        dp.declined = !dp.declined; dp.declinedAt = dp.declined ? Date.now() : null;
        if (dp.declined){ dp.converted = false; dp.convertedAt = null; }
        persistProspects(); render();
      }
    }
    else if (action==='reactivate-prospect'){
      var rp = findProspect(state.activeProspectId);
      if (rp){ rp.declined = false; rp.declinedAt = null; persistProspects(); render(); }
    }
    else if (action==='set-prospect-category'){
      var ctp = findProspect(state.activeProspectId);
      if (ctp){ ctp.category = (ctp.category===t.dataset.val) ? '' : t.dataset.val; persistProspects(); render(); }
    }
    else if (action==='pick-type'){
      state.setup.type = t.dataset.type;
      state.setup.selectedSections = state.templates[t.dataset.type].sections.map(function(s){ return s.id; });
      render();
    }
    else if (action==='toggle-area'){
      var areaId = t.dataset.sec;
      var idx = state.setup.selectedSections.indexOf(areaId);
      if (idx===-1) state.setup.selectedSections.push(areaId); else state.setup.selectedSections.splice(idx,1);
      render();
    }
    else if (action==='start-audit'){
      if (!state.setup.type || !state.setup.selectedSections.length) return;
      state.draft = newDraft(state.setup.type, state.setup.storeName, state.setup.storeLocation, state.setup.contactName, state.setup.contactDesignation, state.setup.contactMobile, state.setup.auditDate, state.setup.auditTime, state.setup.selectedSections, state.setup.menuItemCount);
      persistDraft();
      state.view='audit'; render();
    }
    else if (action==='toggle-section'){ setActiveSection(d, t.dataset.sec); persistDraft(); render(); }
    else if (action==='toggle-item'){
      var sec = d.sections.filter(function(s){return s.id===t.dataset.sec;})[0];
      var it = sec.items.filter(function(i){return i.id===t.dataset.item;})[0];
      it.state = it.state==='checked' ? 'unchecked' : 'checked';
      persistDraft(); render();
    }
    else if (action==='toggle-na'){
      var sec2 = d.sections.filter(function(s){return s.id===t.dataset.sec;})[0];
      var it2 = sec2.items.filter(function(i){return i.id===t.dataset.item;})[0];
      it2.state = it2.state==='na' ? 'unchecked' : 'na';
      persistDraft(); render();
    }
    else if (action==='toggle-pause'){
      if (d.overall.paused){
        d.overall.paused=false; startOverall(d);
        if (d.activeSectionId){ var s3 = d.sections.filter(function(s){return s.id===d.activeSectionId;})[0]; startSection(s3); }
      } else {
        d.overall.paused=true; stopOverall(d);
        d.sections.forEach(stopSection);
      }
      persistDraft(); render();
    }
    else if (action==='discard-audit'){
      if (window.confirm('Discard this in-progress audit? This cannot be undone.')){ clearDraft(); state.view='setup'; render(); }
    }
    else if (action==='finish-audit'){
      stopOverall(d); d.sections.forEach(stopSection);
      d.finishedAt = Date.now();
      persistDraft(); render();
    }
    else if (action==='resume-checklist'){
      d.finishedAt = null; persistDraft(); render();
    }
    else if (action==='add-custom-action'){
      d.correctiveActions.push({ id: uid(), sourceItemId: null, description: '', dueDate: '' });
      persistDraft(); render();
    }
    else if (action==='ca-remove'){
      d.correctiveActions = d.correctiveActions.filter(function(ca){ return ca.id!==t.dataset.ca; });
      persistDraft(); render();
    }
    else if (action==='complete-audit'){
      if (!(d.remark||'').trim()) return;
      var rec = computeRecord(d);
      state.history.push(rec); persistHistory();
      (d.correctiveActions||[]).forEach(function(ca){
        state.correctiveActions.push({
          id: ca.id, auditId: rec.id, storeName: d.storeName, storeLocation: d.storeLocation,
          type: d.type, description: (ca.description||'').trim() || '(unspecified)', dueDate: ca.dueDate||'',
          sourceItemId: ca.sourceItemId||null, done: false, createdAt: Date.now()
        });
      });
      persistActions();
      clearDraft();

      var linkedP = state.pendingProspectId ? findProspect(state.pendingProspectId) : null;
      var key = (d.storeName||'').trim().toLowerCase();
      if (!linkedP && key){
        linkedP = state.prospects.filter(function(p){ return (p.name||'').trim().toLowerCase()===key; })[0];
      }
      if (!linkedP && key){
        linkedP = { id: uid(), name: d.storeName, location: d.storeLocation, address:'', category: d.type,
          auditId: rec.id, plannedAuditDate:'', proposed:'', priceMin:'', priceMax:'', converted:false, convertedAt:null,
          declined:false, declinedAt:null, followUpDate:'', finalPrice:'', timeline:'',
          servicesOffered:'', pricingType:'', proposalStatus:'', proposalMeetingDate:'', auditsPerMonth:'',
          contactName: d.contactName||'', contactDesignation: d.contactDesignation||'', contactMobile: d.contactMobile||'',
          createdAt: Date.now() };
        state.prospects.unshift(linkedP);
      } else if (linkedP){
        linkedP.auditId = rec.id;
        if (!linkedP.category) linkedP.category = d.type;
        if (!linkedP.location) linkedP.location = d.storeLocation;
        if (!linkedP.contactName) linkedP.contactName = d.contactName||linkedP.contactName||'';
        if (!linkedP.contactDesignation) linkedP.contactDesignation = d.contactDesignation||linkedP.contactDesignation||'';
        if (!linkedP.contactMobile) linkedP.contactMobile = d.contactMobile||linkedP.contactMobile||'';
      }
      state.pendingProspectId = null;
      if (linkedP){
        persistProspects();
        state.activeProspectId = linkedP.id;
        state.view = 'prospects'; render();
      } else {
        state.viewingAuditId = rec.id; state.summaryReturnView='setup';
        state.view='summary'; render();
      }
    }
    else if (action==='resolve-action'){
      var act = state.correctiveActions.filter(function(a){ return a.id===t.dataset.id; })[0];
      if (act){ act.done = true; act.resolvedAt = Date.now(); persistActions(); render(); }
    }
    else if (action==='reopen-action'){
      var act2 = state.correctiveActions.filter(function(a){ return a.id===t.dataset.id; })[0];
      if (act2){ act2.done = false; persistActions(); render(); }
    }
    else if (action==='snooze-action'){
      var act3 = state.correctiveActions.filter(function(a){ return a.id===t.dataset.id; })[0];
      if (act3){
        var baseTime = act3.dueDate ? new Date(act3.dueDate+'T00:00:00').getTime() : Date.now();
        var snoozed = new Date(Math.max(baseTime, Date.now()) + 3*24*60*60*1000);
        act3.dueDate = snoozed.getFullYear()+'-'+String(snoozed.getMonth()+1).padStart(2,'0')+'-'+String(snoozed.getDate()).padStart(2,'0');
        persistActions(); render();
      }
    }
    else if (action==='toggle-show-done'){ state.actionsShowDone = !state.actionsShowDone; render(); }
    else if (action==='actions-tab'){ state.actionsTab = t.dataset.tab; render(); }
    else if (action==='prospects-tab'){ state.prospectsTab = t.dataset.tab; render(); }
    else if (action==='export-csv'){
      var csv = buildHistoryCSV();
      downloadCSV(csv, 'diagnosis-room-audits-'+todayISO()+'.csv');
    }
    else if (action==='export-prospects-csv'){
      var pcsv = buildProspectsCSV();
      downloadCSV(pcsv, 'diagnosis-room-prospects-'+todayISO()+'.csv');
    }
    else if (action==='download-backup'){
      var json = buildBackupJSON();
      downloadJSON(json, 'diagnosis-room-backup-'+todayISO()+'.json');
    }
    else if (action==='trigger-restore-backup'){
      var rbInput = document.getElementById('restoreBackupInput');
      if (rbInput) rbInput.click();
    }
    else if (action==='view-audit'){ state.viewingAuditId = t.dataset.id; state.summaryReturnView=state.view; state.view='summary'; render(); }
    else if (action==='back-from-summary'){ state.view = state.summaryReturnView; render(); }
    else if (action==='editor-tab'){ state.editorTab = t.dataset.tab; render(); }
    else if (action==='delete-section'){
      var tmpl = state.templates[state.editorTab];
      tmpl.sections = tmpl.sections.filter(function(s){ return s.id!==t.dataset.sec; });
      persistTemplates(); render();
    }
    else if (action==='delete-item'){
      var tmpl2 = state.templates[state.editorTab];
      var sec4 = tmpl2.sections.filter(function(s){return s.id===t.dataset.sec;})[0];
      sec4.items = sec4.items.filter(function(i){ return i.id!==t.dataset.item; });
      persistTemplates(); render();
    }
    else if (action==='toggle-requires-info'){
      var tmplRI = state.templates[state.editorTab];
      var secRI = tmplRI.sections.filter(function(s){return s.id===t.dataset.sec;})[0];
      var itRI = secRI && secRI.items.filter(function(i){return i.id===t.dataset.item;})[0];
      if (itRI){ itRI.requiresInfo = !itRI.requiresInfo; persistTemplates(); render(); }
    }
    else if (action==='add-item'){
      var input = app.querySelector('[data-newitem-for="'+t.dataset.sec+'"]');
      var text = (input.value||'').trim();
      if (!text) return;
      var tmpl3 = state.templates[state.editorTab];
      var sec5 = tmpl3.sections.filter(function(s){return s.id===t.dataset.sec;})[0];
      sec5.items.push({ id:uid(), text:text });
      persistTemplates(); render();
    }
    else if (action==='add-section'){
      var input2 = app.querySelector('[data-newsection]');
      var name = (input2.value||'').trim();
      if (!name) return;
      var tmpl4 = state.templates[state.editorTab];
      tmpl4.sections.push({ id:uid(), name:name, items:[] });
      persistTemplates(); render();
    }
    else if (action==='reset-template'){
      if (window.confirm('Reset the '+state.templates[state.editorTab].label+' checklist to the built-in defaults? Custom sections and items will be lost.')){
        var seeded = seedTemplates(DEFAULT_TEMPLATES);
        state.templates[state.editorTab] = seeded[state.editorTab];
        persistTemplates(); render();
      }
    }
    else if (action==='reset-pricing'){
      if (window.confirm('Reset pricing settings to defaults?')){
        state.pricing = JSON.parse(JSON.stringify(DEFAULT_PRICING));
        persistPricing(); render();
      }
    }
    else if (action==='grade-add'){
      state.gradeBands.push({ id: uid(), min: 50, label: 'New band', tone: 'warn' });
      persistGrades(); render();
    }
    else if (action==='grade-remove'){
      state.gradeBands = state.gradeBands.filter(function(gb){ return gb.id!==t.dataset.gb; });
      persistGrades(); render();
    }
    else if (action==='reset-grades'){
      if (window.confirm('Reset grade bands to defaults?')){
        state.gradeBands = JSON.parse(JSON.stringify(DEFAULT_GRADE_BANDS));
        persistGrades(); render();
      }
    }
    else if (action==='svc-add'){
      var nextNum = state.serviceClasses.reduce(function(m,sc){ return Math.max(m,sc.number); },0)+1;
      state.serviceClasses.push({ id: uid(), number: nextNum, label: 'New service' });
      persistServiceClasses(); render();
    }
    else if (action==='svc-remove'){
      state.serviceClasses = state.serviceClasses.filter(function(sc){ return sc.id!==t.dataset.svc; });
      persistServiceClasses(); render();
    }
    else if (action==='reset-svc'){
      if (window.confirm('Reset service classes to defaults?')){
        state.serviceClasses = JSON.parse(JSON.stringify(DEFAULT_SERVICE_CLASSES));
        persistServiceClasses(); render();
      }
    }
  });

  app.addEventListener('input', function(e){
    var el = e.target;
    if (el.dataset.bind === 'storeName'){ state.setup.storeName = el.value; }
    else if (el.dataset.bind === 'storeLocation'){ state.setup.storeLocation = el.value; }
    else if (el.dataset.bind === 'contactName'){ state.setup.contactName = el.value; }
    else if (el.dataset.bind === 'contactDesignation'){ state.setup.contactDesignation = el.value; }
    else if (el.dataset.bind === 'contactMobile'){ state.setup.contactMobile = el.value; }
    else if (el.dataset.bind === 'auditDate'){ state.setup.auditDate = el.value; var dn = app.querySelector('[data-dayname]'); if (dn) dn.textContent = dayName(el.value); }
    else if (el.dataset.bind === 'auditTime'){ state.setup.auditTime = el.value; }
    else if (el.dataset.bind === 'menuItemCount'){ state.setup.menuItemCount = el.value; }
    else if (el.dataset.bind === 'remark' && state.draft){ state.draft.remark = el.value; persistDraft();
      var btn = app.querySelector('[data-action="complete-audit"]');
      if (btn) btn.disabled = !el.value.trim();
    }
    else if (el.dataset.action === 'rename-section'){
      var tmpl = state.templates[state.editorTab];
      var sec = tmpl.sections.filter(function(s){return s.id===el.dataset.sec;})[0];
      if (sec){ sec.name = el.value; persistTemplates(); }
    }
    else if (el.dataset.action === 'rename-item'){
      var tmpl2 = state.templates[state.editorTab];
      var sec2 = tmpl2.sections.filter(function(s){return s.id===el.dataset.sec;})[0];
      var it = sec2 && sec2.items.filter(function(i){return i.id===el.dataset.item;})[0];
      if (it){ it.text = el.value; persistTemplates(); }
    }
    else if (el.dataset.action === 'edit-info-label'){
      var tmplIL = state.templates[state.editorTab];
      var secIL = tmplIL.sections.filter(function(s){return s.id===el.dataset.sec;})[0];
      var itIL = secIL && secIL.items.filter(function(i){return i.id===el.dataset.item;})[0];
      if (itIL){ itIL.infoLabel = el.value; persistTemplates(); }
    }
    else if (el.dataset.bindItem === 'value' && state.draft){
      var secV = state.draft.sections.filter(function(s){return s.id===el.dataset.sec;})[0];
      var itV = secV && secV.items.filter(function(i){return i.id===el.dataset.item;})[0];
      if (itV){ itV.value = el.value; persistDraft(); }
    }
    else if (el.dataset.pricing){
      var path = el.dataset.pricing.split('.');
      if (path.length>1){
        var num = parseFloat(el.value); if (isNaN(num)) num = 0;
        state.pricing[path[0]][path[1]] = num;
      } else if (path[0] === 'currency'){
        state.pricing.currency = el.value;
      } else {
        var num2 = parseFloat(el.value); if (isNaN(num2)) num2 = 0;
        state.pricing[path[0]] = num2;
      }
      persistPricing();
    }
    else if (el.dataset.target){
      var tnum = parseFloat(el.value); if (isNaN(tnum)) tnum = 0;
      state.targets[el.dataset.target] = tnum;
      persistTargets();
    }
    else if (el.dataset.caEditField){
      var caEdit = state.correctiveActions.filter(function(a){ return a.id===el.dataset.caEditId; })[0];
      if (caEdit){
        caEdit[el.dataset.caEditField] = el.value;
        persistActions();
        if (el.dataset.caEditField==='dueDate') render();
      }
    }
    else if (el.dataset.caField && state.draft){
      var ca = state.draft.correctiveActions.filter(function(c){ return c.id===el.dataset.ca; })[0];
      if (ca){ ca[el.dataset.caField] = el.value; persistDraft(); }
    }
    else if (el.dataset.gbField){
      var gb = state.gradeBands.filter(function(g){ return g.id===el.dataset.gb; })[0];
      if (gb){
        if (el.dataset.gbField==='min'){ var m = parseFloat(el.value); gb.min = isNaN(m)?0:m; }
        else { gb[el.dataset.gbField] = el.value; }
        persistGrades();
      }
    }
    else if (el.dataset.svcField){
      var sc2 = state.serviceClasses.filter(function(s){ return s.id===el.dataset.svc; })[0];
      if (sc2){
        if (el.dataset.svcField==='number'){ var svn = parseInt(el.value,10); sc2.number = isNaN(svn)?1:svn; }
        else { sc2[el.dataset.svcField] = el.value; }
        persistServiceClasses();
      }
    }
    else if (el.dataset.bindProspect){
      var bp = findProspect(state.activeProspectId);
      if (bp){
        bp[el.dataset.bindProspect] = el.value; persistProspects();
        if (el.dataset.bindProspect==='name'){
          var sabtn = app.querySelector('[data-action="start-audit-from-prospect"]');
          if (sabtn) sabtn.disabled = !el.value.trim();
        }
        if (el.dataset.bindProspect==='plannedAuditDate' || el.dataset.bindProspect==='servicesOffered') render();
      }
    }
    else if (el.dataset.reauditKey){
      var rkey = el.dataset.reauditKey;
      if (el.value){ state.reauditOverrides[rkey] = el.value; } else { delete state.reauditOverrides[rkey]; }
      persistReauditOverrides(); render();
    }
    else if (el.dataset.bindContent){
      var bc = findContent(state.activeContentId);
      if (bc){
        bc[el.dataset.bindContent] = el.value;
        if (el.dataset.bindContent==='shootDate' && el.value) bc.notScheduled = false;
        persistContentIdeas();
      }
    }
    else if (el.dataset.action==='rename-lookup'){
      var rlk = state.lookups.filter(function(l){ return l.id===el.dataset.id; })[0];
      if (rlk){ rlk.text = el.value; persistLookups(); }
      el.style.height = 'auto'; el.style.height = el.scrollHeight+'px';
    }
    else if (el.dataset.action==='search-input'){
      state.searchQuery = el.value;
      var srC = document.getElementById('searchResultsContainer');
      if (srC) srC.innerHTML = renderSearchResultsHtml();
    }
    else if (el.dataset.action==='lookup-category'){
      var clk = state.lookups.filter(function(l){ return l.id===el.dataset.id; })[0];
      if (clk){ clk.category = el.value; persistLookups(); render(); }
    }
    else if (el.dataset.prospectFilter==='location'){ state.prospectsFilterLocation = el.value; render(); }
    else if (el.dataset.prospectFilter==='category'){ state.prospectsFilterCategory = el.value; render(); }
    else if (el.dataset.schedule){
      var spath = el.dataset.schedule.split('.');
      var sday = parseInt(el.value,10); if (isNaN(sday) || sday<1) sday = 1;
      state.schedule[spath[0]][spath[1]] = sday;
      persistSchedule();
    }
  });

  app.addEventListener('change', function(e){
    var el = e.target;
    if (el.dataset.action==='set-pricing-type-select'){
      var ptp = findProspect(state.activeProspectId);
      if (ptp){ ptp.pricingType = el.value; persistProspects(); }
    }
    else if (el.dataset.action==='set-proposal-status-select'){
      var psp = findProspect(state.activeProspectId);
      if (psp){ psp.proposalStatus = el.value; persistProspects(); render(); }
    }
    else if (el.dataset.action==='add-ca-from-select'){
      var itemId = el.value;
      if (!itemId || !state.draft) return;
      var d = state.draft;
      var text = '';
      d.sections.forEach(function(s){ s.items.forEach(function(it){ if (it.id===itemId) text = it.text; }); });
      d.correctiveActions.push({ id: uid(), sourceItemId: itemId, description: text, dueDate: '' });
      persistDraft(); render();
    }
    else if (el.dataset.action==='swap-ca-item'){
      if (!state.draft) return;
      var dS = state.draft;
      var caS = dS.correctiveActions.filter(function(c){ return c.id===el.dataset.ca; })[0];
      if (caS){
        var newId = el.value;
        var newText = '';
        dS.sections.forEach(function(s){ s.items.forEach(function(it){ if (it.id===newId) newText = it.text; }); });
        caS.sourceItemId = newId;
        caS.description = newText;
        persistDraft(); render();
      }
    }
    else if (el.dataset.action==='restore-backup-file'){
      var file = el.files && el.files[0];
      if (!file) return;
      if (!window.confirm('This will REPLACE all current data (audits, prospects, actions, settings) with the contents of this backup file. Continue?')){ el.value=''; return; }
      var reader = new FileReader();
      reader.onload = function(ev){
        try {
          var data = JSON.parse(ev.target.result);
          if (applyBackupData(data)){ alert('Backup restored.'); render(); }
          else { alert("This file doesn't look like a valid Diagnosis Room backup."); }
        } catch(err){ alert("Could not read this file — make sure it's a Diagnosis Room backup JSON."); }
        el.value = '';
      };
      reader.readAsText(file);
    }
  });

  render();
})();
</script>

<script>
  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>

</body>
</html>
