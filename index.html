<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnosis Room</title>
<meta name="description" content="Timed, section-by-section audit checklists for Dine-In and QSR floor checks.">
<link rel="manifest" href="manifest.json?v=4">
<link rel="icon" href="icons/favicon-32.png?v=4" type="image/png" sizes="32x32">
<link rel="icon" href="icons/icon-192.png?v=4" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Diagnosis Room">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F2F2;
    --ink:#000000; --ink-600:#4B4B4B; --ink-400:#8A8A8A;
    --line:#E4E4E4; --line-strong:#CFCFCF;
    --accent:#2596E0; --accent-ink:#0F5C8C; --accent-soft:#E1F1FB;
    --good:#2E7D4F; --good-soft:#DCEEE2;
    --bad:#C1392B; --bad-soft:#F6DFDA;
    --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.06);
    --shadow-sm:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
    --r-s:8px; --r-m:12px; --r-l:18px;
    --font-d:'Inter',"Segoe UI",sans-serif;
    --font-b:'Inter',-apple-system,"Segoe UI",sans-serif;
    --font-m:'IBM Plex Mono',"SFMono-Regular",Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0A0A0A; --surface:#161616; --surface-2:#202020;
      --ink:#FFFFFF; --ink-600:#B0B0B0; --ink-400:#7A7A7A;
      --line:#2C2C2C; --line-strong:#3D3D3D;
      --accent:#5CB8F5; --accent-ink:#BEE4FB; --accent-soft:#123349;
      --good:#59B583; --good-soft:#24352B;
      --bad:#E2645A; --bad-soft:#3A2622;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
      --shadow-sm:0 1px 2px rgba(0,0,0,.25),0 2px 8px rgba(0,0,0,.2);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0A0A0A; --surface:#161616; --surface-2:#202020;
    --ink:#FFFFFF; --ink-600:#B0B0B0; --ink-400:#7A7A7A;
    --line:#2C2C2C; --line-strong:#3D3D3D;
    --accent:#5CB8F5; --accent-ink:#BEE4FB; --accent-soft:#123349;
    --good:#59B583; --good-soft:#24352B;
    --bad:#E2645A; --bad-soft:#3A2622;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.25),0 2px 8px rgba(0,0,0,.2);
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
  html,body{background:var(--paper);}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-b); margin:0;}
  h1,h2,h3{font-family:var(--font-d); font-weight:800; letter-spacing:-0.01em; text-wrap:balance; margin:0;}
  .mono{font-family:var(--font-m); font-variant-numeric:tabular-nums;}
  button{font-family:var(--font-b); cursor:pointer; color:inherit;}
  input,textarea{font-family:var(--font-b);}
  .shell{max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--paper);}
  .authwrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 18px; background:var(--paper);}
  .authcard{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--shadow); padding:28px 24px;}
  .authbrand{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;}
  .authbrand .logo{width:76px; height:76px; border-radius:20px; display:block; box-shadow:0 6px 18px rgba(0,0,0,.18), 0 0 0 1px var(--line-strong);}
  .authbrand .name{font-family:var(--font-d); font-weight:800; font-size:16px;}
  .authloading{color:var(--ink-400); font-size:14px;}
  .topbar{position:sticky; top:0; z-index:10; background:var(--paper); border-bottom:1px solid var(--line); padding:12px 16px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px;}
  .tb-side{display:flex; align-items:center; gap:10px; min-width:0;}
  .tb-side.tb-right{justify-content:flex-end;}
  .brand{display:flex; align-items:center; gap:9px; cursor:pointer; border:none; background:none; padding:0;}
  .brand .logo, .sidebar-brand .logo{width:34px; height:34px; border-radius:9px; display:block; flex:none;}
  .brand .name, .sidebar-brand .name{font-family:var(--font-d); font-weight:800; font-size:18px; color:var(--ink);}
  .brand{min-width:0;}
  .brand .name{font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hamburger{width:36px; height:36px; flex:none; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); border-radius:var(--r-s); font-size:16px; display:flex; align-items:center; justify-content:center; padding:0; transition:background .15s;}
  .syncpill{font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:20px; white-space:nowrap; flex:none;}
  .syncpill.sp-good{color:var(--good); background:var(--good-soft);}
  .syncpill.sp-accent{color:var(--accent-ink); background:var(--accent-soft);}
  .syncpill.sp-bad{color:var(--bad); background:var(--bad-soft);}
  .hamburger:hover{background:var(--surface-2);}
  .sidebar-overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:19;}
  .sidebar-overlay.show{opacity:1; pointer-events:auto;}
  .sidebar{position:fixed; top:0; left:0; bottom:0; width:250px; max-width:82vw; background:var(--surface); border-right:1px solid var(--line); z-index:20; transform:translateX(-100%); transition:transform .25s ease; display:flex; flex-direction:column; padding:16px 12px; overflow-y:auto;}
  .sidebar.open{transform:translateX(0);}
  .sidebar-brand{display:flex; align-items:center; gap:9px; padding:6px 8px 16px; border-bottom:1px solid var(--line); margin-bottom:10px;}
  .sidebarbtn{display:flex; align-items:center; justify-content:space-between; gap:8px; text-align:left; width:100%; border:none; background:none; color:var(--ink-600); font-size:14.5px; font-weight:600; padding:11px 10px; border-radius:var(--r-s); margin-bottom:2px; transition:background .15s, color .15s;}
  .sidebarbtn:hover:not(:disabled){background:var(--surface-2); color:var(--ink);}
  .sidebarbtn.active{background:var(--accent); color:#fff;}
  .sidebarbtn:disabled{opacity:.35; cursor:not-allowed;}
  .sidebarbtn .count{font-size:11.5px; font-family:var(--font-m); opacity:.75;}
  main{flex:1; padding:22px 18px 90px;}
  .eyebrow{font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-400);}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--shadow);}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:var(--r-m); font-weight:700; font-size:14.5px; padding:11px 18px; border:1px solid transparent; transition:transform .12s, background .15s, box-shadow .15s;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--accent); color:#fff; box-shadow:0 2px 10px rgba(37,150,224,.28);}
  .btn-primary:hover{background:var(--accent-ink); box-shadow:0 3px 14px rgba(37,150,224,.34);}
  .btn-primary:disabled{background:var(--ink-400); box-shadow:none; cursor:not-allowed;}
  .btn-ghost{background:var(--surface); color:var(--ink); border-color:var(--line-strong);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-text{background:none; color:var(--ink-600); padding:8px 4px;}
  .btn-text:hover{color:var(--ink);}
  .btn-danger{color:var(--bad);}
  .btn-sm{padding:6px 11px; font-size:13px; border-radius:var(--r-s);}
  a.btn{text-decoration:none;}
  .contactrow{display:flex; flex-wrap:wrap; gap:8px;}
  .contactrow:empty{display:none;}
  .contactrow.blockrow{margin:2px 0 14px;}
  .contactrow.blockrow .btn{flex:1 1 0; padding:10px 12px; font-size:14px;}
  .pbrow{display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--line);}
  .pbrow:first-of-type{border-top:none;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-600); margin-bottom:6px;}
  .field input, .field textarea, .field select{width:100%; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); border-radius:var(--r-s); padding:10px 12px; font-size:16px; font-family:inherit;}
  .field select{appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2.5'><polyline points='6 9 12 15 18 9'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:34px;}
  .field input:focus, .field textarea:focus, .field select:focus, button:focus-visible, .navbtn:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  input:focus-visible, textarea:focus-visible, select:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .field textarea{resize:vertical; min-height:88px; line-height:1.45;}
  .field textarea.autogrow{resize:none; overflow:hidden; word-wrap:break-word;}

  /* setup */
  .typegrid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:14px 0 20px;}
  .typecard{border:1.5px solid var(--line-strong); border-radius:var(--r-l); padding:16px 14px; background:var(--surface); text-align:left; transition:border-color .15s, background .15s, box-shadow .15s, transform .12s;}
  .typecard:hover{box-shadow:var(--shadow-sm);}
  .typecard:active{transform:scale(.99);}
  .typecard.selected{border-color:var(--accent); background:var(--accent-soft); box-shadow:var(--shadow-sm);}
  .typecard .ticon{font-size:22px;}
  .typecard .tname{font-family:var(--font-d); font-weight:800; font-size:16px; margin-top:8px;}
  .typecard .tmeta{font-size:12.5px; color:var(--ink-600); margin-top:3px;}
  .formstack{display:flex; flex-direction:column; gap:14px; margin-bottom:22px;}
  .cardstack{display:flex; flex-direction:column; gap:12px;}
  .fuquick{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .fuquick .naBtn{padding:9px 6px; font-size:13px; border-radius:10px; text-align:center;}
  .helper{font-size:12.5px; color:var(--ink-400); margin-top:6px;}

  /* audit header */
  .auditbar{position:sticky; top:57px; z-index:9; background:var(--paper); padding:12px 0 14px; border-bottom:1px solid var(--line); margin-bottom:16px; box-shadow:0 4px 12px rgba(0,0,0,.05);}
  .auditbar .row1{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .badge{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--accent-ink); background:var(--accent-soft); padding:3px 8px; border-radius:20px;}
  .storeline{font-weight:700; font-size:15px; margin-top:6px;}
  .storeline .sub{color:var(--ink-600); font-weight:500; font-size:13px;}
  .timerblock{text-align:right;}
  .timerblock .t{font-size:26px; font-weight:600; line-height:1;}
  .timerblock .lbl{font-size:10.5px; color:var(--ink-400); text-transform:uppercase; letter-spacing:.07em; margin-top:2px;}
  .overallprog{margin-top:12px;}
  .progtrack{height:6px; background:var(--surface-2); border-radius:4px; overflow:hidden;}
  .progfill{height:100%; background:var(--accent); border-radius:4px; transition:width .25s;}
  .timedist{display:flex; height:9px; border-radius:5px; overflow:hidden; background:var(--surface-2); margin-top:10px;}
  .timedist-seg{transition:width .25s; flex:none;}
  .timedist-key{display:flex; gap:16px; margin-top:8px; font-size:11.5px; color:var(--ink-600); flex-wrap:wrap;}
  .timedist-key span{display:inline-flex; align-items:center; gap:6px;}
  .timedist-key i{width:9px; height:9px; border-radius:3px; display:inline-block;}
  .progtext{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-600); margin-top:5px;}
  .barctl{display:flex; gap:8px; margin-top:12px;}

  /* sections */
  .section{border:1px solid var(--line); border-radius:var(--r-l); background:var(--surface); margin-bottom:12px; overflow:hidden; box-shadow:var(--shadow-sm); transition:border-color .15s, box-shadow .15s;}
  .section.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset, var(--shadow-sm);}
  .sechead{display:flex; align-items:center; gap:12px; padding:14px 16px; width:100%; background:none; border:none; text-align:left; transition:background .12s;}
  .sechead:hover{background:var(--surface-2);}
  .secnum{font-family:var(--font-m); font-size:12px; font-weight:600; color:var(--ink-400); width:20px; flex:none;}
  .sectitle{flex:1; min-width:0;}
  .sectitle .sname{font-weight:700; font-size:15px;}
  .sectitle .smeta{font-size:12px; color:var(--ink-600); margin-top:2px; font-family:var(--font-m);}
  .sectimer{font-family:var(--font-m); font-size:13px; color:var(--ink-600); flex:none; display:flex; align-items:center; gap:5px;}
  .sectimer.running{color:var(--accent-ink); font-weight:600;}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--line-strong); flex:none;}
  .dot.running{background:var(--accent);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
  .dot.running{animation:pulse 1.4s ease-in-out infinite;}
  .chev{color:var(--ink-400); flex:none; transition:transform .18s;}
  .section.active .chev{transform:rotate(180deg);}
  .secbody{padding:0 16px 14px;}
  .item{display:flex; align-items:flex-start; gap:11px; padding:10px 2px; border-top:1px solid var(--line);}
  .item:first-child{border-top:none;}
  .item.priorflag{background:var(--bad-soft); margin:0 -12px; padding:10px 12px; border-radius:8px;}
  .item.hasanswer{background:var(--accent-soft); margin:2px -12px; padding:10px 12px; border-radius:8px; border-top-color:transparent;}
  .item.hasanswer.priorflag{background:var(--bad-soft);}
  .secwarn{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.02em; color:var(--bad); background:var(--bad-soft); padding:2px 9px; border-radius:20px; margin-left:8px; vertical-align:middle;}
  .chk{width:22px; height:22px; border-radius:6px; border:1.5px solid var(--line-strong); background:var(--surface); flex:none; margin-top:1px; display:flex; align-items:center; justify-content:center; transition:background .12s, border-color .12s;}
  .chk.checked{background:var(--good); border-color:var(--good); color:#fff;}
  .chk.fail{background:var(--bad); border-color:var(--bad); color:#fff;}
  .scorerow{display:flex; gap:6px; margin-top:6px;}
  .scorebtn{flex:1; padding:8px 0; border:1.5px solid var(--line); border-radius:var(--r-s); background:transparent; color:var(--ink-600); font-weight:700; cursor:pointer;}
  .scorebtn.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .critbadge{display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.04em; color:var(--bad); border:1px solid var(--bad); border-radius:4px; padding:1px 5px; margin-right:6px;}
  .failblock{margin-top:8px; display:flex; flex-direction:column; gap:6px;}
  .chk.na{background:var(--surface-2); border-color:var(--line-strong); color:var(--ink-400);}
  .itemcol{flex:1; min-width:0;}
  .itemtext{font-size:14.5px; line-height:1.4; padding-top:2px; cursor:default;}
  .itemtext.checked{color:var(--ink-600);}
  .itemtext.na{color:var(--ink-400); text-decoration:line-through;}
  .answerblock{margin-top:8px;}
  .answerlabel{display:block; font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--accent-ink); margin-bottom:4px;}
  .itemvalue{display:block; width:100%; border:1px solid var(--line-strong); border-radius:var(--r-s); padding:7px 10px; font-size:16px; background:var(--surface); color:var(--ink); transition:border-color .12s, box-shadow .12s;}
  .itemvalue:focus-visible{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); outline:none;}
  .naBtn{font-size:11px; font-weight:700; color:var(--ink-400); background:none; border:1px solid var(--line-strong); border-radius:20px; padding:4px 9px; flex:none; transition:background .15s, color .15s, border-color .15s;}
  .naBtn:hover:not(.on){background:var(--surface-2); color:var(--ink-600);}
  .naBtn.on{color:var(--accent-ink); border-color:var(--accent); background:var(--accent-soft);}
  .qbtn{font-size:13px; font-weight:700; padding:9px 10px; border-radius:var(--r-s); border:1.5px solid var(--line-strong); background:transparent; color:var(--ink-600); cursor:pointer; flex:1; transition:background .15s, color .15s, border-color .15s;}
  .qbtn.ok{color:var(--good); border-color:var(--good);}
  .qbtn.ok:hover{background:var(--good); color:#fff;}
  .qbtn.no:hover{background:var(--bad); border-color:var(--bad); color:#fff;}
  .qbtn.no.on{color:var(--bad); border-color:var(--bad);}
  .badge.svcbadge{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-transform:none; letter-spacing:0; vertical-align:bottom;}
  .catrow{display:flex; gap:8px; flex-wrap:wrap;}
  .svccard .field{margin-bottom:16px;}
  .svccard .field > label{display:block; margin-bottom:6px;}
  .field > div[style*="display:flex"] > .naBtn{flex:1 1 0; min-width:0; padding:9px 8px; font-size:13px; border-radius:10px; text-align:center;}
  .itemrow.hasanswer .naBtn.on, .item.hasanswer .naBtn.on{background:var(--surface);}

  .footerbar{position:fixed; bottom:0; left:0; right:0; background:var(--paper); border-top:1px solid var(--line); padding:12px 18px; display:flex; justify-content:center; z-index:11; box-shadow:0 -4px 16px rgba(0,0,0,.06);}
  .footerbar .inner{max-width:640px; width:100%; display:flex; gap:10px;}
  .footerbar .inner .btn{flex:1;}

  .remarkwrap{padding-top:4px;}
  .dashgrid{display:grid; grid-template-columns:1.3fr 1fr; gap:12px; margin-bottom:20px;}
  @media (max-width:520px){ .dashgrid{grid-template-columns:1fr;} }
  .dashcard{padding:14px 14px 10px;}
  .dashcard-title{font-size:12.5px; font-weight:700; color:var(--ink-600); margin-bottom:10px;}
  .barchart{display:flex; gap:7px; align-items:flex-end; height:96px;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
  .bar-track{width:100%; max-width:26px; height:64px; background:var(--surface-2); border-radius:5px 5px 0 0; display:flex; align-items:flex-end; overflow:hidden;}
  .bar-fill{width:100%; background:var(--accent); border-radius:5px 5px 0 0; min-height:2px; transition:height .3s;}
  .bar-val{font-size:10.5px; font-weight:700; margin-top:4px; font-family:var(--font-m);}
  .bar-lbl{font-size:9.5px; color:var(--ink-400); margin-top:1px;}
  .donutrow{display:flex; align-items:center; gap:14px; height:100%;}
  .donut{width:88px; height:88px; border-radius:50%; background:conic-gradient(var(--donutcolor, var(--accent)) calc(var(--pct)*1%), var(--surface-2) 0); display:flex; align-items:center; justify-content:center; flex:none;}
  .donut-inner{width:64px; height:64px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .donut-val{font-family:var(--font-m); font-weight:700; font-size:16px;}
  .donut-lbl{font-size:9px; color:var(--ink-400); text-transform:uppercase; letter-spacing:.04em; margin-top:1px;}
  .donutstats{flex:1;}
  .donutstats .row{font-size:12.5px; color:var(--ink-600); margin-bottom:4px; display:flex; justify-content:space-between; gap:10px;}
  .donutstats .row b{color:var(--ink); font-family:var(--font-m);}
  .donutstats .row b.bad{color:var(--bad);}
  .stackbar{display:flex; height:14px; border-radius:8px; overflow:hidden; background:var(--surface-2); margin-bottom:12px;}
  .stackbar > div{height:100%; min-width:0;}
  .stacklegend{display:flex; flex-wrap:wrap; gap:10px 16px; font-size:12px; color:var(--ink-600);}
  .stacklegend .dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:5px;}
  .stacklegend b{color:var(--ink); font-family:var(--font-m); margin-left:3px;}
  .lookuprow{display:flex; align-items:center; flex-wrap:wrap; gap:8px; row-gap:6px; padding:9px 0; border-bottom:1px solid var(--line);}
  .lookuprow:last-child{border-bottom:none;}

  .calcell{background:var(--surface-2); border-radius:var(--r-s); padding:8px 3px; text-align:center; min-height:66px; display:flex; flex-direction:column; align-items:center; gap:2px; border:none; transition:box-shadow .15s, transform .12s;}

  .calcell.has .cal-topic{color:#fff;}
  .calcell.has .cal-count{color:#fff;}
  .cal-dow{font-size:9.5px; color:var(--ink-400); text-transform:uppercase; font-weight:700;}
  .cal-daynum{font-family:var(--font-m); font-weight:700; font-size:14px; color:var(--ink);}
  .cal-topic{font-size:8.5px; color:var(--accent-ink); line-height:1.2; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; margin-top:1px;}
  .cal-count{font-size:9px; color:var(--accent-ink); font-weight:700; margin-top:1px;}
  .statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:16px 0 20px;}
  .statgrid:has(> :nth-child(2):last-child), .statgrid:has(> :nth-child(4):last-child){grid-template-columns:repeat(2,1fr);}
  .stattile{background:var(--surface-2); border-radius:var(--r-m); padding:12px 12px; transition:box-shadow .15s;}
  .stattile:hover{box-shadow:var(--shadow-sm);}
  .stattile .v{font-family:var(--font-m); font-size:19px; font-weight:600;}
  .stattile .k{font-size:11px; color:var(--ink-600); margin-top:2px;}
  .stattile.t-accent{background:var(--accent-soft);}
  .stattile.t-accent .v{color:var(--accent-ink);}
  .stattile.t-good{background:var(--good-soft);}
  .stattile.t-good .v{color:var(--good);}
  .stattile.t-bad{background:var(--bad-soft);}
  .stattile.t-bad .v{color:var(--bad);}

  /* dashboard */
  .dashhero{position:relative; overflow:hidden; background:linear-gradient(135deg, var(--accent-soft) 0%, var(--surface) 65%); border:1px solid var(--line); border-radius:var(--r-l); padding:18px 20px; margin-bottom:18px; box-shadow:var(--shadow-sm);}
  .dashhero::after{content:''; position:absolute; top:-40px; right:-40px; width:140px; height:140px; border-radius:50%; background:radial-gradient(circle, var(--accent-soft) 0%, transparent 70%); opacity:.9; pointer-events:none;}
  .dashhero .datepill{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-ink); background:var(--surface); border:1px solid var(--line); padding:4px 10px; border-radius:20px; position:relative; z-index:1;}
  .dashhero h1{position:relative; z-index:1; margin-top:10px;}
  .sechead2{display:flex; align-items:center; gap:9px; margin:24px 0 10px;}
  .sechead2 .ic{width:28px; height:28px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:14px; flex:none; background:var(--accent-soft);}
  .sechead2 h2{font-size:15px; margin:0;}
  .sechead2:first-of-type{margin-top:0;}
  .actrow{display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); cursor:pointer; transition:background .12s; margin:0 -16px; padding-left:16px; padding-right:16px; border-radius:var(--r-s);}
  .actrow:first-child{border-top:none;}
  .actrow:active{background:var(--surface-2);}
  .acticon{width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13.5px; flex:none; background:var(--surface-2);}

  /* summary */
  .sumhead{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .sumrow{display:flex; justify-content:space-between; padding:10px 0; border-top:1px solid var(--line); font-size:14px;}
  .sumrow:first-child{border-top:none;}
  .sumrow .k{color:var(--ink-600);}
  .sumrow .v{font-weight:600; font-family:var(--font-m);}
  .remarkbox{background:var(--surface-2); border-radius:var(--r-m); padding:14px; font-size:14px; line-height:1.5; margin-top:6px; white-space:pre-wrap;}
  .sumactions{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}

  /* shareable audit report (only visible when printing / saving as PDF) */
  #printReport{display:none;}
  @media print{
    @page{size:A4; margin:14mm;}
    body.printing{background:#fff !important;}
    body.printing > *:not(#printReport){display:none !important;}
    body.printing #printReport{display:block;}
  }
  #printReport{color:#111827; font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; font-size:12.5px; line-height:1.5; background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  #printReport *{box-sizing:border-box;}
  #printReport .rp-top{display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #111827; padding-bottom:10px; margin-bottom:16px;}
  #printReport .rp-brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:16px;}
  #printReport .rp-brand img{width:38px; height:38px; border-radius:9px;}
  #printReport .rp-kind{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#6b7280; font-weight:700;}
  #printReport h1{font-size:24px; margin:0 0 2px; color:#111827;}
  #printReport h2{font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:#374151; margin:20px 0 8px; padding-bottom:4px; border-bottom:1px solid #e5e7eb;}
  #printReport .rp-sub{color:#4b5563; margin-bottom:12px;}
  #printReport .rp-meta{display:flex; flex-wrap:wrap; gap:6px 24px; margin-bottom:6px; color:#374151;}
  #printReport .rp-meta b{color:#111827;}
  #printReport .rp-score{display:flex; gap:14px; align-items:stretch; margin:14px 0 4px;}
  #printReport .rp-big{flex:1.2; border-radius:10px; padding:14px 16px; color:#fff;}
  #printReport .rp-big .n{font-size:40px; font-weight:800; line-height:1;}
  #printReport .rp-big .l{font-size:13px; font-weight:700; margin-top:4px; opacity:.95;}
  #printReport .rp-tile{flex:1; border:1px solid #e5e7eb; border-radius:10px; padding:12px 14px; background:#f9fafb;}
  #printReport .rp-tile .n{font-size:20px; font-weight:800;}
  #printReport .rp-tile .l{font-size:11px; color:#6b7280; margin-top:2px;}
  #printReport .rp-row{display:flex; align-items:center; gap:10px; padding:5px 0; break-inside:avoid;}
  #printReport .rp-row .nm{flex:0 0 34%; font-weight:600;}
  #printReport .rp-row .bar{flex:1; height:9px; background:#e5e7eb; border-radius:5px; overflow:hidden;}
  #printReport .rp-row .bar i{display:block; height:100%; border-radius:5px;}
  #printReport .rp-row .pc{flex:0 0 74px; text-align:right; font-variant-numeric:tabular-nums; color:#374151;}
  #printReport .rp-box{border:1px solid #e5e7eb; border-radius:8px; padding:9px 12px; margin-bottom:8px; break-inside:avoid;}
  #printReport .rp-box .t{font-weight:700;}
  #printReport .rp-box .s{color:#4b5563; margin-top:2px;}
  #printReport .rp-issue{border-left:3px solid #dc2626; background:#fef2f2; padding:7px 12px; margin-bottom:8px; border-radius:0 6px 6px 0; break-inside:avoid;}
  #printReport ul{margin:4px 0 8px 18px; padding:0;}
  #printReport li{margin:2px 0;}
  #printReport .rp-remark{white-space:pre-wrap; background:#f9fafb; border:1px solid #e5e7eb; border-radius:8px; padding:12px 14px;}
  #printReport .rp-sign img{max-height:70px; border:1px solid #e5e7eb; border-radius:6px; background:#fff; margin-top:6px;}
  #printReport .rp-foot{margin-top:24px; padding-top:8px; border-top:1px solid #e5e7eb; color:#9ca3af; font-size:11px; text-align:center;}
  /* history */
  .histcard{padding:14px 16px; margin-bottom:10px; cursor:pointer; transition:box-shadow .15s, border-color .15s, transform .12s;}
  .histcard:hover{border-color:var(--line-strong); box-shadow:var(--shadow);}
  .histcard:active{transform:scale(.99);}
  .histcard.static{cursor:default;}
  .histcard.static:hover{border-color:var(--line); box-shadow:var(--shadow);}
  .histcard.static:active{transform:none;}
  .histtop{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; row-gap:4px;}
  .histtop > span{flex-wrap:wrap; display:inline-flex; align-items:center; gap:4px; row-gap:4px;}
  .histmeta{font-size:12.5px; color:var(--ink-600); margin-top:4px;}
  .histpct{font-family:var(--font-m); font-weight:600; font-size:13px;}
  .pill{font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:20px; text-transform:uppercase; letter-spacing:.04em;}
  .pill.good{color:var(--good); background:var(--good-soft);}
  .pill.warn{color:var(--accent-ink); background:var(--accent-soft);}
  .pill.bad{color:var(--bad); background:var(--bad-soft);}

  .progchip.bad{color:var(--bad); background:var(--bad-soft);}
  .progchip.neutral{color:var(--ink-600); background:var(--surface-2);}
  .empty{text-align:center; padding:50px 20px; color:var(--ink-400);}
  .empty .big{font-size:34px; margin-bottom:8px; opacity:.7;}
  .tabs{display:flex; gap:4px; margin-bottom:16px; padding:4px; background:var(--surface-2); border:1px solid var(--line); border-radius:14px;}
  .tab{flex:1 1 0; min-width:0; border:none; background:transparent; border-radius:10px; padding:9px 6px; font-size:13px; font-weight:700; color:var(--ink-600); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:background .15s, color .15s, box-shadow .15s;}
  .tab:hover:not(.on){background:var(--surface);}
  .tab.on{background:var(--accent); color:#fff; box-shadow:var(--shadow-sm);}
  .weekrow{display:flex; gap:12px; align-items:flex-start; padding:12px 14px; margin-bottom:8px; cursor:pointer;}
  .wtime{width:62px; flex:none; font-size:12px; font-weight:700; color:var(--ink-600); line-height:1.4;}
  .wbody{flex:1; min-width:0;}
  .wtitle{font-weight:700; font-size:14px; line-height:1.35; word-break:break-word;}
  .wdayhead{display:flex; justify-content:space-between; align-items:center; margin:18px 0 8px; font-weight:800; font-size:14px;}
  .revchart{display:flex; gap:8px; align-items:flex-end;}
  .revcol{flex:1; min-width:0; text-align:center;}
  .revval{font-size:11px; font-weight:700; color:var(--ink-600); margin-bottom:4px; white-space:nowrap;}
  .revbar{display:flex; align-items:flex-end; border-bottom:1px solid var(--line);}
  .revstack{width:100%; display:flex; flex-direction:column; border-radius:6px 6px 0 0; overflow:hidden;}
  .rev-ret{background:var(--accent);}
  .rev-one{background:var(--good);}
  .revlbl{font-size:11px; color:var(--ink-400); margin-top:6px; font-weight:600;}
  .revcol.cur .revlbl{color:var(--ink); font-weight:800;}
  .revdot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px;}
  .paramcard{padding:14px 16px; margin-bottom:12px;}
  .paramhead{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .paramname{font-weight:800; font-size:15px;}
  .paramnums{display:flex; gap:8px; margin:10px 0;}
  .paramnums > div{flex:1; min-width:0; background:var(--surface-2); border-radius:var(--r-s); padding:8px 10px;}
  .pv{font-family:var(--font-m); font-weight:700; font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .pk{font-size:11px; color:var(--ink-400); text-transform:uppercase; font-weight:700; margin-top:2px;}
  .paramedit{background:var(--surface-2); border-radius:var(--r-s); padding:12px; margin:10px 0;}
  .paramedit input, .paramadd input, .pl-row input, .pl-row select{border:1px solid var(--line-strong); border-radius:var(--r-s); padding:8px 10px; font-size:16px; background:var(--surface); color:var(--ink); min-width:0; width:100%; font-family:inherit;}
  .paramadd{display:flex; gap:8px; margin-top:10px;}
  .paramadd input{flex:1;}
  .inqcard{padding:12px 14px; margin-bottom:10px;}
  .inqhead{display:flex; gap:8px; align-items:center; margin-bottom:10px;}
  .inqarea{flex:1; min-width:0; border:1px solid var(--line-strong); border-radius:var(--r-s); padding:8px 10px; font-size:14px; font-weight:700; background:var(--surface); color:var(--ink);}
  .inqtext{display:block; width:100%; border:1px solid var(--line-strong); border-radius:var(--r-s); padding:8px 10px; font-size:16px; font-family:inherit; line-height:1.4; background:var(--surface); color:var(--ink); resize:none; overflow:hidden; white-space:pre-wrap; word-wrap:break-word;}

  // Writes are counted individually so the "Syncing" pill clears as soon as THIS write lands,
  // instead of waiting for onSnapshotsInSync (which only fires once every listener in the app is caught up).
  var pendingWriteCount = 0;
  function beginWrite(){ pendingWriteCount++; state.syncPending = true; }
  function writeDone(err){
    if (pendingWriteCount>0) pendingWriteCount--;
    if (pendingWriteCount===0) state.syncPending = false;
    if (err) syncFail(err); else syncOk();
    renderSoon();
  }
  function fsSyncConfig(fieldName, value){
    if (!fsDb || !state.authUser) return;
    var obj = {};
    try{ obj[fieldName] = JSON.parse(JSON.stringify(value)); }catch(e){ obj[fieldName] = value; }
    beginWrite();
    try{ fsUserDataDoc('config').set(obj, {merge:true}).then(function(){ writeDone(); }, writeDone); }
    catch(e){ writeDone(e); }
  }

  // Every list that grows is stored one document per record (data/<prefix><id>), so nothing shares a 1 MB ceiling.
  function nextPrefix(p){ return p.slice(0, -1)+String.fromCharCode(p.charCodeAt(p.length-1)+1); }
  function byTime(field, dir){
    return function(a, b){
      var d = (a[field]||0)-(b[field]||0);
      if (d===0) d = String(a.id).localeCompare(String(b.id));
      return dir*d;
    };
  }
  var RECORD_SETS = [
    { key:'history',           prefix:'audit_',  legacy:'history',           ls:LS_H,  flag:'auditsMigrated',  sort:byTime('finishedAt', 1) },
    { key:'prospects',         prefix:'client_', legacy:'prospects',         ls:LS_PR, flag:'clientsMigrated', sort:byTime('createdAt', 1) },
    { key:'correctiveActions', prefix:'action_', legacy:'correctiveActions', ls:LS_A,  flag:'actionsMigrated', sort:byTime('createdAt', 1) },
    { key:'contentIdeas',      prefix:'idea_',   legacy:'contentIdeas',      ls:LS_CI, flag:'ideasMigrated',   sort:byTime('createdAt', -1) },
    { key:'lookups',           prefix:'lookup_', legacy:'lookups',           ls:LS_LK, flag:'lookupsMigrated', sort:byTime('createdAt', -1) },
    { key:'readings',          prefix:'reading_', legacy:'readings',         ls:LS_RD, flag:'readingsMigrated', sort:byTime('createdAt', 1) },
    { key:'workdays',          prefix:'wday_',    legacy:'workdays',         ls:LS_WD, flag:'workdaysMigrated', sort:byTime('checkInAt', -1) }
  ];
  var RS = {};
  RECORD_SETS.forEach(function(rs){ rs.synced = {}; rs.ready = false; rs.busy = false; rs.retry = null; RS[rs.key] = rs; });

  function fsRecDoc(rs, id){ return fsUserDataDoc(rs.prefix+id); }
  function fsRecQuery(rs){
    var fid = firebase.firestore.FieldPath.documentId();
    return fsUserDataColl().where(fid, '>=', rs.prefix).where(fid, '<', nextPrefix(rs.prefix));
  }
  function fsSyncRecords(rs){
    if (!fsDb || !state.authUser || !rs.ready) return;
    var ops = [], seen = {};
    (state[rs.key]||[]).forEach(function(r){
      if (!r || !r.id) return;
      seen[r.id] = true;
      var j = JSON.stringify(r);
      if (rs.synced[r.id]!==j) ops.push({ id:r.id, json:j });
    });
    Object.keys(rs.synced).forEach(function(id){ if (!seen[id]) ops.push({ id:id, json:null }); });
    if (!ops.length) return;
    for (var i=0; i<ops.length; i+=400){
      var batch = fsDb.batch();
      ops.slice(i, i+400).forEach(function(op){
        if (op.json!==null){ batch.set(fsRecDoc(rs, op.id), JSON.parse(op.json)); rs.synced[op.id] = op.json; }
        else { batch.delete(fsRecDoc(rs, op.id)); delete rs.synced[op.id]; }
      });
      beginWrite();
      batch.commit().then(function(){ writeDone(); }, writeDone);
    }
  }
  function fsWatchRecords(rs){
    var unsub = fsRecQuery(rs).onSnapshot(function(snap){
      if (snap.empty && snap.metadata.fromCache && state[rs.key].length) return;
      var list = [], map = {};
      snap.forEach(function(d){
        var r = d.data();
        if (r && r.id){ list.push(r); map[r.id] = JSON.stringify(r); }
      });
      // Nothing new from the cloud (e.g. the echo of our own save): skip the reassign, the save and the redraw.
      var prevMap = rs.synced || {}, prevKeys = Object.keys(prevMap), newKeys = Object.keys(map);
      if (rs._seen && prevKeys.length===newKeys.length && newKeys.every(function(k){ return prevMap[k]===map[k]; })) return;
      rs._seen = true;
      list.sort(rs.sort);
      state[rs.key] = list;
      rs.synced = map;
      saveJSON(rs.ls, list);
      if (snap.metadata.hasPendingWrites || isTypingInApp()) return;
      renderSoon();
    }, syncFail);
    fsUnsubs.push(unsub);
  }
  // One-time move of the old single-document list into per-record documents. The old document is left untouched as a safety copy.
  function fsMigrateRecords(rs){
    if (!fsDb || !state.authUser || rs.ready || rs.busy) return;
    rs.busy = true;
    var metaRef = fsUserDataDoc('meta');
    metaRef.get().then(function(metaSnap){
      if (metaSnap.exists && metaSnap.data()[rs.flag]) return;
      return fsUserDataDoc(rs.legacy).get().then(function(legacySnap){
        var legacy = (legacySnap.exists && legacySnap.data().list) || [];
        return fsRecQuery(rs).get().then(function(existing){
          var have = {};
          existing.forEach(function(d){ var r = d.data(); if (r && r.id) have[r.id] = true; });
          var pool = (state[rs.key]||[]).concat(legacy), todo = [], queued = {};
          pool.forEach(function(r){
            if (!r) return;
            if (!r.id) r.id = uid();
            if (!have[r.id] && !queued[r.id]){ queued[r.id] = true; todo.push(r); }
          });
          var writes = [];
          for (var i=0; i<todo.length; i+=400){
            var batch = fsDb.batch();
            todo.slice(i, i+400).forEach(function(r){ batch.set(fsRecDoc(rs, r.id), JSON.parse(JSON.stringify(r))); });
            writes.push(batch.commit());
          }
          return Promise.all(writes).then(function(){
            var flagDoc = {}; flagDoc[rs.flag] = true; flagDoc[rs.flag+'At'] = Date.now(); flagDoc[rs.flag+'Count'] = todo.length;
            return metaRef.set(flagDoc, {merge:true});
          });
        });
      });
    }).then(function(){
      rs.busy = false;
      if (!fsDb) return;
      rs.ready = true;
      syncOk();
      fsWatchRecords(rs);
    }).catch(function(err){
      rs.busy = false;
      if (!fsDb) return;
      syncFail(err);
      clearTimeout(rs.retry);
      rs.retry = setTimeout(function(){ fsMigrateRecords(rs); }, 20000);
    });
  }
  function fsStartRecordSync(){ RECORD_SETS.forEach(fsMigrateRecords); }

  function isTypingInApp(){
    var ae = document.activeElement;

  function fsWatchDoc(name, isConfig){
    var ref = fsUserDataDoc(name);
    var unsub = ref.onSnapshot(function(snap){
      if (snap.exists){
        var data = snap.data();
        if (isConfig){
          if (data.templates) state.templates = data.templates;
          if (data.pricing) state.pricing = data.pricing;
          if (data.schedule) state.schedule = data.schedule;
          ensureHotelDefaults();
          if (data.services) state.services = data.services;
          ensureServiceDefaults();
          if (data.deliverables) state.deliverables = data.deliverables;
          if (data.paramLibrary) state.paramLibrary = data.paramLibrary;
          if (data.targets) state.targets = data.targets;
          if (data.reauditOverrides) state.reauditOverrides = data.reauditOverrides;
        } else {
          state[name] = data.list || [];
        }
      } else {
        if (isConfig){
          try{ ref.set(JSON.parse(JSON.stringify({ templates: state.templates, pricing: state.pricing, schedule: state.schedule, services: state.services, deliverables: state.deliverables, paramLibrary: state.paramLibrary, targets: state.targets, reauditOverrides: state.reauditOverrides }))).catch(function(){}); }catch(e){}
        } else {
          ref.set({ list: state[name] || [] }).catch(function(){});
        }
      }
      if (snap.metadata.hasPendingWrites || isTypingInApp()) return;
      renderSoon();
    }, function(){});
    fsUnsubs.push(unsub);
  }
  // Submissions from the public System Map page (top-level systemMaps collection, create-only for the public, owner can read/update).
  function fsWatchSystemMaps(){
    var unsub = fsDb.collection('systemMaps').orderBy('createdAt', 'desc').limit(300).onSnapshot(function(snap){
      var list = [];
      snap.forEach(function(d){
        var r = d.data({ serverTimestamps:'estimate' });
        r._id = d.id;
        r._at = (r.createdAt && r.createdAt.toMillis) ? r.createdAt.toMillis() : Date.now();
        list.push(r);
      });
      state.systemMaps = list;
      state.mapsError = '';
      if (isTypingInApp()) return;
      renderSoon();
    }, function(err){
      state.mapsError = (err && err.code) ? String(err.code) : 'error';
      renderSoon();
    });
    fsUnsubs.push(unsub);
  }
  // Website funnel: one smStats doc per day ({visit,start,finish,book}), last 30 days. Silent if the rule isn't published yet.
  function fsWatchSmStats(){
    var d = new Date(); d.setDate(d.getDate()-29);
    var from = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    var unsub = fsDb.collection('smStats').where(firebase.firestore.FieldPath.documentId(), '>=', from).onSnapshot(function(snap){
      var m = {};
      snap.forEach(function(doc){ m[doc.id] = doc.data(); });

  }
  function attachFirestoreSync(){

  function fmtTime(ms){
    ms = Math.max(0, ms|0);
    var s = Math.floor(ms/1000);
    var h = Math.floor(s/3600); s -= h*3600;
    var m = Math.floor(s/60); s -= m*60;
    if (h>0) return h+':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }
  function fmtDateShort(ts){ var d = new Date(ts); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
  function fmtRelativeTime(ts){
    if (!ts) return '';
    var diffDays = Math.floor((Date.now()-ts)/86400000);
    if (diffDays<=0) return 'today';
    if (diffDays===1) return 'yesterday';
    if (diffDays<30) return diffDays+' days ago';
    return fmtDateShort(ts);
  }
  function dayName(dateStr){ if(!dateStr) return ''; var d = new Date(dateStr+'T00:00:00'); if(isNaN(d)) return ''; return d.toLocaleDateString(undefined,{weekday:'long'}); }
  function fmtAuditWhen(dateStr, timeStr){
    if (!dateStr) return '';
    var d = new Date(dateStr+'T'+(timeStr||'00:00')+':00');
    if (isNaN(d)) return dateStr;
    var day = d.toLocaleDateString(undefined,{weekday:'long'});
    var date = d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
    var time = timeStr ? d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}) : '';
    return day+' · '+date+(time?' · '+time:'');
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function sh(icon, title, bg){ return '<div class="sechead2"><span class="ic"'+(bg?' style="background:'+bg+';"':'')+'>'+icon+'</span><h2>'+title+'</h2></div>'; }

  function fallbackCopyText(txt){
    var ta = document.createElement('textarea');

  }

  function sectionWasAudited(s){ return (s.checked||0)>0 || (s.na||0)>0 || !!s.issue; }

  function buildAuditSummaryText(rec){
    var tmpl = state.templates[rec.type] || {label:rec.type};
    var lines = [];
    lines.push(rec.storeName||'Unnamed store');
    lines.push((tmpl.label||rec.type)+' audit · '+fmtAuditWhen(rec.auditDate,rec.auditTime));
    if (rec.storeLocation) lines.push(rec.storeLocation);
    lines.push('');
    lines.push('Score: '+rec.completionPct+'% ('+rec.checked+'/'+rec.total+' checked)');
    if (rec.prevScore!==null && rec.prevScore!==undefined){
      var d = rec.completionPct - rec.prevScore;
      lines.push((d>0?'+':'')+d+' pts vs last visit');
    }
    var anyFailed = false;
    rec.sections.filter(sectionWasAudited).forEach(function(s){
      var failed = (s.items||[]).filter(function(it){ return it.state==='unchecked'; });
      if (failed.length){
        anyFailed = true;
        lines.push(''); lines.push(s.name+':');
        failed.forEach(function(it){ lines.push('- '+it.text); });
      }
    });
    if (!anyFailed){ lines.push(''); lines.push('No outstanding issues — all checked items passed.'); }
    if (rec.remark){ lines.push(''); lines.push('Remark: '+rec.remark); }
    return lines.join('\n');
  }

  // ---------- timer math ----------
  function overallElapsed(d){
    var acc = d.overall.accumMs;
    if (d.overall.runningSince) acc += Date.now() - d.overall.runningSince;
    return acc;
  }
  function sectionElapsed(sec){
    var acc = sec.accumMs;
    if (sec.runningSince) acc += Date.now() - sec.runningSince;
    return acc;
  }
  function stopSection(sec){ if (sec.runningSince){ sec.accumMs += Date.now() - sec.runningSince; sec.runningSince = null; } }
  function startSection(sec){ if (!sec.runningSince) sec.runningSince = Date.now(); }
  function stopOverall(d){ if (d.overall.runningSince){ d.overall.accumMs += Date.now() - d.overall.runningSince; d.overall.runningSince = null; } }

  // ---------- check-in / away time: a personal daily timer, separate from audit timers. If a break/drive/outing
  // or the day itself is left running (forgotten to stop), it just keeps accumulating — nothing auto-resets.
  var AWAY_CATS = [
    { key:'break',  label:'Break',  icon:'☕', verb:'On break',      color:'var(--ink-400)' },
    { key:'drive',  label:'Drive',  icon:'🚗', verb:'Driving',       color:'var(--good)' },
    { key:'outing', label:'Outing', icon:'🚶', verb:'Out',           color:'var(--bad)' },
    { key:'dogs',   label:'Dogs',   icon:'🐕', verb:'With the dogs', color:'var(--ink)' }
  ];
  function awayCatOf(key){ return AWAY_CATS.filter(function(c){ return c.key===key; })[0]; }
  function openWorkday(){ return state.workdays.filter(function(w){ return !w.checkOutAt; })[0] || null; }
  function chanElapsed(ch){
    var acc = (ch && ch.accumMs) || 0;
    if (ch && ch.runningSince) acc += Date.now()-ch.runningSince;
    return acc;
  }
  function workdayWorkElapsed(w){ return chanElapsed(w.work); }
  function workdayAwayElapsed(w, key){ return chanElapsed(w.away && w.away[key]); }
  function workdayActiveAway(w){
    if (!w || !w.away) return null;
    var found = AWAY_CATS.filter(function(c){ return w.away[c.key] && w.away[c.key].runningSince; })[0];
    return found ? found.key : null;
  }
  function fmtClock(ts){ return ts ? new Date(ts).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}) : ''; }

  // ---------- meeting timer (client) & work timer (content) — for time spent that isn't a full audit or a shoot ----------
  function renderMeetingTimerCard(p){

        '</div>' : '') +

  function startOverall(d){ if (!d.overall.runningSince) d.overall.runningSince = Date.now(); }

  function setActiveSection(d, secId){
    d.sections.forEach(function(s){ if (s.id !== secId) stopSection(s); });
    if (d.activeSectionId === secId){
      d.activeSectionId = null;
    } else {
      d.activeSectionId = secId;
      if (!d.overall.paused){
        var sec = d.sections.filter(function(s){ return s.id===secId; })[0];
        startSection(sec);
      }
    }
  }

  function sectionProgress(sec){
    var total = sec.items.length;
    var checked = sec.items.filter(function(i){ return i.state === 'checked'; });
    var na = sec.items.filter(function(i){ return i.state === 'na'; });
    var pct = total === 0 ? 100 : Math.round(checked.length/total*100);
    return { checked: checked.length, total: total, na: na.length, pct: pct };
  }
  function overallProgress(d){
    var checked=0, total=0;
    d.sections.forEach(function(s){ var p = sectionProgress(s); checked+=p.checked; total+=p.total; });
    return { checked:checked, total:total, pct: total===0?100:Math.round(checked/total*100) };
  }

  // ---------- client revenue (drives the monthly revenue target) ----------
  function clientPriceOf(p){ return Number(p.finalPrice)||0; }
  // One-time deals count in the month they were converted; monthly retainers count every month from conversion until the engagement is closed.
  function clientRevenueForMonth(year, month){
    var start = new Date(year, month, 1).getTime(), next = new Date(year, month+1, 1).getTime();
    var oneTime = 0, retainer = 0;
    state.prospects.forEach(function(p){
      var price = clientPriceOf(p);
      if (!p.converted || p.declined || !price) return;
      var at = p.convertedAt || 0;
      if (p.pricingType==='retainer'){
        var endAt = p.engagementEnded ? (p.engagementEndedAt || p.updatedAt || 0) : Infinity;
        if (at<next && endAt>=start) retainer += price;
      }
      else if (at>=start && at<next){ oneTime += price; }
    });
    return { oneTime:oneTime, retainer:retainer, total:oneTime+retainer };
  }
  function clientsMissingPrice(){
    return state.prospects.filter(function(p){ return p.converted && !p.declined && (!clientPriceOf(p) || !p.pricingType); });
  }

  // ---------- re-audit schedule ----------
  function computeDueList(){ return memo('dueList', computeDueListRaw); }
  function computeDueListRaw(){
    var latestByStore = {};
    state.history.forEach(function(h){
      var key = (h.storeName||'Unnamed store').trim().toLowerCase();
      if (!latestByStore[key] || h.finishedAt > latestByStore[key].finishedAt) latestByStore[key] = h;
    });
    var prospectByKey = {};
    state.prospects.forEach(function(p){ var k=(p.name||'').trim().toLowerCase(); if (k) prospectByKey[k]=p; });
    var todayMs = Date.now();
    return Object.keys(latestByStore).map(function(key){
      var h = latestByStore[key];
      var pr = prospectByKey[key];
      var intervalDays = (state.schedule[h.type]||{}).intervalDays || 30;
      var perMonth = pr ? Number(pr.auditsPerMonth) : 0;
      var pkgSvc = pr && pr.servicesOffered ? findService(pr.servicesOffered) : null;
      var pkgDays = pkgSvc ? visitIntervalOf(pkgSvc.visitInterval).days : 0;
      var source = 'type';
      if (perMonth > 0){ intervalDays = Math.max(1, Math.round(30/perMonth)); source = 'client'; }
      else if (pkgDays > 0){ intervalDays = pkgDays; source = 'package'; }
      var computedDueAt = h.finishedAt + intervalDays*86400000;
      var ov = splitReaudit(state.reauditOverrides[key]);
      var dueAt = ov.date ? new Date(ov.date+'T'+(ov.time||'00:00')+':00').getTime() : computedDueAt;
      return {
        key: key, storeName: h.storeName, storeLocation: h.storeLocation, type: h.type,
        lastAuditAt: h.finishedAt, dueAt: dueAt, overridden: !!ov.date, overrideDate: ov.date, overrideTime: ov.time,
        daysUntil: Math.ceil((dueAt-todayMs)/86400000), intervalDays: intervalDays, customCadence: perMonth>0,
        cadenceSource: source, packageName: pkgSvc ? pkgSvc.name : ''
      };
    }).sort(function(a,b){ return a.dueAt-b.dueAt; });
  }

  function splitReaudit(v){
    var parts = String(v||'').split(' ');
    return { date:parts[0]||'', time:parts[1]||'' };
  }

  // ---------- build a fresh draft ----------
  function newDraft(type, storeName, storeLocation, contactName, contactDesignation, contactMobile, auditDate, auditTime, selectedSectionIds, menuItemCount, mode){
    var tmpl = state.templates[type];
    var chosen = tmpl.sections.filter(function(s){ return selectedSectionIds.indexOf(s.id) !== -1; });
    if (!chosen.length) chosen = tmpl.sections;
    var extras = clientExtraItems(storeName);
    if (extras.length){
      chosen = chosen.concat([{ id:'client-extra', name:'Client-specific checks', items: extras.map(function(x){ return { id:x.id, text:x.text }; }) }]);
    }
    var keepItems = null, keepSections = null;
    if (mode==='recheck'){
      var prevR = previousAuditForStore(storeName);
      if (prevR){
        keepItems = {};
        prevR.sections.forEach(function(ps){ ps.items.forEach(function(pi){ if (pi.state!=='checked' && pi.state!=='na') keepItems[pi.id] = true; }); });
      }
    } else if (mode==='issues'){
      keepItems = {}; keepSections = {};
      openActionsForStore(storeName).forEach(function(a){ if (a.sourceItemId) keepItems[a.sourceItemId] = true; if (a.sectionId) keepSections[a.sectionId] = true; });
    }
    if (keepItems){
      var narrowed = chosen.map(function(s){
        return { id:s.id, name:s.name, items: (s.id==='client-extra' || (keepSections && keepSections[s.id])) ? s.items : s.items.filter(function(it){ return keepItems[it.id]; }) };
      }).filter(function(s){ return s.items.length; });
      if (narrowed.length) chosen = narrowed;
    }
    return {
      id: uid(), type: type, storeName: storeName||'', storeLocation: storeLocation||'',
      contactName: contactName||'', contactDesignation: contactDesignation||'', contactMobile: contactMobile||'',
      auditDate: auditDate||todayISO(), auditTime: auditTime||nowHHMM(),
      menuItemCount: Math.max(0, parseInt(menuItemCount,10)||0),
      startedAt: Date.now(), finishedAt: null, remark:'',
      correctiveActions: [],
      overall: { accumMs:0, runningSince: Date.now(), paused:false },
      activeSectionId: null,
      sections: chosen.map(function(s){
        return { id:s.id, name:s.name, accumMs:0, runningSince:null,
          items: s.items.map(function(it){ return { id:it.id, text:it.text, state:'unchecked', requiresInfo:!!it.requiresInfo, infoLabel:it.infoLabel||'', value:'', askWho:(it.askWho||[]).slice(), who:{}, answers:(it.answers||[]).map(function(a){ return { label:a.label||'', type:a.type==='number'?'number':'text' }; }), ansVals:[],
            kind:it.kind||'tick', unit:it.unit||'', passMin:(it.passMin===undefined?'':it.passMin), passMax:(it.passMax===undefined?'':it.passMax), critical:!!it.critical, failNote:'', failDue:'' }; }) };
      })
    };
  }

    else if (v==='audit') html = state.draft ? renderAudit(state.draft) : renderSetup();

    else if (v==='editor') html = renderEditor();
    else if (v==='pricing') html = renderPricingSettings();
    else if (v==='actions') html = renderActionsView();
    else if (v==='prospects') html = renderProspects();
    else if (v==='lookup') html = renderLookup();
    else if (v==='search') html = renderSearch();
    else if (v==='dashboard') html = renderDashboard();

    for (var oti=0; oti<onTabs.length; oti++){

  function normalizeMobile(v){
    var digits = String(v||'').replace(/[\s\-().]/g, '');
    if (/^\+91/.test(digits)) return digits.slice(3);
    if (/^91\d{10}$/.test(digits)) return digits.slice(2);
    if (/^0\d{10}$/.test(digits)) return digits.slice(1);
    return digits;
  }
  function isValidMobile(v){ return /^[6-9]\d{9}$/.test(normalizeMobile(v)); }
  function mobileErrorText(v){
    return ((v||'').trim() && !isValidMobile(v)) ? 'Enter a valid 10-digit mobile number (starts with 6, 7, 8 or 9).' : '';
  }
  function prospectProblems(p){
    var pr = [];
    if (!(p.name||'').trim()) pr.push('client / store name');
    if (!(p.location||'').trim()) pr.push('location');
    if (!p.category || !state.templates[p.category]) pr.push('category');
    if (!(p.address||'').trim()) pr.push('address');
    if (!(p.contactName||'').trim()) pr.push('contact name');
    if (!(p.contactDesignation||'').trim()) pr.push('designation');
    if (!(p.contactMobile||'').trim()) pr.push('mobile number');
    else if (!isValidMobile(p.contactMobile)) pr.push('a valid mobile number');
    return pr;
  }
  function prospectHintText(problems){
    return problems.length ? 'Still needed to complete this client: '+problems.join(', ')+'.' : '✓ All required details are filled in.';
  }
  // One-tap call / WhatsApp links for a client's saved mobile number (Indian numbers, +91).
  // opt.msg overrides the WhatsApp opening line; opt.touch (a call-request id) marks that request contacted when tapped.
  function contactButtons(p, opt){
    if (!p || !isValidMobile(p.contactMobile)) return '';
    opt = opt || {};
    var n = normalizeMobile(p.contactMobile);
    var first = String(p.contactName||'').trim().split(/\s+/)[0];
    var msg = opt.msg || (first ? 'Hi '+first+', ' : '');
    var touch = opt.touch ? ' data-sm-touch="'+esc(opt.touch)+'"' : '';

  function setupProblems(s){

    if (!(s.contactDesignation||'').trim()) p.push('designation');
    if (!(s.contactMobile||'').trim()) p.push('mobile number');

  // ---------- client parameters: the guiding numbers for the whole engagement ----------
  function fmtNum(n){ return String(Math.round(Number(n)*100)/100); }
  function paramReadings(p, pid){
    return state.readings.filter(function(r){ return r.clientId===p.id && r.paramId===pid; }).sort(function(a, b){
      if (a.date!==b.date) return a.date<b.date ? -1 : 1;
      return (a.createdAt||0)-(b.createdAt||0);
    });
  }
  function paramStats(p, prm){
    var rs = paramReadings(p, prm.id);
    var st = { readings:rs, start: rs.length ? rs[0].value : null, now: rs.length ? rs[rs.length-1].value : null };
    st.delta = st.start!==null ? st.now-st.start : null;
    st.improving = (st.delta===null || st.delta===0) ? null : (prm.better==='higher' ? st.delta>0 : st.delta<0);
    var tv = (prm.target===''||prm.target===null||prm.target===undefined) ? NaN : Number(prm.target);
    st.target = isNaN(tv) ? null : tv;
    st.pct = (st.target!==null && st.start!==null && st.target!==st.start) ? Math.max(0, Math.min(100, Math.round((st.now-st.start)/(st.target-st.start)*100))) : null;
    return st;
  }
  function paramSpark(values){
    if (values.length<2) return '';
    var w = 220, h = 36, pad = 4, min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    if (max===min){ max += 1; min -= 1; }
    var pts = values.map(function(v, i){ return [pad+i/(values.length-1)*(w-2*pad), h-pad-(v-min)/(max-min)*(h-2*pad)]; });
    var last = pts[pts.length-1];
    return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" style="margin-top:8px;">' +
      '<path d="'+pts.map(function(p, i){ return (i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2"/>' +
      '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.5" fill="var(--accent)"/></svg>';
  }
  function renderParametersCard(p){
    var params = p.parameters || [];
    var have = params.map(function(x){ return (x.name||'').toLowerCase(); });
    var lib = state.paramLibrary.filter(function(l){ return have.indexOf((l.name||'').toLowerCase())===-1; });
    function card(prm){
      var st = paramStats(p, prm), unit = esc(prm.unit||''), id = esc(prm.id);
      var editing = state.paramEditId===prm.id, first = st.now===null;
      var tone = st.improving===null ? 'var(--ink-600)' : (st.improving ? 'var(--good)' : 'var(--bad)');
      var deltaLine = '';
      if (!first){
        deltaLine = st.delta===0 ? 'No change since the start' : ((st.delta>0?'▲ ':'▼ ')+fmtNum(Math.abs(st.delta))+unit+' since the start' + (st.improving ? ' — improving' : ' — moving the wrong way'));
        if (st.pct!==null) deltaLine += ' · '+st.pct+'% of the way to target';
      }
      var recent = st.readings.slice().reverse().slice(0, 4);
      return '<div class="card paramcard">' +
        '<div class="paramhead">' +
          '<div style="min-width:0;"><div class="paramname">'+esc(prm.name||'Parameter')+'</div>' +
            '<div class="histmeta">'+(prm.better==='higher'?'Higher':'Lower')+' is better'+(st.target!==null ? ' · target '+fmtNum(st.target)+unit : '')+'</div></div>' +
          '<button type="button" class="iconbtn" data-action="param-edit" data-pid="'+id+'" title="Edit this parameter">'+(editing?'✕':'⚙️')+'</button>' +
        '</div>' +
        (editing ? (
          '<div class="paramedit">' +
            '<div class="field" style="margin-bottom:10px;"><label>Name</label><input type="text" data-pfield="name" data-pid="'+id+'" value="'+esc(prm.name||'')+'" placeholder="e.g. Wastage"></div>' +
            '<div style="display:flex;gap:10px;">' +
              '<div class="field" style="flex:1;margin-bottom:10px;"><label>Unit</label><input type="text" data-pfield="unit" data-pid="'+id+'" value="'+esc(prm.unit||'')+'" placeholder="%, min, ₹"></div>' +
              '<div class="field" style="flex:1;margin-bottom:10px;"><label>Target</label><input type="number" inputmode="decimal" step="any" data-pfield="target" data-pid="'+id+'" value="'+esc(prm.target===undefined?'':prm.target)+'" placeholder="e.g. 5"></div>' +
            '</div>' +
            '<div class="field" style="margin-bottom:10px;"><label>Better when the number is</label><div style="display:flex;gap:8px;">' +
              [['lower','Lower'],['higher','Higher']].map(function(k){ return '<button type="button" class="naBtn '+((prm.better||'lower')===k[0]?'on':'')+'" data-action="param-better" data-pid="'+id+'" data-val="'+k[0]+'">'+k[1]+'</button>'; }).join('') +
            '</div></div>' +
            '<button type="button" class="btn btn-text btn-danger btn-sm" data-action="param-remove" data-pid="'+id+'">Remove this parameter</button>' +
          '</div>'
        ) : '') +
        (first ? '<div class="helper" style="margin:8px 0;">No readings yet — add the starting value below.</div>' : (
          '<div class="paramnums">' +
            '<div><div class="pv">'+fmtNum(st.now)+unit+'</div><div class="pk">Now</div></div>' +
            '<div><div class="pv">'+fmtNum(st.start)+unit+'</div><div class="pk">Start</div></div>' +
            '<div><div class="pv">'+(st.target!==null ? fmtNum(st.target)+unit : '—')+'</div><div class="pk">Target</div></div>' +
          '</div>' +
          (st.pct!==null ? '<div class="progtrack"><div class="progfill" style="width:'+st.pct+'%;"></div></div>' : '') +
          '<div class="histmeta" style="margin-top:6px;font-weight:700;color:'+tone+';">'+esc(deltaLine)+'</div>' +
          paramSpark(st.readings.map(function(r){ return r.value; }))
        )) +
        '<div class="paramadd"><input type="number" inputmode="decimal" step="any" id="rdVal_'+id+'" placeholder="'+(first?'Starting value':'New reading')+'"><input type="date" id="rdDate_'+id+'" value="'+todayISO()+'"></div>' +
        '<div class="paramadd" style="margin-top:8px;"><input type="text" id="rdNote_'+id+'" placeholder="Note (optional) — what changed?"><button type="button" class="btn btn-primary btn-sm" style="flex:none;" data-action="add-reading" data-pid="'+id+'">'+(first?'Save start':'+ Reading')+'</button></div>' +
        (recent.length ? '<div style="margin-top:10px;">' + recent.map(function(r){
          return '<div class="sumrow"><span class="k">'+esc(fmtDateShort(new Date(r.date+'T00:00:00').getTime()))+(r.note?' · '+esc(r.note):'')+(r.id===st.readings[0].id?' <span class="pill accent" style="margin-left:4px;">Start</span>':'')+'</span>' +
            '<span class="v">'+fmtNum(r.value)+unit+' <button type="button" class="iconbtn" data-action="delete-reading" data-id="'+esc(r.id)+'" title="Delete this reading">✕</button></span></div>';
        }).join('') + '</div>' : '') +
      '</div>';
    }
    return sh('📈','Analysis parameters') +
      '<div class="helper" style="margin:-4px 0 10px;">The numbers that guide the whole engagement. Record a starting value after the first audit, set a target, and add a reading each time you re-measure.</div>' +
      params.map(card).join('') +
      '<div class="field" style="margin-bottom:22px;"><select data-proxy="1" aria-label="Add a parameter"><option value="">＋ Add a parameter…</option>' +
        lib.map(function(l){ return '<option value="'+esc(l.id)+'" data-action="param-add" data-lib="'+esc(l.id)+'">'+esc(l.name)+(l.unit?' ('+esc(l.unit)+')':'')+'</option>'; }).join('') +
        '<option value="custom" data-action="param-add">Custom parameter…</option>' +
      '</select></div>';
  }

  // ---------- client trail: inquiry, solution tasks and client requests ----------
  function inquiryAreaOptions(type){
    var names = [], seen = {};
    var kinds = state.templates[type] ? [type] : templateKeys();
    kinds.forEach(function(k){
      ((state.templates[k]||{}).sections||[]).forEach(function(s){
        var n = (s.name||'').trim();
        if (n && !seen[n.toLowerCase()]){ seen[n.toLowerCase()] = true; names.push(n); }
      });
    });
    return names;
  }
  function cleanInquiry(list){
    return (list||[]).filter(function(e){ return (e.problem||'').trim() || (e.action||'').trim(); })
      .map(function(e){ return { id:e.id, area:e.area||'', problem:(e.problem||'').trim(), action:(e.action||'').trim(), createdAt:e.createdAt||Date.now() }; });
  }
  function mergeInquiryInto(p, entries, auditId){
    if (!entries || !entries.length) return;
    p.inquiry = p.inquiry || [];
    entries.forEach(function(e){
      var ex = p.inquiry.filter(function(x){ return x.id===e.id; })[0];
      if (ex){ ex.area = e.area; ex.problem = e.problem; ex.action = e.action; }
      else { p.inquiry.push({ id:e.id, area:e.area, problem:e.problem, action:e.action, createdAt:e.createdAt||Date.now(), auditId:auditId }); }
    });
  }
  function inquiryForSection(d, sec){

  // ---------- duplicate-name detection ----------
  function levenshtein(a, b){
    a = (a||'').toLowerCase(); b = (b||'').toLowerCase();
    var m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    var dp = new Array(n+1);
    for (var j=0;j<=n;j++) dp[j] = j;
    for (var i=1;i<=m;i++){
      var prev = dp[0]; dp[0] = i;
      for (var j2=1;j2<=n;j2++){
        var tmp = dp[j2];
        dp[j2] = a[i-1]===b[j2-1] ? prev : 1+Math.min(prev, dp[j2], dp[j2-1]);
        prev = tmp;
      }
    }
    return dp[n];
  }

  function findSimilarStoreName(query){
    var q = (query||'').trim();
    if (q.length < 3) return null;
    var qKey = q.toLowerCase();
    var names = {};
    state.prospects.forEach(function(p){ if ((p.name||'').trim()) names[p.name.trim()] = true; });
    state.history.forEach(function(h){ if ((h.storeName||'').trim()) names[h.storeName.trim()] = true; });
    var best = null, bestDist = Infinity;
    Object.keys(names).forEach(function(name){
      var key = name.toLowerCase();
      if (key===qKey) return;
      var dist = levenshtein(qKey, key);
      var thresh = Math.max(1, Math.round(Math.min(qKey.length, key.length)*0.2));
      if (dist<=thresh && dist<bestDist){ bestDist = dist; best = name; }
    });
    return best;
  }

  }

            (failed ? '<div class="failblock"><input type="text" class="itemvalue" data-bind-item="failNote" data-sec="'+sec.id+'" data-item="'+it.id+'" placeholder="What is wrong?" value="'+esc(it.failNote||'')+'"><label class="answerlabel">Fix by</label><input type="date" class="itemvalue" data-bind-item="failDue" data-sec="'+sec.id+'" data-item="'+it.id+'" value="'+esc(it.failDue||'')+'"><div class="histmeta">Becomes a corrective action when you complete the audit.</div></div>' : '') +

          '</div>' +

      }).join('');
      return '<div class="section '+(active?'active':'')+'">' +
        '<button class="sechead" data-action="toggle-section" data-sec="'+sec.id+'">' +

  function previousAuditForStore(storeName, excludeId){

  // ---- "Ask whom": a checklist item can name the people to ask, and each gives their own answer ----
  var DEFAULT_ASK_ROLES = ['Owner','Manager','Chef / Kitchen','Floor staff','Cashier','Delivery rider','Housekeeping','Front desk'];
  function allAskRoles(){
    var seen = {}, out = [];
    DEFAULT_ASK_ROLES.forEach(function(r){ seen[r.toLowerCase()] = true; out.push(r); });
    Object.keys(state.templates).forEach(function(k){ state.templates[k].sections.forEach(function(s){ s.items.forEach(function(it){ (it.askWho||[]).forEach(function(r){ if (!seen[r.toLowerCase()]){ seen[r.toLowerCase()] = true; out.push(r); } }); }); }); });
    return out;
  }
  function whoNumbers(it){ return Object.keys(it.who||{}).map(function(r){ return it.who[r]; }).filter(function(v){ return v!=='' && v!==undefined && !isNaN(parseFloat(v)); }).map(parseFloat); }
  function askWhoHtml(it, sec){
    var roles = it.askWho || [];
    if (!roles.length) return '';
    var num = (it.kind||'tick')==='number';
    var nums = num ? whoNumbers(it) : [];
    var differ = nums.length>=2 && Math.max.apply(null, nums)!==Math.min.apply(null, nums);
    var rangeHint = (num && (it.passMin!=='' && it.passMin!==undefined || it.passMax!=='' && it.passMax!==undefined)) ? ' · OK range: '+(it.passMin!==''&&it.passMin!==undefined?it.passMin:'…')+' – '+(it.passMax!==''&&it.passMax!==undefined?it.passMax:'…')+(it.unit?' '+it.unit:'') : '';
    return '<div class="askblock"><div class="answerlabel">👤 Ask '+roles.length+' '+(roles.length===1?'person':'people')+(num ? ' · '+esc(it.infoLabel||'Reading')+(it.unit?' ('+esc(it.unit)+')':'')+esc(rangeHint) : '')+'</div>' +
      roles.map(function(r){
        return '<div class="askrow"><span class="askrole">'+esc(r)+'</span><input class="itemvalue" '+(num ? 'type="number" step="any" inputmode="decimal"' : 'type="text"')+' data-bind-who="'+esc(r)+'" data-sec="'+sec.id+'" data-item="'+it.id+'" placeholder="'+(num ? 'Value' : 'Their answer')+'" value="'+esc((it.who||{})[r]||'')+'"></div>';
      }).join('') +
      (differ ? '<div class="histmeta" style="color:var(--bad);font-weight:600;">⚠ Their answers differ ('+nums.join(' / ')+')</div>' : '') + '</div>';
  }
  // Up to two extra answer fields per item (e.g. 'Brand', 'Last serviced'), each a short text or a number.
  var MAX_ANSWERS = 2;
  function ansFieldsHtml(it, sec){
    var defs = it.answers || [];
    if (!defs.length) return '';
    return '<div class="ansblock">' + defs.map(function(a, i){
      return '<label class="answerlabel">📝 '+esc(a.label||('Answer '+(i+1)))+'</label><input class="itemvalue" '+(a.type==='number' ? 'type="number" step="any" inputmode="decimal"' : 'type="text"')+' data-bind-ans="'+i+'" data-sec="'+sec.id+'" data-item="'+it.id+'" placeholder="'+esc(a.label||'Enter answer')+'" value="'+esc((it.ansVals||[])[i]||'')+'">';
    }).join('') + '</div>';

  function ansLines(it){
    return (it.answers||[]).map(function(a, i){ var v = (it.ansVals||[])[i]; return (v!==undefined && v!=='') ? (a.label||('Answer '+(i+1)))+': '+v : null; }).filter(Boolean);

  function whoLines(it){

    var arrow = delta>0 ? '▲' : (delta<0 ? '▼' : '—');
    return '<span class="pill '+tone+'" style="margin-left:8px;">'+arrow+' '+(delta>0?'+':'')+delta+' pts vs last visit</span>';

  // ---- Billing: invoices per client (invoice date, due date, amount, paid or not) ----
  function addDaysISO(iso, n){ var d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoFromDate(d); }
  function addMonthsISO(iso, n){
    var d = new Date(iso+'T00:00:00'), day = d.getDate();
    d.setDate(1); d.setMonth(d.getMonth()+n);
    var last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day, last));
    return isoFromDate(d);
  }
  function invAmount(inv){ return Number(inv.amount)||0; }
  function invDue(inv){ return inv.dueDate || inv.date || ''; }
  function invStatus(inv){
    if (inv.paid) return { key:'paid', label:'Paid', tone:'good' };
    var due = invDue(inv), today = todayISO();
    if (due && due<today) return { key:'overdue', label:'Overdue '+Math.max(1, Math.round((new Date(today+'T00:00:00')-new Date(due+'T00:00:00'))/86400000))+'d', tone:'bad' };
    if (due===today) return { key:'due', label:'Due today', tone:'warn' };
    return { key:'pending', label:'Due '+fmtDateShort(new Date(due+'T00:00:00').getTime()), tone:'warn' };
  }
  function allInvoices(){
    var out = [];
    state.prospects.forEach(function(p){ if (p.declined) return; (p.invoices||[]).forEach(function(inv){ out.push({ p:p, inv:inv }); }); });
    return out;
  }
  // The next invoice you should raise: a one-time deal bills once; a retainer bills again a month after the last one.
  function nextInvoiceSuggestion(p){
    if (!p.converted || p.declined || p.engagementEnded) return null;
    var price = clientPriceOf(p);
    if (!price) return null;
    var invs = (p.invoices||[]).slice().sort(function(a,b){ return (a.date||'')<(b.date||'') ? -1 : 1; });
    var base = p.convertedAt ? isoFromDate(new Date(p.convertedAt)) : todayISO();
    if (p.pricingType==='retainer'){
      return { date: invs.length ? addMonthsISO(invs[invs.length-1].date||base, 1) : base, amount: price, retainer:true };
    }
    return invs.length ? null : { date: base, amount: price, retainer:false };
  }
  function makeInvoice(date, amount, note, dueGapDays){
    return { id: uid(), date: date, dueDate: addDaysISO(date, dueGapDays===undefined ? 7 : dueGapDays), amount: Number(amount)||0, note: note||'', paid:false, paidDate:'', createdAt: Date.now() };
  }
  function fmtMonthYear(iso){ return new Date(iso+'T00:00:00').toLocaleDateString(undefined,{month:'long', year:'numeric'}); }
  function fmtMoney(n){ return (state.pricing.currency||'₹')+Math.round(n).toLocaleString('en-IN'); }
  function invDraftFor(p){
    var sg = nextInvoiceSuggestion(p);
    if (!state.invDraft || state.invDraft.pid!==p.id){
      var dt = todayISO();
      state.invDraft = { pid:p.id, date:dt, due:addDaysISO(dt,7), amount: sg ? String(sg.amount) : (clientPriceOf(p) ? String(clientPriceOf(p)) : ''), note:'' };
    }
    return state.invDraft;
  }
  function renderBillingCard(p){
    if (!p.converted && !(p.invoices||[]).length) return '';
    var invs = (p.invoices||[]).slice().sort(function(a,b){ return (b.date||'')<(a.date||'') ? -1 : 1; });
    var total = invs.reduce(function(s,i){ return s+invAmount(i); }, 0);
    var paid = invs.filter(function(i){ return i.paid; }).reduce(function(s,i){ return s+invAmount(i); }, 0);
    var sg = nextInvoiceSuggestion(p), dr = invDraftFor(p);
    return sh('💸','Billing') +
      '<div class="card" style="padding:14px 16px;margin-bottom:20px;">' +
        (invs.length ? '<div class="statgrid" style="margin:0 0 12px;"><div class="stattile"><div class="v">'+fmtMoney(total)+'</div><div class="k">Invoiced</div></div><div class="stattile t-good"><div class="v">'+fmtMoney(paid)+'</div><div class="k">Paid</div></div><div class="stattile'+(total-paid?' t-bad':'')+'"><div class="v">'+fmtMoney(total-paid)+'</div><div class="k">Outstanding</div></div></div>' : '') +
        (sg ? '<div class="checkrow" style="padding:10px 12px;margin:0 0 10px;background:var(--accent-soft);border-radius:12px;"><div class="cr-main"><div class="cr-title" style="font-size:14px;">'+(sg.retainer ? 'Next monthly invoice' : 'Raise the invoice')+': '+esc(fmtDateShort(new Date(sg.date+'T00:00:00').getTime()))+'</div><div class="cr-sub">'+fmtMoney(sg.amount)+(sg.retainer ? ' per month' : '')+'</div></div><button type="button" class="btn btn-primary btn-sm" data-action="quick-invoice" data-id="'+p.id+'">Create invoice</button></div>' : '') +
        invs.map(function(inv){
          var st = invStatus(inv);
          return '<div style="padding:10px 0;border-top:1px solid var(--line);">' +
            '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;"><div style="font-weight:800;">'+fmtMoney(invAmount(inv))+(inv.note?' <span style="font-weight:500;color:var(--ink-600);">· '+esc(inv.note)+'</span>':'')+'</div><span class="pill '+st.tone+'">'+esc(st.label)+'</span></div>' +
            '<div class="histmeta">Invoice date '+esc(fmtDateShort(new Date(inv.date+'T00:00:00').getTime()))+' · payment due '+esc(fmtDateShort(new Date(invDue(inv)+'T00:00:00').getTime()))+(inv.paid && inv.paidDate ? ' · paid '+esc(fmtDateShort(new Date(inv.paidDate+'T00:00:00').getTime())) : '')+'</div>' +
            '<div class="contactrow" style="margin-top:6px;">' +
              '<button type="button" class="btn btn-ghost btn-sm" data-action="toggle-invoice-paid" data-pid="'+p.id+'" data-iid="'+inv.id+'">'+(inv.paid ? '↺ Mark unpaid' : '✓ Mark paid')+'</button>' +
              '<button type="button" class="btn btn-text btn-danger btn-sm" data-action="delete-invoice" data-pid="'+p.id+'" data-iid="'+inv.id+'">Delete</button>' +
            '</div></div>';
        }).join('') +
        '<div style="border-top:1px solid var(--line);margin-top:'+(invs.length?'6':'0')+'px;padding-top:12px;">' +
          '<div class="answerlabel" style="margin-bottom:8px;">Add an invoice</div>' +
          '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
            '<div class="field" style="flex:1;min-width:130px;margin-bottom:0;"><label>Invoice date</label><input type="date" data-inv-field="date" value="'+esc(dr.date)+'"></div>' +
            '<div class="field" style="flex:1;min-width:130px;margin-bottom:0;"><label>Payment due</label><input type="date" data-inv-field="due" value="'+esc(dr.due)+'"></div>' +
          '</div>' +
          '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">' +
            '<div class="field" style="flex:1;min-width:130px;margin-bottom:0;"><label>Amount ('+esc(state.pricing.currency||'₹')+')</label><input type="number" min="0" inputmode="numeric" data-inv-field="amount" value="'+esc(dr.amount)+'" placeholder="e.g. 60000"></div>' +
            '<div class="field" style="flex:2;min-width:150px;margin-bottom:0;"><label>Note (optional)</label><input type="text" data-inv-field="note" value="'+esc(dr.note)+'" placeholder="e.g. October retainer"></div>' +
          '</div>' +
          '<button type="button" class="btn btn-primary btn-sm" style="width:100%;margin-top:12px;" data-action="add-invoice" data-pid="'+p.id+'">+ Add invoice</button>' +
        '</div>' +
      '</div>';
  }
  function renderInvoicesBoard(){
    var all = allInvoices();

    if (!all.length && !sugg.length) return '';

    var sum = function(a){ return a.reduce(function(s,x){ return s+invAmount(x.inv); }, 0); };
    var paidMonth = all.filter(function(x){ return x.inv.paid && (x.inv.paidDate||'')>=mStart; });
    var list = unpaid.slice().sort(function(a,b){ return invDue(a.inv)<invDue(b.inv) ? -1 : 1; }).slice(0, 5);
    return sh('💸','Invoices') +
