  function weekGroupHtml(key, title, items, opt){
    var open = state.contentOpen[key]===undefined ? !!opt.defOpen : state.contentOpen[key];

    var summary = items.length ? order.map(function(ic){ return ic+' '+counts[ic]; }).join(' · ') : 'Nothing scheduled';
    var meta = (opt.dateLabel ? opt.dateLabel+' · ' : '')+summary;
    return '<div class="card cgroup'+(open?' open':'')+(opt.overdue?' overdue':'')+'">' +

        '<span style="min-width:0;"><span class="cgtitle">'+esc(title)+'</span><span class="histmeta" style="display:block;margin-top:2px;">'+esc(meta)+'</span></span>' +
        '<span class="cgright"><span class="pill '+(items.length?(opt.overdue?'bad':'good'):'warn')+'" style="white-space:nowrap;">'+(items.length||'None')+'</span><span class="chev">▶</span></span>' +
      '</button>' +
      (open && items.length ? '<div class="cgbody">'+items.map(function(e){ return weekRowHtml(e, !!opt.overdue); }).join('')+'</div>' : '') +

  function renderWeekPreview(){

  }

  function renderDashboard(){
    var now = Date.now();
    var weekAgo = now - 7*24*60*60*1000;
    var weekAhead = now + 7*24*60*60*1000;
    var todayStartD = new Date(); todayStartD.setHours(0,0,0,0);
    var todayStartMs = todayStartD.getTime();

    var nowD = new Date(now);
    var monthStartMs = new Date(nowD.getFullYear(), nowD.getMonth(), 1).getTime();
    var monthName = nowD.toLocaleDateString(undefined,{month:'long', year:'numeric'});
    var revenueMonth = clientRevenueForMonth(nowD.getFullYear(), nowD.getMonth());
    var clientsMonth = state.prospects.filter(function(p){ return p.converted && (p.convertedAt||0)>=monthStartMs; }).length;

    var actionsResolvedWeek = state.correctiveActions.filter(function(a){ return a.done && (a.resolvedAt||0)>=weekAgo; }).length;
    var openActionsNow = state.correctiveActions.filter(function(a){ return !a.done; }).length;
    var todayStr = todayISO();
    var overdueActions = state.correctiveActions.filter(function(a){ return !a.done && a.dueDate && a.dueDate<todayStr; }).length;

    var due = computeDueList();
    var dueSoon = due.filter(function(x){ return x.dueAt<=weekAhead; });
    var overdueDue = due.filter(function(x){ return x.dueAt<now; }).length;

    var totalActionsAll = state.correctiveActions.length;
    var resolvedTotal = state.correctiveActions.filter(function(a){ return a.done; }).length;
    var resolutionPct = totalActionsAll ? Math.round(resolvedTotal/totalActionsAll*100) : 0;

    var newCalls = smNewCount();
    var dc = dayCounts();
    // Headline = the single most urgent thing, in the same order the day should be worked.
    var greeting = 'All clear — nothing urgent today';
    if (dc.overdue>0) greeting = dc.overdue+' overdue — clear '+(dc.overdue>1?'these':'this')+' first';
    else if (newCalls) greeting = newCalls+' new call request'+(newCalls>1?'s':'')+' to answer';
    else if (dc.today>0) greeting = dc.today+' thing'+(dc.today>1?'s':'')+' on your plate today';
    else if (overdueDue>0) greeting = overdueDue+' re-audit'+(overdueDue>1?'s':'')+' overdue';
    else if (dueSoon.length>0) greeting = dueSoon.length+' re-audit'+(dueSoon.length>1?'s':'')+' due this week';
    else if (overdueActions>0) greeting = overdueActions+' corrective action'+(overdueActions>1?'s':'')+' overdue';
    else if (openActionsNow>0) greeting = openActionsNow+' open issue'+(openActionsNow>1?'s':'')+' to resolve';
    var hr = new Date().getHours();
    var todayLabel = (hr<12 ? 'Good morning' : (hr<17 ? 'Good afternoon' : 'Good evening'))+' · '+new Date().toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric'});
    // Order: what needs doing now → quick actions → business numbers → history.
    return '<main>' +
      '<div class="dashhero">' +
        '<span class="datepill">📅 '+esc(todayLabel)+'</span>' +
        '<h1 style="font-size:25px;">'+esc(greeting)+'</h1>' +
      '</div>' +
      renderDashboardTimeCard() +

      '<button type="button" class="card dayshort" data-action="go-time">' +
        '<span class="ds"><b>'+dc.today+'</b><span>Today</span></span>' +
        '<span class="ds'+(dc.overdue?' bad':'')+'"><b>'+dc.overdue+'</b><span>Overdue</span></span>' +
        '<span class="ds"><b>'+dc.week+'</b><span>Next 7 days</span></span>' +
        '<span class="ds-go">Open The Day ›</span>' +

        '<button class="btn btn-primary" data-action="go-setup">+ New audit</button>' +
        '<button class="btn btn-ghost" data-action="go-maps">📞 Calls'+(newCalls?' ('+newCalls+' new)':'')+'</button>' +

      renderWorkBoard() +
      renderTargetCard(monthName, revenueMonth, clientsMonth) +
      renderLoopBoard() +
      renderParamsBoard() +
      renderRecentAudits() +
    '</main>';

        var aEl = document.querySelector('[data-wtimer="away-'+ow.id+'"]');

        if (wEl) wEl.textContent = fmtTime(work);

  function downloadCSV(csv, filename){
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function downloadJSON(json, filename){
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

      };
      reader.readAsText(file);
    }
  });

  window.addEventListener('online', function(){ state.online = true; fsStartRecordSync(); render(); });
  window.addEventListener('offline', function(){ state.online = false; render(); });

  var authKicked = false;
  firebase.auth().onAuthStateChanged(function(user){
    detachFirestoreSync();
    if (user && (user.email||'').toLowerCase()!==OWNER_EMAIL.toLowerCase()){
      authKicked = true;
      firebase.auth().signOut();
      state.authUser = null;
      state.authReady = true;
      state.authError = 'This app is private — access is restricted to its owner.';
      render();
      return;
    }
    state.authUser = user;
    state.authReady = true;
    if (!authKicked) state.authError = '';
    authKicked = false;
    if (user) attachFirestoreSync();
    render();
  });
})();
</script>

<script>
  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>

</body>
</html>
