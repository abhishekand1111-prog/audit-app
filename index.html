<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnosis Room</title>
<meta name="description" content="Timed, section-by-section audit checklists for Dine-In and QSR floor checks.">
<link rel="manifest" href="manifest.json?v=4">
<link rel="icon" href="icons/favicon-32.png?v=4" type="image/png" sizes="32x32">
<link rel="icon" href="icons/icon-192.png?v=4" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Diagnosis Room">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F2F2;
    --ink:#000000; --ink-600:#4B4B4B; --ink-400:#8A8A8A;
    --line:#E4E4E4; --line-strong:#CFCFCF;
    --accent:#2596E0; --accent-ink:#0F5C8C; --accent-soft:#E1F1FB;
    --good:#2E7D4F; --good-soft:#DCEEE2;
    --bad:#C1392B; --bad-soft:#F6DFDA;
    --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.06);
    --shadow-sm:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
    --r-s:8px; --r-m:12px; --r-l:18px;
    --font-d:'Inter',"Segoe UI",sans-serif;
    --font-b:'Inter',-apple-system,"Segoe UI",sans-serif;
    --font-m:'IBM Plex Mono',"SFMono-Regular",Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0A0A0A; --surface:#161616; --surface-2:#202020;
      --ink:#FFFFFF; --ink-600:#B0B0B0; --ink-400:#7A7A7A;
      --line:#2C2C2C; --line-strong:#3D3D3D;
      --accent:#5CB8F5; --accent-ink:#BEE4FB; --accent-soft:#123349;
      --good:#59B583; --good-soft:#24352B;
      --bad:#E2645A; --bad-soft:#3A2622;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
      --shadow-sm:0 1px 2px rgba(0,0,0,.25),0 2px 8px rgba(0,0,0,.2);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0A0A0A; --surface:#161616; --surface-2:#202020;
    --ink:#FFFFFF; --ink-600:#B0B0B0; --ink-400:#7A7A7A;
    --line:#2C2C2C; --line-strong:#3D3D3D;
    --accent:#5CB8F5; --accent-ink:#BEE4FB; --accent-soft:#123349;
    --good:#59B583; --good-soft:#24352B;
    --bad:#E2645A; --bad-soft:#3A2622;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.25),0 2px 8px rgba(0,0,0,.2);
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
  html,body{background:var(--paper);}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-b); margin:0;}
  h1,h2,h3{font-family:var(--font-d); font-weight:800; letter-spacing:-0.01em; text-wrap:balance; margin:0;}
  .mono{font-family:var(--font-m); font-variant-numeric:tabular-nums;}
  button{font-family:var(--font-b); cursor:pointer;}
  input,textarea{font-family:var(--font-b);}
  .shell{max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--paper);}
  .authwrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 18px; background:var(--paper);}
  .authcard{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--shadow); padding:28px 24px;}
  .authbrand{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;}
  .authbrand .logo{width:76px; height:76px; border-radius:20px; display:block; box-shadow:0 6px 18px rgba(0,0,0,.18), 0 0 0 1px var(--line-strong);}
  .authbrand .name{font-family:var(--font-d); font-weight:800; font-size:16px;}
  .authloading{color:var(--ink-400); font-size:14px;}
  .topbar{position:sticky; top:0; z-index:10; background:var(--paper); border-bottom:1px solid var(--line); padding:12px 16px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px;}
  .tb-side{display:flex; align-items:center; gap:10px; min-width:0;}
  .tb-side.tb-right{justify-content:flex-end;}
  .brand{display:flex; align-items:center; gap:9px; cursor:pointer; border:none; background:none; padding:0;}
  .brand .logo, .sidebar-brand .logo{width:34px; height:34px; border-radius:9px; display:block; flex:none;}
  .brand .name, .sidebar-brand .name{font-family:var(--font-d); font-weight:800; font-size:18px; color:var(--ink);}
  .brand{min-width:0;}
  .brand .name{font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hamburger{width:36px; height:36px; flex:none; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); border-radius:var(--r-s); font-size:16px; display:flex; align-items:center; justify-content:center; padding:0; transition:background .15s;}
  .syncpill{font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:20px; white-space:nowrap; flex:none;}
  .syncpill.sp-good{color:var(--good); background:var(--good-soft);}
  .syncpill.sp-accent{color:var(--accent-ink); background:var(--accent-soft);}
  .syncpill.sp-bad{color:var(--bad); background:var(--bad-soft);}
  .hamburger:hover{background:var(--surface-2);}
  .sidebar-overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:19;}
  .sidebar-overlay.show{opacity:1; pointer-events:auto;}
  .sidebar{position:fixed; top:0; left:0; bottom:0; width:250px; max-width:82vw; background:var(--surface); border-right:1px solid var(--line); z-index:20; transform:translateX(-100%); transition:transform .25s ease; display:flex; flex-direction:column; padding:16px 12px; overflow-y:auto;}
  .sidebar.open{transform:translateX(0);}
  .sidebar-brand{display:flex; align-items:center; gap:9px; padding:6px 8px 16px; border-bottom:1px solid var(--line); margin-bottom:10px;}
  .sidebarbtn{display:flex; align-items:center; justify-content:space-between; gap:8px; text-align:left; width:100%; border:none; background:none; color:var(--ink-600); font-size:14.5px; font-weight:600; padding:11px 10px; border-radius:var(--r-s); margin-bottom:2px; transition:background .15s, color .15s;}
  .sidebarbtn:hover:not(:disabled){background:var(--surface-2); color:var(--ink);}
  .sidebarbtn.active{background:var(--accent); color:#fff;}
  .sidebarbtn:disabled{opacity:.35; cursor:not-allowed;}
  .sidebarbtn .count{font-size:11.5px; font-family:var(--font-m); opacity:.75;}
  main{flex:1; padding:22px 18px 90px;}
  .eyebrow{font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-400);}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--shadow);}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:var(--r-m); font-weight:700; font-size:14.5px; padding:11px 18px; border:1px solid transparent; transition:transform .12s, background .15s, box-shadow .15s;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--accent); color:#fff; box-shadow:0 2px 10px rgba(37,150,224,.28);}
  .btn-primary:hover{background:var(--accent-ink); box-shadow:0 3px 14px rgba(37,150,224,.34);}
  .btn-primary:disabled{background:var(--ink-400); box-shadow:none; cursor:not-allowed;}
  .btn-ghost{background:var(--surface); color:var(--ink); border-color:var(--line-strong);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-text{background:none; color:var(--ink-600); padding:8px 4px;}
  .btn-text:hover{color:var(--ink);}
  .btn-danger{color:var(--bad);}
  .btn-sm{padding:6px 11px; font-size:13px; border-radius:var(--r-s);}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-600); margin-bottom:6px;}
  .field input, .field textarea, .field select{width:100%; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); border-radius:var(--r-s); padding:10px 12px; font-size:16px; font-family:inherit;}
  .field select{appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2.5'><polyline points='6 9 12 15 18 9'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:34px;}
  .field input:focus, .field textarea:focus, .field select:focus, button:focus-visible, .navbtn:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  input:focus-visible, textarea:focus-visible, select:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .field textarea{resize:vertical; min-height:88px; line-height:1.45;}

  /* setup */
  .typegrid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:14px 0 20px;}
  .typecard{border:1.5px solid var(--line-strong); border-radius:var(--r-l); padding:16px 14px; background:var(--surface); text-align:left; transition:border-color .15s, background .15s, box-shadow .15s, transform .12s;}
  .typecard:hover{box-shadow:var(--shadow-sm);}
  .typecard:active{transform:scale(.99);}
  .typecard.selected{border-color:var(--accent); background:var(--accent-soft); box-shadow:var(--shadow-sm);}
  .typecard .ticon{font-size:22px;}
  .typecard .tname{font-family:var(--font-d); font-weight:800; font-size:16px; margin-top:8px;}
  .typecard .tmeta{font-size:12.5px; color:var(--ink-600); margin-top:3px;}
  .formstack{display:flex; flex-direction:column; gap:14px; margin-bottom:22px;}
  .cardstack{display:flex; flex-direction:column; gap:12px;}
  .fuquick{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .fuquick .naBtn{padding:9px 6px; font-size:13px; border-radius:10px; text-align:center;}
  .helper{font-size:12.5px; color:var(--ink-400); margin-top:6px;}

  /* audit header */
  .auditbar{position:sticky; top:57px; z-index:9; background:var(--paper); padding:12px 0 14px; border-bottom:1px solid var(--line); margin-bottom:16px; box-shadow:0 4px 12px rgba(0,0,0,.05);}
  .auditbar .row1{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .badge{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--accent-ink); background:var(--accent-soft); padding:3px 8px; border-radius:20px;}
  .storeline{font-weight:700; font-size:15px; margin-top:6px;}
  .storeline .sub{color:var(--ink-600); font-weight:500; font-size:13px;}
  .timerblock{text-align:right;}
  .timerblock .t{font-size:26px; font-weight:600; line-height:1;}
  .timerblock .lbl{font-size:10.5px; color:var(--ink-400); text-transform:uppercase; letter-spacing:.07em; margin-top:2px;}
  .overallprog{margin-top:12px;}
  .progtrack{height:6px; background:var(--surface-2); border-radius:4px; overflow:hidden;}
  .progfill{height:100%; background:var(--accent); border-radius:4px; transition:width .25s;}
  .progtext{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-600); margin-top:5px;}
  .barctl{display:flex; gap:8px; margin-top:12px;}

  /* sections */
  .section{border:1px solid var(--line); border-radius:var(--r-l); background:var(--surface); margin-bottom:12px; overflow:hidden; box-shadow:var(--shadow-sm); transition:border-color .15s, box-shadow .15s;}
  .section.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset, var(--shadow-sm);}
  .sechead{display:flex; align-items:center; gap:12px; padding:14px 16px; width:100%; background:none; border:none; text-align:left; transition:background .12s;}
  .sechead:hover{background:var(--surface-2);}
  .secnum{font-family:var(--font-m); font-size:12px; font-weight:600; color:var(--ink-400); width:20px; flex:none;}
  .sectitle{flex:1; min-width:0;}
  .sectitle .sname{font-weight:700; font-size:15px;}
  .sectitle .smeta{font-size:12px; color:var(--ink-600); margin-top:2px; font-family:var(--font-m);}
  .sectimer{font-family:var(--font-m); font-size:13px; color:var(--ink-600); flex:none; display:flex; align-items:center; gap:5px;}
  .sectimer.running{color:var(--accent-ink); font-weight:600;}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--line-strong); flex:none;}
  .dot.running{background:var(--accent);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
  .dot.running{animation:pulse 1.4s ease-in-out infinite;}
  .chev{color:var(--ink-400); flex:none; transition:transform .18s;}
  .section.active .chev{transform:rotate(180deg);}
  .secbody{padding:0 16px 14px;}
  .item{display:flex; align-items:flex-start; gap:11px; padding:10px 2px; border-top:1px solid var(--line);}
  .item:first-child{border-top:none;}
  .item.priorflag{background:var(--bad-soft); margin:0 -12px; padding:10px 12px; border-radius:8px;}
  .item.hasanswer{background:var(--accent-soft); margin:2px -12px; padding:10px 12px; border-radius:8px; border-top-color:transparent;}
  .item.hasanswer.priorflag{background:var(--bad-soft);}
  .secwarn{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.02em; color:var(--bad); background:var(--bad-soft); padding:2px 9px; border-radius:20px; margin-left:8px; vertical-align:middle;}
  .chk{width:22px; height:22px; border-radius:6px; border:1.5px solid var(--line-strong); background:var(--surface); flex:none; margin-top:1px; display:flex; align-items:center; justify-content:center; transition:background .12s, border-color .12s;}
  .chk.checked{background:var(--good); border-color:var(--good); color:#fff;}
  .chk.na{background:var(--surface-2); border-color:var(--line-strong); color:var(--ink-400);}
  .itemcol{flex:1; min-width:0;}
  .itemtext{font-size:14.5px; line-height:1.4; padding-top:2px; cursor:default;}
  .itemtext.checked{color:var(--ink-600);}
  .itemtext.na{color:var(--ink-400); text-decoration:line-through;}
  .answerblock{margin-top:8px;}
  .answerlabel{display:block; font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--accent-ink); margin-bottom:4px;}
  .itemvalue{display:block; width:100%; border:1px solid var(--line-strong); border-radius:var(--r-s); padding:7px 10px; font-size:16px; background:var(--surface); color:var(--ink); transition:border-color .12s, box-shadow .12s;}
  .itemvalue:focus-visible{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); outline:none;}
  .naBtn{font-size:11px; font-weight:700; color:var(--ink-400); background:none; border:1px solid var(--line-strong); border-radius:20px; padding:4px 9px; flex:none; transition:background .15s, color .15s, border-color .15s;}
  .naBtn:hover:not(.on){background:var(--surface-2); color:var(--ink-600);}
  .naBtn.on{color:var(--accent-ink); border-color:var(--accent); background:var(--accent-soft);}
  .field > div[style*="display:flex"] > .naBtn{flex:1 1 0; min-width:0; padding:9px 8px; font-size:13px; border-radius:10px; text-align:center;}
  .itemrow.hasanswer .naBtn.on, .item.hasanswer .naBtn.on{background:var(--surface);}

  .footerbar{position:fixed; bottom:0; left:0; right:0; background:var(--paper); border-top:1px solid var(--line); padding:12px 18px; display:flex; justify-content:center; z-index:11; box-shadow:0 -4px 16px rgba(0,0,0,.06);}
  .footerbar .inner{max-width:640px; width:100%; display:flex; gap:10px;}
  .footerbar .inner .btn{flex:1;}

  .remarkwrap{padding-top:4px;}
  .dashgrid{display:grid; grid-template-columns:1.3fr 1fr; gap:12px; margin-bottom:20px;}
  @media (max-width:520px){ .dashgrid{grid-template-columns:1fr;} }
  .dashcard{padding:14px 14px 10px;}
  .dashcard-title{font-size:12.5px; font-weight:700; color:var(--ink-600); margin-bottom:10px;}
  .barchart{display:flex; gap:7px; align-items:flex-end; height:96px;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
  .bar-track{width:100%; max-width:26px; height:64px; background:var(--surface-2); border-radius:5px 5px 0 0; display:flex; align-items:flex-end; overflow:hidden;}
  .bar-fill{width:100%; background:var(--accent); border-radius:5px 5px 0 0; min-height:2px; transition:height .3s;}
  .bar-val{font-size:10.5px; font-weight:700; margin-top:4px; font-family:var(--font-m);}
  .bar-lbl{font-size:9.5px; color:var(--ink-400); margin-top:1px;}
  .donutrow{display:flex; align-items:center; gap:14px; height:100%;}
  .donut{width:88px; height:88px; border-radius:50%; background:conic-gradient(var(--donutcolor, var(--accent)) calc(var(--pct)*1%), var(--surface-2) 0); display:flex; align-items:center; justify-content:center; flex:none;}
  .donut-inner{width:64px; height:64px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .donut-val{font-family:var(--font-m); font-weight:700; font-size:16px;}
  .donut-lbl{font-size:9px; color:var(--ink-400); text-transform:uppercase; letter-spacing:.04em; margin-top:1px;}
  .donutstats{flex:1;}
  .donutstats .row{font-size:12.5px; color:var(--ink-600); margin-bottom:4px; display:flex; justify-content:space-between; gap:10px;}
  .donutstats .row b{color:var(--ink); font-family:var(--font-m);}
  .donutstats .row b.bad{color:var(--bad);}
  .stackbar{display:flex; height:14px; border-radius:8px; overflow:hidden; background:var(--surface-2); margin-bottom:12px;}
  .stackbar > div{height:100%; min-width:0;}
  .stacklegend{display:flex; flex-wrap:wrap; gap:10px 16px; font-size:12px; color:var(--ink-600);}
  .stacklegend .dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:5px;}
  .stacklegend b{color:var(--ink); font-family:var(--font-m); margin-left:3px;}
  .lookuprow{display:flex; align-items:center; flex-wrap:wrap; gap:8px; row-gap:6px; padding:9px 0; border-bottom:1px solid var(--line);}
  .lookuprow:last-child{border-bottom:none;}
  .lookuprow.done .lookuptext{text-decoration:line-through; color:var(--ink-400);}
  .lookuptext{flex:1 1 140px; min-width:0; border:none; background:none; color:var(--ink); font-size:16px; padding:4px 0; font-family:inherit; resize:none; overflow-y:auto; max-height:120px; white-space:pre-wrap; word-wrap:break-word; line-height:1.4;}
  .lookuptext:focus{outline:none;}
  .lookuprow select{border:1px solid var(--line-strong); border-radius:var(--r-s); background:var(--surface); color:var(--ink-600); font-size:11.5px; padding:5px 6px; flex:none; transition:border-color .15s;}
  .lookupglimpse-item{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .lookupglimpse-item:last-child{border-bottom:none;}
  .weekcal{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:20px;}
  .calcell{background:var(--surface-2); border-radius:var(--r-s); padding:8px 3px; text-align:center; min-height:66px; display:flex; flex-direction:column; align-items:center; gap:2px; border:none; transition:box-shadow .15s, transform .12s;}
  .calcell.has:hover{box-shadow:var(--shadow-sm); transform:translateY(-1px);}
  .calcell.today{box-shadow:inset 0 0 0 2px var(--ink);}
  .calcell.has{background:var(--accent); cursor:pointer;}
  .calcell.has .cal-dow{color:rgba(255,255,255,.85);}
  .calcell.has .cal-daynum{color:#fff;}
  .calcell.has .cal-topic{color:#fff;}
  .calcell.has .cal-count{color:#fff;}
  .cal-dow{font-size:9.5px; color:var(--ink-400); text-transform:uppercase; font-weight:700;}
  .cal-daynum{font-family:var(--font-m); font-weight:700; font-size:14px; color:var(--ink);}
  .cal-topic{font-size:8.5px; color:var(--accent-ink); line-height:1.2; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; margin-top:1px;}
  .cal-count{font-size:9px; color:var(--accent-ink); font-weight:700; margin-top:1px;}
  .statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:16px 0 20px;}
  .statgrid:has(> :nth-child(2):last-child), .statgrid:has(> :nth-child(4):last-child){grid-template-columns:repeat(2,1fr);}
  .stattile{background:var(--surface-2); border-radius:var(--r-m); padding:12px 12px; transition:box-shadow .15s;}
  .stattile:hover{box-shadow:var(--shadow-sm);}
  .stattile .v{font-family:var(--font-m); font-size:19px; font-weight:600;}

    var tmpl = state.templates[rec.type] || {label:rec.type};
    var lines = [];
    lines.push(rec.storeName||'Unnamed store');
    lines.push((tmpl.label||rec.type)+' audit · '+fmtAuditWhen(rec.auditDate,rec.auditTime));
    if (rec.storeLocation) lines.push(rec.storeLocation);
    lines.push('');
    lines.push('Score: '+rec.completionPct+'% ('+rec.checked+'/'+rec.total+' checked)');
    if (rec.prevScore!==null && rec.prevScore!==undefined){
      var d = rec.completionPct - rec.prevScore;
      lines.push((d>0?'+':'')+d+' pts vs last visit');
    }
    var anyFailed = false;
    rec.sections.filter(sectionWasAudited).forEach(function(s){
      var failed = (s.items||[]).filter(function(it){ return it.state==='unchecked'; });
      if (failed.length){
        anyFailed = true;
        lines.push(''); lines.push(s.name+':');
        failed.forEach(function(it){ lines.push('- '+it.text); });
      }
    });
    if (!anyFailed){ lines.push(''); lines.push('No outstanding issues — all checked items passed.'); }
    if (rec.remark){ lines.push(''); lines.push('Remark: '+rec.remark); }
    return lines.join('\n');
  }

  // ---------- timer math ----------
  function overallElapsed(d){
    var acc = d.overall.accumMs;
    if (d.overall.runningSince) acc += Date.now() - d.overall.runningSince;
    return acc;
  }
  function sectionElapsed(sec){
    var acc = sec.accumMs;
    if (sec.runningSince) acc += Date.now() - sec.runningSince;
    return acc;
  }
  function stopSection(sec){ if (sec.runningSince){ sec.accumMs += Date.now() - sec.runningSince; sec.runningSince = null; } }
  function startSection(sec){ if (!sec.runningSince) sec.runningSince = Date.now(); }
  function stopOverall(d){ if (d.overall.runningSince){ d.overall.accumMs += Date.now() - d.overall.runningSince; d.overall.runningSince = null; } }
  function startOverall(d){ if (!d.overall.runningSince) d.overall.runningSince = Date.now(); }

  function setActiveSection(d, secId){
    d.sections.forEach(function(s){ if (s.id !== secId) stopSection(s); });
    if (d.activeSectionId === secId){
      d.activeSectionId = null;
    } else {
      d.activeSectionId = secId;
      if (!d.overall.paused){
        var sec = d.sections.filter(function(s){ return s.id===secId; })[0];
        startSection(sec);
      }
    }
  }

  function sectionProgress(sec){
    var total = sec.items.length;
    var checked = sec.items.filter(function(i){ return i.state === 'checked'; });
    var na = sec.items.filter(function(i){ return i.state === 'na'; });
    var pct = total === 0 ? 100 : Math.round(checked.length/total*100);
    return { checked: checked.length, total: total, na: na.length, pct: pct };
  }
  function overallProgress(d){
    var checked=0, total=0;
    d.sections.forEach(function(s){ var p = sectionProgress(s); checked+=p.checked; total+=p.total; });
    return { checked:checked, total:total, pct: total===0?100:Math.round(checked/total*100) };
  }

  // ---------- pricing ----------
  function computePricing(type, sectionCount, menuItemCount){
    var cfg = state.pricing[type] || { baseFee:0, perSection:0, perMenuItem:0 };
    var sectionsCost = sectionCount * (cfg.perSection||0);
    var menuCost = (menuItemCount||0) * (cfg.perMenuItem||0);
    var total = (cfg.baseFee||0) + sectionsCost + menuCost;
    return { base:cfg.baseFee||0, sectionsCost:sectionsCost, menuCost:menuCost, total:total, currency: state.pricing.currency||'' };
  }

  // ---------- re-audit schedule ----------
  function computeDueList(){
    var latestByStore = {};
    state.history.forEach(function(h){
      var key = (h.storeName||'Unnamed store').trim().toLowerCase();
      if (!latestByStore[key] || h.finishedAt > latestByStore[key].finishedAt) latestByStore[key] = h;
    });
    var prospectByKey = {};
    state.prospects.forEach(function(p){ var k=(p.name||'').trim().toLowerCase(); if (k) prospectByKey[k]=p; });
    var todayMs = Date.now();
    return Object.keys(latestByStore).map(function(key){
      var h = latestByStore[key];
      var pr = prospectByKey[key];
      var intervalDays = (state.schedule[h.type]||{}).intervalDays || 30;
      var perMonth = pr ? Number(pr.auditsPerMonth) : 0;
      if (perMonth > 0) intervalDays = Math.max(1, Math.round(30/perMonth));
      var computedDueAt = h.finishedAt + intervalDays*86400000;
      var ov = splitReaudit(state.reauditOverrides[key]);
      var dueAt = ov.date ? new Date(ov.date+'T'+(ov.time||'00:00')+':00').getTime() : computedDueAt;
      return {
        key: key, storeName: h.storeName, storeLocation: h.storeLocation, type: h.type,
        lastAuditAt: h.finishedAt, dueAt: dueAt, overridden: !!ov.date, overrideDate: ov.date, overrideTime: ov.time,
        daysUntil: Math.ceil((dueAt-todayMs)/86400000), intervalDays: intervalDays, customCadence: perMonth>0
      };
    }).sort(function(a,b){ return a.dueAt-b.dueAt; });
  }

  function splitReaudit(v){
    var parts = String(v||'').split(' ');
    return { date:parts[0]||'', time:parts[1]||'' };
  }

  // ---------- build a fresh draft ----------
  function newDraft(type, storeName, storeLocation, contactName, contactDesignation, contactMobile, auditDate, auditTime, selectedSectionIds, menuItemCount){
    var tmpl = state.templates[type];
    var chosen = tmpl.sections.filter(function(s){ return selectedSectionIds.indexOf(s.id) !== -1; });
    if (!chosen.length) chosen = tmpl.sections;
    return {
      id: uid(), type: type, storeName: storeName||'', storeLocation: storeLocation||'',
      contactName: contactName||'', contactDesignation: contactDesignation||'', contactMobile: contactMobile||'',
      auditDate: auditDate||todayISO(), auditTime: auditTime||nowHHMM(),
      menuItemCount: Math.max(0, parseInt(menuItemCount,10)||0),
      startedAt: Date.now(), finishedAt: null, remark:'',
      correctiveActions: [],
      overall: { accumMs:0, runningSince: Date.now(), paused:false },
      activeSectionId: null,
      sections: chosen.map(function(s){
        return { id:s.id, name:s.name, accumMs:0, runningSince:null,
          items: s.items.map(function(it){ return { id:it.id, text:it.text, state:'unchecked', requiresInfo:!!it.requiresInfo, infoLabel:it.infoLabel||'', value:'' }; }) };
      })
    };
  }

  function normalizeMobile(v){
    var digits = String(v||'').replace(/[\s\-().]/g, '');
    if (/^\+91/.test(digits)) return digits.slice(3);
    if (/^91\d{10}$/.test(digits)) return digits.slice(2);
    if (/^0\d{10}$/.test(digits)) return digits.slice(1);
    return digits;
  }
  function isValidMobile(v){ return /^[6-9]\d{9}$/.test(normalizeMobile(v)); }
  function mobileErrorText(v){
    return ((v||'').trim() && !isValidMobile(v)) ? 'Enter a valid 10-digit mobile number (starts with 6, 7, 8 or 9).' : '';
  }
  function prospectProblems(p){
    var pr = [];
    if (!(p.name||'').trim()) pr.push('client / store name');
    if (!(p.location||'').trim()) pr.push('location');
    if (p.category!=='dinein' && p.category!=='qsr') pr.push('category');
    if (!(p.address||'').trim()) pr.push('address');
    if (!(p.contactName||'').trim()) pr.push('contact name');
    if (!(p.contactDesignation||'').trim()) pr.push('designation');
    if (!(p.contactMobile||'').trim()) pr.push('mobile number');
    else if (!isValidMobile(p.contactMobile)) pr.push('a valid mobile number');
    return pr;
  }
  function prospectHintText(problems){
    return problems.length ? 'Still needed to complete this client: '+problems.join(', ')+'.' : '✓ All required details are filled in.';

  // ---------- duplicate-name detection ----------
  function levenshtein(a, b){
    a = (a||'').toLowerCase(); b = (b||'').toLowerCase();
    var m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    var dp = new Array(n+1);
    for (var j=0;j<=n;j++) dp[j] = j;
    for (var i=1;i<=m;i++){
      var prev = dp[0]; dp[0] = i;
      for (var j2=1;j2<=n;j2++){
        var tmp = dp[j2];
        dp[j2] = a[i-1]===b[j2-1] ? prev : 1+Math.min(prev, dp[j2], dp[j2-1]);
        prev = tmp;
      }
    }
    return dp[n];
  }

  function findSimilarStoreName(query){
    var q = (query||'').trim();
    if (q.length < 3) return null;
    var qKey = q.toLowerCase();
    var names = {};
    state.prospects.forEach(function(p){ if ((p.name||'').trim()) names[p.name.trim()] = true; });
    state.history.forEach(function(h){ if ((h.storeName||'').trim()) names[h.storeName.trim()] = true; });
    var best = null, bestDist = Infinity;
    Object.keys(names).forEach(function(name){
      var key = name.toLowerCase();
      if (key===qKey) return;
      var dist = levenshtein(qKey, key);
      var thresh = Math.max(1, Math.round(Math.min(qKey.length, key.length)*0.2));
      if (dist<=thresh && dist<bestDist){ bestDist = dist; best = name; }
    });
    return best;
  }

  function openActionsForStore(name){
    var key = (name||'').trim().toLowerCase();
    if (!key) return [];
    return state.correctiveActions.filter(function(a){ return !a.done && (a.storeName||'').trim().toLowerCase()===key; });
  }

  function previousAuditForStore(storeName, excludeId){
    var key = (storeName||'').trim().toLowerCase();

    var matches = state.history.filter(function(h){ return h.id!==excludeId && (h.storeName||'').trim().toLowerCase()===key; })
      .sort(function(a,b){ return b.finishedAt-a.finishedAt; });
    return matches[0] || null;
  }

  function computeRecord(d){
    var op = overallProgress(d);
    var pricing = computePricing(d.type, d.sections.length, d.menuItemCount||0);
    var prev = previousAuditForStore(d.storeName, d.id);
    var hasContact = !!(d.contactName||'').trim();
    var sameAsContact = hasContact && d.witnessSameAsContact!==false;
    return { id:d.id, type:d.type, storeName:d.storeName, storeLocation:d.storeLocation,
      contactName:d.contactName||'', contactDesignation:d.contactDesignation||'', contactMobile:d.contactMobile||'',
      witnessName: sameAsContact ? d.contactName||'' : (d.witnessName||''),
      witnessDesignation: sameAsContact ? d.contactDesignation||'' : (d.witnessDesignation||''),
      witnessMobile: sameAsContact ? d.contactMobile||'' : (d.witnessMobile||''),
      auditDate:d.auditDate, auditTime:d.auditTime, menuItemCount:d.menuItemCount||0,
      startedAt:d.startedAt, finishedAt:d.finishedAt, remark:d.remark,
      totalMs:d.overall.accumMs, completionPct:op.pct, checked:op.checked, total:op.total,
      pricing: pricing,
      prevScore: prev ? prev.completionPct : null, prevAuditDate: prev ? prev.auditDate : null,
      sections: d.sections.map(function(s){
        var p=sectionProgress(s);
        return { id:s.id, name:s.name, accumMs:s.accumMs, checked:p.checked, total:p.total, na:p.na, items:s.items.slice(), issue:(s.issue||'').trim() };
      })
    };
  }

  function scoreDeltaHtml(prevScore, currScore){
    if (prevScore===null || prevScore===undefined) return '';
    var delta = currScore - prevScore;
    var tone = delta>0 ? 'good' : (delta<0 ? 'bad' : 'warn');
    var arrow = delta>0 ? '▲' : (delta<0 ? '▼' : '—');
    return '<span class="pill '+tone+'" style="margin-left:8px;">'+arrow+' '+(delta>0?'+':'')+delta+' pts vs last visit</span>';
  }

  function csvEscape(v){

  }

  function buildProspectsCSV(){

  function applyBackupData(data){
    if (!data || typeof data!=='object') return false;
    var known = ['templates','history','pricing','correctiveActions','schedule','serviceClasses','prospects','lookups','contentIdeas','reauditOverrides','targets'];
    var found = known.some(function(k){ return data[k]!==undefined; });
    if (!found) return false;
    if (data.templates) state.templates = data.templates;
    if (data.history) state.history = data.history;
    if (data.pricing) state.pricing = data.pricing;
    if (data.correctiveActions) state.correctiveActions = data.correctiveActions;
    if (data.schedule) state.schedule = data.schedule;
    if (data.serviceClasses) state.serviceClasses = data.serviceClasses;
    if (data.prospects) state.prospects = data.prospects;
    if (data.lookups) state.lookups = data.lookups;
    if (data.contentIdeas) state.contentIdeas = data.contentIdeas;
    if (data.reauditOverrides) state.reauditOverrides = data.reauditOverrides;
    if (data.targets) state.targets = data.targets;
    persistTemplates(); persistHistory(); persistPricing(); persistActions(); persistSchedule();
    persistServiceClasses(); persistProspects(); persistLookups(); persistContentIdeas(); persistReauditOverrides(); persistTargets();
    return true;
  }

  function renderTrend(list){
    if (list.length < 2) return '';
    var last = list.slice(-12);
    var w = 560, chartH = 90, pad = 8;
    var vals = last.map(function(h){ return h.totalMs; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (min===max){ min = 0; }
    var pts = last.map(function(h, i){
      var x = pad + (i/(last.length-1)) * (w-2*pad);
      var y = chartH - pad - ((h.totalMs-min)/(max-min||1)) * (chartH-2*pad);
      return [x,y];
    });
    var path = pts.map(function(p,i){ return (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
    var lastPt = pts[pts.length-1];
    return '<div class="trendwrap">'+sh('📈','Total duration trend') +
      '<div class="card" style="padding:12px 14px;">' +
      '<svg viewBox="0 0 '+w+' '+chartH+'" width="100%" height="'+chartH+'" preserveAspectRatio="none" role="img" aria-label="Audit duration trend">' +
        '<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2"/>' +
        '<circle cx="'+lastPt[0].toFixed(1)+'" cy="'+lastPt[1].toFixed(1)+'" r="3.5" fill="var(--accent)"/>' +
      '</svg>' +
      '<div class="trendcap"><span>'+fmtDateShort(last[0].finishedAt)+' · '+fmtTime(min===0&&max===0?0:Math.min.apply(null,vals))+'</span><span>longest '+fmtTime(max)+'</span><span>'+fmtDateShort(last[last.length-1].finishedAt)+'</span></div>' +
      '</div></div>';
  }

  function renderCorrectiveList(){
    var showDone = !!state.actionsShowDone;
    var all = state.correctiveActions.slice().sort(function(a,b){
      var ad = a.dueDate ? new Date(a.dueDate+'T00:00:00').getTime() : Infinity;
      var bd = b.dueDate ? new Date(b.dueDate+'T00:00:00').getTime() : Infinity;
      return ad-bd;
    });
    var open = all.filter(function(a){ return !a.done; });
    var done = all.filter(function(a){ return a.done; });
    var todayStr = todayISO();
    var overdueCount = open.filter(function(a){ return a.dueDate && a.dueDate < todayStr; }).length;

    function row(a, isDone){
      var overdue = !isDone && a.dueDate && a.dueDate < todayStr;
      return '<div class="card cacard2">' +
        '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">' +

            '<div class="histtop"><span class="badge">⭐ Scheduled</span><span class="pill '+(overdue?'bad':'warn')+'">'+(overdue?'Overdue':fmtDateShort(new Date(p.plannedAuditDate+'T00:00:00').getTime())+plannedTimeSuffix(p))+'</span></div>' +
            '<div style="font-weight:700;margin-top:8px;">'+esc(p.name||'Unnamed client')+'</div>' +
            '<div class="histmeta">'+esc(p.location||'—')+' · Audit planned for '+fmtDateShort(new Date(p.plannedAuditDate+'T00:00:00').getTime())+plannedTimeSuffix(p)+'</div>' +
          '</div>';
        }).join('') +
      '</div>';
  }

  function renderDueList(){
    var list = computeDueList();
    var todayMs = Date.now();
    var overdue = list.filter(function(x){ return x.dueAt<todayMs; }).length;
    var scheduledHtml = renderScheduledAudits();
    var stat = '<div class="statgrid">' +
      '<div class="stattile"><div class="v">'+list.length+'</div><div class="k">Stores Tracked</div></div>' +
      '<div class="stattile"><div class="v">'+overdue+'</div><div class="k">Overdue</div></div>' +
      '<div class="stattile"><div class="v">'+(list.length-overdue)+'</div><div class="k">On Schedule</div></div>' +
    '</div>';
    if (!list.length) return scheduledHtml + stat + '<div class="empty"><div class="big">🗓️</div>Complete an audit to start tracking re-audit schedules.</div>';
    return scheduledHtml + stat + list.map(function(x){
      var isOverdue = x.dueAt < todayMs;
      var daysAbs = Math.abs(x.daysUntil);
      var statusText = isOverdue ? ('Overdue by '+daysAbs+'d') : (x.daysUntil===0 ? 'Due today' : 'Due in '+x.daysUntil+'d');
      var tone = isOverdue ? 'bad' : (x.daysUntil<=7 ? 'warn' : 'good');
      var tmpl = state.templates[x.type] || { label: x.type };
      var dueProspect = findProspectByName(x.storeName);
      return '<div class="card histcard">' +
        '<div class="histtop"><span class="badge">'+esc(tmpl.label||x.type)+'</span><span class="pill '+tone+'">'+statusText+'</span></div>' +
        '<div style="font-weight:700;margin-top:8px;">'+esc(x.storeName||'Unnamed store')+serviceBadgeHtml(dueProspect)+'</div>' +
        '<div class="histmeta">'+(x.storeLocation?esc(x.storeLocation)+' · ':'')+'Last audited '+fmtDateShort(x.lastAuditAt)+'</div>' +
        '<div class="histmeta">Next due '+fmtDateShort(x.dueAt)+(x.overrideTime?' · '+fmtTime12(x.overrideTime):'')+(x.overridden?' (manually set)':(x.customCadence?' (every '+x.intervalDays+'d — custom cadence)':''))+'</div>' +
        '<div class="cardstack" style="margin-top:12px;">' +
          '<div style="display:flex; gap:10px;">' +
            '<div class="field" style="flex:1;"><label>Reschedule to</label><input type="date" data-reaudit-key="'+esc(x.key)+'" data-reaudit-part="date" value="'+esc(x.overrideDate)+'"></div>' +
            '<div class="field" style="flex:1;"><label>Time</label><input type="time" data-reaudit-key="'+esc(x.key)+'" data-reaudit-part="time" value="'+esc(x.overrideTime)+'"></div>' +
          '</div>' +
          '<div style="display:flex; gap:8px;">' +
            (x.overridden ? '<button type="button" class="btn btn-ghost btn-sm" style="flex:1;" data-action="clear-reaudit-override" data-key="'+esc(x.key)+'">Reopen schedule</button>' : '') +
            '<button type="button" class="btn btn-primary btn-sm" style="flex:1;" data-action="start-reaudit" data-name="'+esc(x.storeName)+'" data-location="'+esc(x.storeLocation||'')+'" data-type="'+esc(x.type)+'">Start Audit</button>' +
          '</div>' +
        '</div>' +
        '<button type="button" class="btn btn-text btn-danger btn-sm" style="margin-top:8px;" data-action="delete-store-audits" data-key="'+esc(x.key)+'" data-name="'+esc(x.storeName)+'">Delete audit history for this store</button>' +
      '</div>';
    }).join('');
  }

  // ---------- prospects ----------
  function prospectStatus(p){
    if (p.converted) return { label:'CONVERTED', tone:'good' };
    if (p.declined) return { label:'NOT CONVERTED', tone:'bad' };
    if (p.auditId && (p.proposed||'').trim()) return { label:'PROPOSED', tone:'warn' };
    if (p.auditId) return { label:'AUDITED', tone:'warn' };
    if (p.plannedAuditDate) return { label:'⭐ SCHEDULED', tone:'warn' };
    return { label:'FRESH LEAD', tone:'warn' };
  }

  function findProspect(id){ return state.prospects.filter(function(p){ return p.id===id; })[0]; }

  function findProspectByName(name){
    var key = (name||'').trim().toLowerCase();
    if (!key) return null;
    return state.prospects.filter(function(p){ return (p.name||'').trim().toLowerCase()===key; })[0] || null;
  }

  function findServiceClass(id){ return state.serviceClasses.filter(function(s){ return s.id===id; })[0] || null; }

  function prospectAudits(p){
    var key = (p.name||'').trim().toLowerCase();
    if (!key) return [];
    return state.history.filter(function(h){ return (h.storeName||'').trim().toLowerCase()===key; })
      .sort(function(a,b){ return b.finishedAt-a.finishedAt; });
  }

  function prospectCategoryLabel(p){
    if (p.category && state.templates[p.category]) return state.templates[p.category].label;
    return p.category || 'Uncategorised';
  }

  function serviceBadgeHtml(p){
    if (!p) return '';
    var cls = p.servicesOffered ? findServiceClass(p.servicesOffered) : null;
    if (cls) return '<span class="badge" style="margin-left:6px;">No. '+cls.number+' — '+esc(cls.label)+'</span>';
    return '<span class="badge" style="margin-left:6px;color:var(--ink-400);background:var(--line);">N/A</span>';
  }

  function renderProspectsDaily(){
    var days = [];
    for (var di=13; di>=0; di--){
      var dd = new Date(); dd.setHours(0,0,0,0); dd.setDate(dd.getDate()-di);
      var dayStart = dd.getTime(), dayEnd = dayStart + 24*60*60*1000;
      var audits = state.history.filter(function(h){ return h.finishedAt>=dayStart && h.finishedAt<dayEnd; })
        .sort(function(a,b){ return b.finishedAt-a.finishedAt; });
      days.push({ iso: dayStart, label: dd.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2), dayNum: dd.getDate(), audits: audits });
    }
    var maxBar = Math.max.apply(null, days.map(function(d){ return d.audits.length; })) || 1;
    var barChartHtml = '<div class="barchart">' + days.map(function(d){
      var h = d.audits.length===0 ? 0 : Math.max(10, Math.round((d.audits.length/maxBar)*100));
      return '<div class="bar-col"><div class="bar-track"><div class="bar-fill" style="height:'+h+'%"></div></div><div class="bar-val">'+d.audits.length+'</div><div class="bar-lbl">'+d.label+' '+d.dayNum+'</div></div>';
    }).join('') + '</div>';

    var daysWithAudits = days.slice().reverse().filter(function(d){ return d.audits.length>0; });

    return '<div class="card dashcard" style="margin-bottom:20px;"><div class="dashcard-title">Audits per day (last 14 days)</div>'+barChartHtml+'</div>' +
      (daysWithAudits.length===0 ? '<div class="empty"><div class="big">📅</div>No audits logged in the last 14 days.</div>' :
        daysWithAudits.map(function(d){
          return '<h2 style="font-size:13px;margin-bottom:6px;color:var(--ink-400);">'+new Date(d.iso).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})+' · '+d.audits.length+' audit'+(d.audits.length>1?'s':'')+'</h2>' +
          '<div style="margin-bottom:16px;">' +
            d.audits.map(function(h){
              return '<div class="card histcard" data-action="view-audit" data-id="'+h.id+'">' +
                '<div class="histtop"><span class="badge">'+esc((state.templates[h.type]||{}).label||h.type)+'</span><span class="histpct">'+h.completionPct+'%</span></div>' +
                '<div style="font-weight:700;margin-top:8px;">'+esc(h.storeName||'Unnamed store')+'</div>' +
                '<div class="histmeta">'+fmtAuditWhen(h.auditDate,h.auditTime)+' · Tap to view full report</div>' +
              '</div>';
            }).join('') +
          '</div>';
        }).join('')
      );
  }

  function renderProspects(){
    if (state.activeProspectId) return renderProspectDetail();
    var pTab = state.prospectsTab || 'pipeline';
    var locs = [], cats = [];
    state.prospects.forEach(function(p){
      if (p.location && locs.indexOf(p.location)===-1) locs.push(p.location);
      if (p.category && cats.indexOf(p.category)===-1) cats.push(p.category);
    });
    locs.sort(); cats.sort();
    var fl = state.prospectsFilterLocation||'all', fc = state.prospectsFilterCategory||'all';
    var list = state.prospects.filter(function(p){
      return (fl==='all' || p.location===fl) && (fc==='all' || p.category===fc);
    }).sort(function(a,b){
      if (!!a.declined !== !!b.declined) return a.declined ? 1 : -1;
      return (b.createdAt||0)-(a.createdAt||0);
    });

    var pipelineList = list.filter(function(p){ return !p.converted; });
    var clientsList = list.filter(function(p){ return p.converted; });
    var pipelineAuditedCount = pipelineList.filter(function(p){ return !!p.auditId; }).length;
    var pipelineDeclinedCount = pipelineList.filter(function(p){ return p.declined; }).length;
    var clientKeys = {};
    clientsList.forEach(function(p){ clientKeys[(p.name||'').trim().toLowerCase()] = true; });
    var clientsDueSoon = computeDueList().filter(function(x){ return clientKeys[x.key] && x.dueAt<=Date.now()+7*24*60*60*1000; }).length;
    var clientsRevenue = clientsList.reduce(function(sum,p){
      return sum + prospectAudits(p).reduce(function(n,h){ return n+(h.pricing?h.pricing.total:0); }, 0);
    }, 0);

    var sortedHist = state.history.slice().sort(function(a,b){ return a.finishedAt-b.finishedAt; });
    var histSummaryHtml = '';
    if (state.history.length){
      var avgMs = Math.round(sortedHist.reduce(function(n,h){ return n+h.totalMs; },0)/sortedHist.length);
      var avgPct = Math.round(sortedHist.reduce(function(n,h){ return n+h.completionPct; },0)/sortedHist.length);
      var totalRevenue = sortedHist.reduce(function(n,h){ return n+(h.pricing?h.pricing.total:0); },0);
      var curr = state.pricing.currency||'';
      histSummaryHtml = sh('📈','Audit Activity') +
        '<div class="statgrid" style="margin-top:0;">' +
          '<div class="stattile t-accent"><div class="v">'+sortedHist.length+'</div><div class="k">Audits Logged</div></div>' +
          '<div class="stattile"><div class="v">'+fmtTime(avgMs)+'</div><div class="k">Avg. Duration</div></div>' +
          '<div class="stattile t-good"><div class="v">'+avgPct+'%</div><div class="k">Avg. Score</div></div>' +
        '</div>' +
        '<div class="stattile" style="margin-bottom:16px;"><div class="v">'+curr+totalRevenue+'</div><div class="k">Total Estimated Pricing</div></div>' +
        renderTrend(sortedHist);
    }

    return '<main>' +
      '<div style="display:flex; justify-content:space-between; align-items:flex-end; gap:10px;">' +
        '<div><div class="eyebrow">Sales Pipeline &amp; Audit History</div><h1 style="font-size:26px;margin-top:6px;">Clients</h1></div>' +
        '<button class="btn btn-primary btn-sm" style="flex:none;" data-action="add-prospect">+ Add Client</button>' +
      '</div>' +
      (state.prospects.length || state.history.length ? (
        '<div style="display:flex; gap:8px; margin-top:12px;">' +
          (state.prospects.length ? '<button class="btn btn-ghost btn-sm" style="flex:1;" data-action="export-prospects-csv">Export Clients CSV</button>' : '') +
          (state.history.length ? '<button class="btn btn-ghost btn-sm" style="flex:1;" data-action="export-csv">Export Audit CSV</button>' : '') +
        '</div>'
      ) : '') +
      '<div class="tabs" style="margin-top:14px;">' +
        '<button class="tab '+(pTab==='pipeline'?'on':'')+'" data-action="prospects-tab" data-tab="pipeline">Pipeline</button>' +
        '<button class="tab '+(pTab==='clients'?'on':'')+'" data-action="prospects-tab" data-tab="clients">Clients</button>' +
        '<button class="tab '+(pTab==='daily'?'on':'')+'" data-action="prospects-tab" data-tab="daily">Daily Activity</button>' +
      '</div>' +
      (pTab==='daily' ? renderProspectsDaily() : (
      (locs.length || cats.length ? (
        '<div style="display:flex; gap:12px; flex-wrap:wrap; margin:14px 0;">' +
          (locs.length ? '<div class="field" style="flex:1; min-width:150px; margin-bottom:0;"><label>Location</label><select data-prospect-filter="location"><option value="all">All locations</option>'+locs.map(function(l){ return '<option value="'+esc(l)+'" '+(fl===l?'selected':'')+'>'+esc(l)+'</option>'; }).join('')+'</select></div>' : '') +
          (cats.length ? '<div class="field" style="flex:1; min-width:150px; margin-bottom:0;"><label>Category</label><select data-prospect-filter="category"><option value="all">All categories</option>'+cats.map(function(c){ return '<option value="'+esc(c)+'" '+(fc===c?'selected':'')+'>'+esc(state.templates[c]?state.templates[c].label:c)+'</option>'; }).join('')+'</select></div>' : '') +
        '</div>'
      ) : '') +
      (pTab==='clients' ? (
        '<div class="statgrid" style="margin-top:0;">' +
          '<div class="stattile t-accent"><div class="v">'+clientsList.length+'</div><div class="k">Total Clients</div></div>' +
          '<div class="stattile'+(clientsDueSoon?' t-bad':'')+'"><div class="v">'+clientsDueSoon+'</div><div class="k">Due This Week</div></div>' +
          '<div class="stattile t-good"><div class="v">'+esc(state.pricing.currency)+clientsRevenue+'</div><div class="k">Total Revenue</div></div>' +
        '</div>' +
        (clientsList.length===0 ? '<div class="empty"><div class="big">🤝</div>No clients yet.<br>Convert a pipeline entry to see them here.</div>' :
          clientsList.map(function(p){
            var audits = prospectAudits(p);
            var next = computeClientNextAction(p, audits);
            var last = audits[0];
            var toneColor = { bad:'var(--bad)', warn:'var(--accent)', good:'var(--good)', accent:'var(--accent)' };
            return '<div class="card histcard" style="border-left:3px solid '+(toneColor[next.tone]||'var(--line)')+';" data-action="open-prospect" data-id="'+p.id+'">' +
              '<div class="histtop"><span><span class="badge">'+esc(prospectCategoryLabel(p))+'</span>'+serviceBadgeHtml(p)+'</span>'+(last?'<span class="histpct">'+last.completionPct+'%</span>':'')+'</div>' +
              '<div style="font-weight:700;margin-top:8px;">'+esc(p.name||'Unnamed client')+'</div>' +
              '<div class="histmeta">'+esc(p.location||'—')+(p.address?' · '+esc(p.address):'')+'</div>' +
              '<div class="histmeta" style="margin-top:4px;">'+next.icon+' '+esc(next.text)+'</div>' +
            '</div>';
          }).join('')
        ) +
        histSummaryHtml
      ) : (
      '<div class="statgrid" style="margin-top:0;">' +
        '<div class="stattile t-accent"><div class="v">'+pipelineList.length+'</div><div class="k">In Pipeline</div></div>' +
        '<div class="stattile"><div class="v">'+pipelineAuditedCount+'</div><div class="k">Audited</div></div>' +
        '<div class="stattile'+(pipelineDeclinedCount?' t-bad':'')+'"><div class="v">'+pipelineDeclinedCount+'</div><div class="k">Not Converted</div></div>' +
      '</div>' +
      (pipelineList.length===0 ? '<div class="empty"><div class="big">🎯</div>No clients yet.<br>Add one to start tracking your pipeline.</div>' :
        pipelineList.map(function(p){
          var st = prospectStatus(p);
          var priceStr = (p.priceMin||p.priceMax) ? (state.pricing.currency||'')+(p.priceMin||'0')+'–'+(state.pricing.currency||'')+(p.priceMax||'0') : '';
          var revealName = p.declined || !!p.plannedAuditDate;
          var stColor = { good:'var(--good)', bad:'var(--bad)', warn:'var(--accent)' }[st.tone] || 'var(--line)';
          return '<div class="card histcard" style="border-left:3px solid '+stColor+';" data-action="open-prospect" data-id="'+p.id+'">' +
            '<div class="histtop"><span><span class="badge">'+esc(prospectCategoryLabel(p))+'</span>'+serviceBadgeHtml(p)+'</span><span class="pill '+st.tone+'">'+st.label+'</span></div>' +
            '<div style="font-weight:700;margin-top:8px;'+(p.declined?'text-decoration:line-through;color:var(--ink-400);':'')+'">'+(revealName ? esc(p.name||'Unnamed client') : '🔒 Hidden until converted')+'</div>' +
            '<div class="histmeta">'+esc(p.location||'—')+(p.address?' · '+esc(p.address):'')+'</div>' +
            (priceStr || p.timeline ? '<div class="histmeta">'+priceStr+(priceStr && p.timeline?' · ':'')+(p.timeline?esc(p.timeline):'')+'</div>' : '') +
            (!p.declined && p.plannedAuditDate ? '<div class="histmeta">Audit day: '+fmtDateShort(new Date(p.plannedAuditDate+'T00:00:00').getTime())+plannedTimeSuffix(p)+'</div>' : '') +
            (p.declined && p.followUpDate ? '<div class="histmeta">Follow up: '+fmtDateShort(new Date(p.followUpDate+'T00:00:00').getTime())+'</div>' : '') +
          '</div>';
        }).join('')
      )
      ))
      )) +
    '</main>';
  }

  function computeClientNextAction(p, audits){
    var todayStr = todayISO();
    var nowMs = Date.now();
    var openIssues = openActionsForStore(p.name);
    if (p.declined) return { tone:'bad', icon:'✗', text:'Marked as not converted'+(p.followUpDate?' — follow up '+fmtDateShort(new Date(p.followUpDate+'T00:00:00').getTime()):'') };
    if (audits.length){
      var key = (p.name||'').trim().toLowerCase();
      var due = computeDueList().filter(function(x){ return x.key===key; })[0];
      if (due){
        if (due.dueAt < nowMs) return { tone:'bad', icon:'⏰', text:'Re-audit overdue since '+fmtDateShort(due.dueAt) };
        var diso = new Date(due.dueAt); var dstr = diso.getFullYear()+'-'+String(diso.getMonth()+1).padStart(2,'0')+'-'+String(diso.getDate()).padStart(2,'0');
        if (dstr===todayStr) return { tone:'warn', icon:'🗓️', text:'Re-audit due today' };
      }
      if (p.proposalStatus==='meeting_scheduled' && p.proposalMeetingDate && p.proposalMeetingDate<=todayStr && !p.converted){
        var mOverdue = p.proposalMeetingDate < todayStr;
        return { tone: mOverdue?'bad':'warn', icon:'🤝', text:'Proposal meeting '+(mOverdue?'was due '+fmtDateShort(new Date(p.proposalMeetingDate+'T00:00:00').getTime()):'due today') };
      }
      if (openIssues.length) return { tone:'warn', icon:'⚠', text: openIssues.length+' unresolved issue'+(openIssues.length>1?'s':'')+' from last visit — worth a check-in' };
      if (due && due.daysUntil<=7) return { tone:'accent', icon:'🗓️', text:'Re-audit due in '+Math.max(due.daysUntil,0)+' day'+(due.daysUntil===1?'':'s') };
      if (!p.converted && !p.proposalStatus) return { tone:'accent', icon:'📝', text:'Audit done — log a proposal to move this forward' };
      return { tone:'good', icon:'✓', text:'All caught up' };
    }
    if (p.plannedAuditDate && p.plannedAuditDate<=todayStr){
      return { tone: p.plannedAuditDate<todayStr?'bad':'warn', icon:'⭐', text:'Scheduled audit '+(p.plannedAuditDate<todayStr?'was due '+fmtDateShort(new Date(p.plannedAuditDate+'T00:00:00').getTime()):'due today'+plannedTimeSuffix(p))+', needs check-in' };
    }
    return { tone:'accent', icon:'▶', text:'No audit yet — start one to kick things off' };
  }

  function renderClientHealthCard(p, audits){
    var openIssues = openActionsForStore(p.name);
    var last = audits[0];
    var totalRevenue = audits.reduce(function(n,h){ return n+(h.pricing?h.pricing.total:0); },0);
    var na = '<span style="color:var(--ink-400);">—</span>';
    var next = computeClientNextAction(p, audits);
    var toneColor = { bad:'var(--bad)', warn:'var(--accent)', good:'var(--good)', accent:'var(--accent)' };
    return '<div class="card" style="padding:14px 16px;margin-bottom:10px;">' +
      '<div class="statgrid" style="margin:0;">' +
        '<div class="stattile"><div class="v">'+(last?fmtDateShort(last.finishedAt):na)+'</div><div class="k">Last Audit</div></div>' +
        '<div class="stattile t-accent"><div class="v">'+(last?last.completionPct+'%':na)+'</div><div class="k">Latest Score</div></div>' +
        '<div class="stattile'+(openIssues.length?' t-bad':'')+'"><div class="v">'+(audits.length?openIssues.length:na)+'</div><div class="k">Open Issues</div></div>' +
        '<div class="stattile t-good"><div class="v">'+esc(state.pricing.currency)+totalRevenue+'</div><div class="k">Total Revenue</div></div>' +
      '</div>' +
    '</div>' +
    '<div style="display:flex; align-items:flex-start; gap:8px; padding:10px 12px; margin-bottom:16px; border-radius:var(--r-m); border-left:3px solid '+toneColor[next.tone]+'; background:var(--surface-2);">' +
      '<span>'+next.icon+'</span><span style="flex:1; font-size:13.5px; font-weight:600; line-height:1.4;">'+esc(next.text)+'</span>' +
    '</div>';
  }

  function buildClientTimeline(p, audits){
    var key = (p.name||'').trim().toLowerCase();
    var events = [];
    audits.forEach(function(h){ events.push({ t: h.finishedAt, type:'audit', data:h }); });
    state.correctiveActions.filter(function(a){ return (a.storeName||'').trim().toLowerCase()===key; }).forEach(function(a){
      if (a.createdAt) events.push({ t:a.createdAt, type:'action-created', data:a });
      if (a.done && a.resolvedAt) events.push({ t:a.resolvedAt, type:'action-resolved', data:a });
    });
    (p.actionLog||[]).forEach(function(s, i){ events.push({ t:s.doneAt, type:'loop-step', data:s, n:i+1 }); });
    (p.followUps||[]).filter(function(f){ return f.done && f.doneAt; }).forEach(function(f){ events.push({ t:f.doneAt, type:'followup', data:f }); });
    if (p.convertedAt) events.push({ t:p.convertedAt, type:'converted', data:p });
    if (p.declinedAt) events.push({ t:p.declinedAt, type:'declined', data:p });
    if (p.createdAt) events.push({ t:p.createdAt, type:'added', data:p });
    events.sort(function(a,b){ return b.t-a.t; });
    return events;
  }

  function renderClientTimeline(p, audits){
    var events = buildClientTimeline(p, audits);
    if (!events.length) return '';
    return '<div style="margin-bottom:20px;">' +
      events.map(function(e){
        var d = e.data;
        if (e.type==='audit'){
          return '<div class="card histcard" data-action="view-audit" data-id="'+d.id+'">' +
            '<div class="histtop"><span class="badge">'+esc((state.templates[d.type]||{}).label||d.type)+' audit</span><span class="histpct">'+d.completionPct+'%</span></div>' +
            '<div class="histmeta" style="margin-top:8px;">'+fmtDateShort(e.t)+' · Tap to view full report</div>' +
          '</div>';
        }
        if (e.type==='followup'){

  function computeProgressSummary(p, audits){
    if (audits.length < 2) return null;
    var latest = audits[0], first = audits[audits.length-1];
    var firstMap = {};
    first.sections.forEach(function(s){ (s.items||[]).forEach(function(it){ firstMap[it.id] = it.state; }); });
    var improved = [], regressed = [], persistent = [];
    latest.sections.forEach(function(s){
      (s.items||[]).forEach(function(it){
        var prevState = firstMap[it.id];
        if (prevState===undefined) return;
        if (prevState==='unchecked' && it.state==='checked') improved.push({ text:it.text, section:s.name });
        else if (prevState==='checked' && it.state==='unchecked') regressed.push({ text:it.text, section:s.name });
        else if (prevState==='unchecked' && it.state==='unchecked') persistent.push({ text:it.text, section:s.name });
      });
    });
    var key = (p.name||'').trim().toLowerCase();
    var allActions = state.correctiveActions.filter(function(a){ return (a.storeName||'').trim().toLowerCase()===key; });
    var resolvedActions = allActions.filter(function(a){ return a.done; });
    return {
      first: first, latest: latest,
      scoreDelta: latest.completionPct - first.completionPct,
      improved: improved, regressed: regressed, persistent: persistent,
      auditsCount: audits.length,
      daysSinceFirst: Math.max(0, Math.round((Date.now()-first.finishedAt)/86400000)),
      actionsRaised: allActions.length, actionsResolved: resolvedActions.length, actionsOpen: openActionsForStore(p.name).length
    };
  }

  function renderProgressSummary(p, audits){
    var sum = computeProgressSummary(p, audits);

    var tone = sum.scoreDelta>0 ? 'good' : (sum.scoreDelta<0 ? 'bad' : 'warn');
    var arrow = sum.scoreDelta>0 ? '▲' : (sum.scoreDelta<0 ? '▼' : '—');
    function chipGroup(arr, chipTone, emptyText){
      if (!arr.length) return '<div class="helper" style="margin:2px 0 0;">'+emptyText+'</div>';
      return '<div class="progchips">' + arr.map(function(it){
        return '<span class="progchip '+chipTone+'" title="'+esc(it.section)+' — '+esc(it.text)+'"><span class="s">'+esc(it.section)+':</span>'+esc(it.text)+'</span>';
      }).join('') + '</div>';
    }
    return sh('📊','Progress Summary') +
      '<div class="card" style="padding:14px 16px;margin-bottom:16px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">' +
          '<span style="font-size:13px;color:var(--ink-600);">Since first audit ('+fmtDateShort(sum.first.finishedAt)+')</span>' +
          '<span class="pill '+tone+'">'+arrow+' '+(sum.scoreDelta>0?'+':'')+sum.scoreDelta+' pts — '+sum.first.completionPct+'% → '+sum.latest.completionPct+'%</span>' +
        '</div>' +

  function findContent(id){ return state.contentIdeas.filter(function(c){ return c.id===id; })[0]; }

  function contentStatus(c){
    if (c.posted) return { label:'✓ POSTED', tone:'good' };
    if (c.shootDate) return { label:'Shoot '+fmtDateShort(new Date(c.shootDate+'T00:00:00').getTime()), tone: (c.shootDate<todayISO()?'bad':'warn') };
    if (c.notScheduled) return { label:'Not scheduled', tone:'warn' };
    return { label:'Draft', tone:'warn' };
  }

  var CONTENT_HEADS = [
    { key:'__gov', label:'System', icon:'⚙️' },
    { key:'__sop', label:'SOP', icon:'📘' }
  ];
  function contentHeadFor(area){ return CONTENT_HEADS.filter(function(h){ return h.key===area; })[0]; }
  var SEGMENT_LABELS = { dinein:'Dine-In', qsr:'QSR', both:'Dine-In + QSR' };
  function contentAreaOptions(segment){
    var keys = segment==='qsr' ? ['qsr'] : (segment==='dinein' ? ['dinein'] : ['dinein','qsr']);
    var seen = {}, out = [];
    keys.forEach(function(k){
      state.templates[k].sections.forEach(function(s){
        var n = (s.name||'').trim(), lk = n.toLowerCase();
        if (n && !seen[lk]){ seen[lk] = true; out.push(n); }
      });
    });
    return out;
  }
  function contentMatchesSegment(c, seg){ return c.segment===seg || c.segment==='both'; }
  function contentAreaLabel(c){
    var head = contentHeadFor(c.area);
    return head ? head.label : (c.area || '');
  }
  function contentTagHtml(c){
    if (!c.segment) return '<span class="pill warn">Untagged</span>';
    return '<span class="pill good">'+esc(SEGMENT_LABELS[c.segment])+'</span>' + (c.area ? ' <span class="pill warn">'+esc(contentAreaLabel(c))+'</span>' : ' <span class="pill bad">No area</span>');
  }
  function renderContentCoverage(){
    var seg = state.contentCoverageTab==='qsr' ? 'qsr' : 'dinein';
    var items = state.contentIdeas.filter(function(c){ return contentMatchesSegment(c, seg); });
    function stat(match){
      var m = items.filter(match);
      var made = m.filter(function(c){ return c.posted; }).length;
      return { made:made, planned:m.length-made, total:m.length };
    }
    var heads = CONTENT_HEADS.map(function(h){
      var s = stat(function(c){ return c.area===h.key; });
      s.name = h.label; s.icon = h.icon; return s;
    });
    var depts = contentAreaOptions(seg).map(function(n){
      var s = stat(function(c){ return (c.area||'').toLowerCase()===n.toLowerCase(); });
      s.name = n; return s;
    });
    var max = depts.concat(heads).reduce(function(m, s){ return Math.max(m, s.total); }, 1);
    function row(icon, name, s, strong){
      return '<div style="padding:10px 0;border-top:1px solid var(--line);">' +
        '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;">' +
          '<span style="font-weight:'+(strong?800:700)+';min-width:0;">'+icon+' '+esc(name)+'</span>' +
          (s.total ? '<span class="pill good" style="white-space:nowrap;flex:none;">'+s.total+'</span>' : '<span class="pill bad" style="white-space:nowrap;flex:none;">None yet</span>') +
        '</div>' +
        (s.total ? '<div class="histmeta" style="margin-top:2px;">'+s.made+' posted · '+s.planned+' planned</div>' : '') +
        '<div class="progtrack" style="margin-top:6px;"><div class="progfill" style="width:'+Math.round(s.total/max*100)+'%"></div></div>' +
      '</div>';
    }
    var covered = depts.filter(function(s){ return s.total>0; });
    var empty = depts.filter(function(s){ return s.total===0; });
    var top = depts.slice().sort(function(a,b){ return b.total-a.total; })[0];
    var untagged = state.contentIdeas.filter(function(c){ return !c.segment || !c.area; }).length;
    var summary = 'Departments covered: '+covered.length+' of '+depts.length+'.' +
      (top && top.total ? ' Most content: '+top.name+' ('+top.total+').' : '') +
      (empty.length ? ' Nothing yet on: '+empty.map(function(s){ return s.name; }).join(', ')+'.' : ' Every department has content.');
    return sh('🧭','Content coverage') +
      '<div class="tabs">' +
        ['dinein','qsr'].map(function(k){ return '<button class="tab '+(seg===k?'on':'')+'" data-action="content-coverage-tab" data-tab="'+k+'">'+SEGMENT_LABELS[k]+'</button>'; }).join('') +
      '</div>' +
      '<div class="card" style="padding:4px 16px 8px;margin-bottom:12px;border:1.5px solid var(--accent);background:var(--accent-soft);">' +
        '<div class="histmeta" style="padding:10px 0 2px;">Across all departments</div>' +
        heads.map(function(h){ return row(h.icon, h.name, h, true); }).join('') +
      '</div>' +
      '<div class="card" style="padding:4px 16px 8px;margin-bottom:12px;">' +
        '<div class="histmeta" style="padding:10px 0 2px;">'+SEGMENT_LABELS[seg]+' departments</div>' +
        depts.map(function(s){ return row('🍴', s.name, s, false); }).join('') +
      '</div>' +
      '<div class="helper" style="margin:0 0 '+(untagged?'6':'20')+'px;">'+esc(summary)+'</div>' +
      (untagged ? '<div class="helper" style="margin:0 0 20px;color:var(--accent-ink);">'+untagged+' idea'+(untagged===1?' has':'s have')+' no segment or area yet, so they aren\'t counted above.</div>' : '');
  }

  function renderContent(){
    if (state.activeContentId) return renderContentDetail();
    var list = state.contentIdeas.slice().sort(function(a,b){
      if (a.shootDate && b.shootDate) return a.shootDate<b.shootDate?-1:1;
      if (a.shootDate) return -1;
      if (b.shootDate) return 1;
      return (b.createdAt||0)-(a.createdAt||0);
    });
    return '<main>' +
      '<div style="display:flex; justify-content:space-between; align-items:flex-end; gap:10px; flex-wrap:wrap;">' +
        '<div><div class="eyebrow">Content Planner</div><h1 style="font-size:26px;margin-top:6px;">Insta Content &amp; Scripts</h1></div>' +
        '<button class="btn btn-primary btn-sm" data-action="add-content">+ New Idea</button>' +
      '</div>' +
      '<div class="helper" style="margin:8px 0 14px;">Idea → Insight → Hook → Context → CTA → Poll, against a shoot day, through to Posted.</div>' +
      renderContentCoverage() +
      (list.length===0 ? '<div class="empty"><div class="big">🎬</div>No content ideas yet.<br>Add one to start planning your next shoot.</div>' :
        list.map(function(c){
          var st = contentStatus(c);
          return '<div class="card histcard" data-action="open-content" data-id="'+c.id+'">' +
            '<div class="histtop"><span class="badge">'+((c.context2||c.script||'').trim()?'Scripted':'No script yet')+'</span><span class="pill '+st.tone+'">'+esc(st.label)+'</span></div>' +
            '<div style="font-weight:700;margin-top:8px;">'+esc(c.topic||'Untitled idea')+'</div>' +
            '<div style="margin-top:6px;">'+contentTagHtml(c)+'</div>' +
            (c.hook ? '<div class="histmeta">Hook: '+esc(c.hook)+'</div>' : '') +
          '</div>';
        }).join('')
      ) +
    '</main>';
  }

  function renderContentDetail(){
    var c = findContent(state.activeContentId);
    if (!c){ state.activeContentId = null; return renderContent(); }
    var st2 = contentStatus(c);
    return '<main>' +
      '<button class="backrow" data-action="back-to-content">← Back to content</button>' +
      '<div class="eyebrow">Content Idea</div>' +
      '<h1 style="font-size:24px;margin-top:6px;margin-bottom:8px;">'+esc(c.topic||'Untitled idea')+'</h1>' +
      (st2.label ? '<div style="margin-bottom:14px;"><span class="pill '+st2.tone+'">'+esc(st2.label)+'</span></div>' : '') +
      sh('🧭','Where this content belongs') +
      '<div class="formstack">' +
        '<div class="field"><label>Segment</label><div style="display:flex; gap:8px; flex-wrap:wrap;">' +
          ['dinein','qsr','both'].map(function(k){ return '<button type="button" class="naBtn '+(c.segment===k?'on':'')+'" data-action="set-content-segment" data-val="'+k+'">'+SEGMENT_LABELS[k]+'</button>'; }).join('') +
        '</div></div>' +
        (c.segment
          ? '<div class="field"><label for="cArea">Area / department</label><select id="cArea" data-action="set-content-area"><option value="">— Select —</option>' +
              CONTENT_HEADS.map(function(h){ return '<option value="'+h.key+'" '+(c.area===h.key?'selected':'')+'>'+h.icon+' '+h.label+' (across all departments)</option>'; }).join('') +
              contentAreaOptions(c.segment).map(function(n){ return '<option value="'+esc(n)+'" '+((c.area||'').toLowerCase()===n.toLowerCase()?'selected':'')+'>'+esc(n)+'</option>'; }).join('') +
            '</select></div>'
          : '<div class="helper" style="margin-top:-6px;">Pick a segment to choose the area this content covers.</div>') +
      '</div>' +
      '<div class="formstack">' +
        '<div class="field"><label for="cTopic">Idea / topic</label><input id="cTopic" data-bind-content="topic" value="'+esc(c.topic)+'" placeholder="e.g. 5 signs your kitchen would fail an audit"></div>' +
        '<div class="field"><label for="cInsight">Insight</label><textarea id="cInsight" data-bind-content="insight" placeholder="The key point / value viewers walk away with">'+esc(c.insight)+'</textarea></div>' +
        '<div class="field"><label for="cHook">Hook</label><input id="cHook" data-bind-content="hook" value="'+esc(c.hook)+'" placeholder="The first line / on-screen text that stops the scroll"></div>' +
        '<div class="field"><label for="cContext1">Context 1 — the problem</label><textarea id="cContext1" data-bind-content="context1" placeholder="The problem / pain point that makes viewers pay attention">'+esc(c.context1||'')+'</textarea></div>' +

  function renderSearchResultsHtml(){

    var lookupsRes = state.lookups.filter(function(l){ return (l.text||'').toLowerCase().indexOf(q)>=0; }).slice(0,20);

      html += sh('🧭','Clients ('+prospects.length+')') +

          return '<div class="card histcard" data-action="goto-prospect" data-id="'+p.id+'"><div style="font-weight:700;">'+esc(p.name||'Unnamed client')+'</div><div class="histmeta">'+esc(p.location||'—')+'</div></div>';
        }).join('');
    }

      html += sh('📋','Audit History ('+audits.length+')') +
        audits.map(function(h){
          return '<div class="card histcard" data-action="view-audit" data-id="'+h.id+'"><div style="font-weight:700;">'+esc(h.storeName||'Unnamed store')+'</div><div class="histmeta">'+fmtAuditWhen(h.auditDate,h.auditTime)+' · '+h.completionPct+'%</div></div>';

  function computeAlerts(){
    var todayStr = todayISO();
    var nowMs = Date.now();
    var due = computeDueList();
    var alerts = [];
    due.forEach(function(x){
      if (x.dueAt < nowMs){
        alerts.push({ tone:'bad', icon:'⏰', text: (x.storeName||'Unnamed store')+' — re-audit overdue', action:'go-actions', tab:'schedule' });
      } else {
        var dd = new Date(x.dueAt); var diso = dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');
        if (diso===todayStr) alerts.push({ tone:'warn', icon:'🗓️', text: (x.storeName||'Unnamed store')+' — re-audit due today', action:'go-actions', tab:'schedule' });
      }
    });
    state.prospects.forEach(function(p){
      if (isLiveClient(p)){
        var stuckDays = loopDaysOnStep(p);
        var stuckLimit = loopStuckDays(p);
        if (stuckDays >= stuckLimit){
          alerts.push({ tone: stuckDays>=stuckLimit*2?'bad':'warn', icon:'⏳', text: (p.name||'Unnamed client')+' — '+stuckDays+' days on "'+LOOP_STEPS[loopTypeOf(p)].label+'", needs a nudge', action:'goto-prospect', id:p.id });
        }
      }
      if (p.plannedAuditDate && p.plannedAuditDate<=todayStr && !p.auditId && !p.declined){
        var overdue = p.plannedAuditDate < todayStr;
        alerts.push({ tone: overdue?'bad':'warn', icon:'⭐', text: (p.name||'Unnamed client')+' — scheduled audit '+(overdue?'was due '+fmtDateShort(new Date(p.plannedAuditDate+'T00:00:00').getTime()):'due today'+plannedTimeSuffix(p))+', needs check-in', action:'goto-prospect', id:p.id });
      }
      if (p.proposalStatus==='meeting_scheduled' && p.proposalMeetingDate && p.proposalMeetingDate<=todayStr && !p.converted && !p.declined){
        var mOverdue = p.proposalMeetingDate < todayStr;
        alerts.push({ tone: mOverdue?'bad':'warn', icon:'🤝', text: (p.name||'Unnamed client')+' — proposal meeting '+(mOverdue?'was due '+fmtDateShort(new Date(p.proposalMeetingDate+'T00:00:00').getTime()):'due today')+', follow up', action:'goto-prospect', id:p.id });
      }
    });
    state.contentIdeas.forEach(function(c){
      if (c.shootDate===todayStr){
        alerts.push({ tone:'good', icon:'🎬', text: (c.topic||'Untitled idea')+' — shoot scheduled today', action:'goto-content', id:c.id });
      }
    });
    return alerts;
  }

  function renderAlertsBanner(){
    var alerts = computeAlerts();
    if (!alerts.length) return '';
    var toneColor = { bad:'var(--bad)', warn:'var(--accent)', good:'var(--good)' };
    return '<div class="card" style="border:1.5px solid var(--bad); background:var(--bad-soft); margin-bottom:18px; padding:12px 14px;">' +
      '<div style="font-weight:700; margin-bottom:6px;">🔔 '+alerts.length+' alert'+(alerts.length>1?'s':'')+' today</div>' +
      alerts.map(function(a){
        return '<div data-action="'+a.action+'"'+(a.id?' data-id="'+a.id+'"':'')+(a.tab?' data-tab="'+a.tab+'"':'')+' style="display:flex; align-items:flex-start; gap:8px; padding:6px 0; cursor:pointer; border-left:3px solid '+toneColor[a.tone]+'; padding-left:8px; margin-top:4px;">' +
          '<span>'+a.icon+'</span><span style="flex:1; font-size:13.5px; line-height:1.4;">'+esc(a.text)+'</span>' +
        '</div>';

  function targetProgressRow(label, actual, target, prefix){
    if (!target) return '';
    var pct = Math.min(100, Math.round(actual/target*100));
    var met = actual>=target;
    return '<div style="margin-bottom:10px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:4px;">' +
        '<span style="font-weight:600;">'+label+'</span>' +
        '<span class="mono" style="font-weight:700;">'+prefix+actual+' / '+prefix+target+' <span style="color:'+(met?'var(--good)':'var(--ink-600)')+';">('+pct+'%)</span></span>' +
      '</div>' +
      '<div class="progtrack"><div class="progfill" style="width:'+pct+'%; background:'+(met?'var(--good)':'var(--accent)')+';"></div></div>' +
    '</div>';
  }
