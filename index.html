  // ---- Client process: the whole journey from lead to paid, with the next step highlighted ----
  function processSteps(p, audits){
    var hasInv = (p.invoices||[]).length>0, hasPaid = (p.invoices||[]).some(function(i){ return i.paid; });
    var steps = [
      { k:'details',  label:'Client details complete',    done: prospectProblems(p).length===0, go:{ sel:'#pName' }, btn:'Fill in details' },
      { k:'audit',    label:'First audit done',           done: audits.length>0, act:'start-audit-from-prospect', btn:'Start the audit' },
      { k:'package',  label:'Package chosen',             done: !!p.servicesOffered, go:{ sel:'#pServices' }, btn:'Choose package' },
      { k:'quote',    label:'Quote worked out',           done: !!(p.pricingType && (clientPriceOf(p) || quoteFor(p))), go:{ sel:'#pPricingType' }, btn:'Set the quote' },
      { k:'proposal', label:'Proposal logged',            done: p.proposalStatus==='proposed' || !!(p.proposed||'').trim(), go:{ sel:'#pProposalStatus' }, btn:'Log the proposal' },
      { k:'followup', label:'Next follow-up scheduled',   done: openFollowUps(p).length>0 || !!p.proposalMeetingDate, go:{ jump:'Follow-ups' }, btn:'Add a follow-up' },
      { k:'convert',  label:'Client converted',           done: !!p.converted, act:'quick-convert', btn:'Mark converted' },
      { k:'invoice',  label:'First invoice raised',       done: hasInv, act:'quick-invoice', btn:'Create invoice', needs: !!p.converted },
      { k:'paid',     label:'Payment received',           done: hasPaid, go:{ jump:'Billing' }, btn:'Record payment', needs: hasInv },
      { k:'tracking', label:'Metrics set up to track',    done: (p.parameters||[]).length>0, go:{ jump:'Analysis parameters' }, btn:'Add a metric', needs: !!p.converted }
    ];
    return steps;
  }
  function renderProcessCard(p, audits){
    if (p.declined) return '';
    var steps = processSteps(p, audits), done = steps.filter(function(s){ return s.done; }).length;
    var next = steps.filter(function(s){ return !s.done && s.needs!==false && (s.needs===undefined || s.needs); })[0];
    var open = !!state.procOpen;
    var pct = Math.round(done/steps.length*100);
    var nextBtn = !next ? '' : (next.act ? '<button type="button" class="btn btn-primary btn-sm" data-action="'+next.act+'" data-id="'+p.id+'">'+next.btn+'</button>'
      : '<button type="button" class="btn btn-primary btn-sm" data-action="process-go" '+(next.go.sel ? 'data-sel="'+next.go.sel+'"' : 'data-jump="'+esc(next.go.jump)+'"')+'>'+next.btn+'</button>');
    return '<div class="card processcard">' +
      '<div class="checkrow" style="padding:0;margin:0 0 10px;"><div class="cr-main"><div class="cr-title">🧭 Client process · '+done+' of '+steps.length+'</div>' +
        (next ? '<div class="cr-sub">Next: '+esc(next.label.replace(/^(Client converted)$/,'Convert the client'))+'</div>' : '<div class="cr-sub">Everything is in place 🎉</div>')+'</div>'+nextBtn+'</div>' +
      '<div class="progtrack"><div class="progfill" style="width:'+pct+'%"></div></div>' +
      '<button type="button" class="btn btn-text btn-sm" style="margin-top:6px;padding-left:0;" data-action="toggle-process">'+(open?'Hide steps ▴':'Show all steps ▾')+'</button>' +
      (open ? '<div style="margin-top:4px;">'+steps.map(function(s){
        var isNext = next && next.k===s.k;
        return '<div class="procstep'+(s.done?' done':'')+(isNext?' next':'')+'"><span class="procdot">'+(s.done?'✓':'')+'</span><span>'+esc(s.label)+'</span></div>';

  // ---- Client progress report: audit scores, metric movement and issues resolved, for retainer reviews ----
  function clientReportData(p){
    var key = (p.name||'').trim().toLowerCase();
    var audits = prospectAudits(p).slice().sort(function(a,b){ return (a.finishedAt||0)-(b.finishedAt||0); });
    var params = (p.parameters||[]).map(function(prm){ return { prm:prm, st:paramStats(p, prm) }; }).filter(function(x){ return x.st.readings.length; });
    var acts = state.correctiveActions.filter(function(a){ return (a.storeName||'').trim().toLowerCase()===key; });
    var svc = p.servicesOffered ? findService(p.servicesOffered) : null;
    var first = audits[0], last = audits[audits.length-1];
    return { audits:audits, params:params, acts:acts, resolved:acts.filter(function(a){ return a.done; }).length, svc:svc,
      first:first, last:last, delta:(first && last && first!==last) ? (last.completionPct||0)-(first.completionPct||0) : null };
  }
  function hasClientReport(p){ var r = clientReportData(p); return r.audits.length>0 || r.params.length>0; }
  function reportMetricLine(x){
    var prm = x.prm, st = x.st, u = prm.unit||'';

    return { name:prm.name||'Metric', start:fmtNum(st.start)+u, now:fmtNum(st.now)+u, change:ch, target:st.target!==null ? fmtNum(st.target)+u : '—', good:st.improving };
  }

  function renderTrend(list){
    if (list.length < 2) return '';
    var last = list.slice(-12);
    var w = 560, chartH = 90, pad = 8;
    var vals = last.map(function(h){ return h.totalMs; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (min===max){ min = 0; }
    var pts = last.map(function(h, i){
      var x = pad + (i/(last.length-1)) * (w-2*pad);
      var y = chartH - pad - ((h.totalMs-min)/(max-min||1)) * (chartH-2*pad);
      return [x,y];
    });
    var path = pts.map(function(p,i){ return (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ');
    var lastPt = pts[pts.length-1];
    return '<div class="trendwrap">'+sh('📈','Total duration trend') +
      '<div class="card" style="padding:12px 14px;">' +
      '<svg viewBox="0 0 '+w+' '+chartH+'" width="100%" height="'+chartH+'" preserveAspectRatio="none" role="img" aria-label="Audit duration trend">' +
        '<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2"/>' +
        '<circle cx="'+lastPt[0].toFixed(1)+'" cy="'+lastPt[1].toFixed(1)+'" r="3.5" fill="var(--accent)"/>' +
      '</svg>' +
      '<div class="trendcap"><span>'+fmtDateShort(last[0].finishedAt)+' · '+fmtTime(min===0&&max===0?0:Math.min.apply(null,vals))+'</span><span>longest '+fmtTime(max)+'</span><span>'+fmtDateShort(last[last.length-1].finishedAt)+'</span></div>' +
      '</div></div>';
  }

  var DOC_LIMIT_BYTES = 1048576;
  function jsonBytes(v){
    try{ var s = JSON.stringify(v); return window.TextEncoder ? new TextEncoder().encode(s).length : s.length; }catch(e){ return 0; }
  }
  function fmtKB(b){ return b>=1048576 ? (b/1048576).toFixed(2)+' MB' : Math.max(1, Math.round(b/1024))+' KB'; }
  function storageTone(pct){ return pct>=90 ? 'bad' : (pct>=70 ? 'warn' : 'good'); }
  function storageReport(withRecords){
    var cfgBytes = jsonBytes({ templates:state.templates, pricing:state.pricing, schedule:state.schedule, services:state.services, deliverables:state.deliverables, paramLibrary:state.paramLibrary, targets:state.targets, reauditOverrides:state.reauditOverrides });
    var rep = { rows:[ { label:'Settings & checklists', bytes:cfgBytes, n:0, unit:'', pct:cfgBytes/DOC_LIMIT_BYTES*100 } ] };
    if (withRecords){
      rep.sets = [
        { label:'Audits', list:state.history, unit:'audit' },
        { label:'Clients', list:state.prospects, unit:'client' },
        { label:'Corrective actions', list:state.correctiveActions, unit:'action' },
        { label:'Content ideas', list:state.contentIdeas, unit:'idea' },
        { label:'Lookups & tasks', list:state.lookups, unit:'item' },
        { label:'Parameter readings', list:state.readings, unit:'reading' },
        { label:'Check-in days', list:state.workdays, unit:'day' }
      ].map(function(s){
        var total = 0, biggest = 0;
        s.list.forEach(function(r){ var b = jsonBytes(r); total += b; if (b>biggest) biggest = b; });
        return { label:s.label, n:s.list.length, unit:s.unit, bytes:total, biggest:biggest };
      });
    }
    return rep;
  }
  function lastBackupAt(){ return Number(loadJSON(LS_LB, 0)) || 0; }
  var storageCache = { t:0, rep:null };
  function renderStorageMeter(){
    if (!storageCache.rep || Date.now()-storageCache.t > 20000){ storageCache = { t:Date.now(), rep:storageReport(true) }; }
    var rep = storageCache.rep;
    var barColor = { good:'var(--good)', warn:'var(--accent)', bad:'var(--bad)' };
    function setRow(s, first){
      return '<div style="padding:10px 0;'+(first?'':'border-top:1px solid var(--line);')+'">' +
        '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;"><span style="font-weight:700;">'+esc(s.label)+'</span><span class="pill good" style="white-space:nowrap;flex:none;">No limit</span></div>' +
        '<div class="histmeta" style="margin-top:2px;">'+s.n+' '+s.unit+(s.n===1?'':'s')+' · '+fmtKB(s.bytes)+' in total'+(s.n ? ' · largest '+fmtKB(s.biggest) : '')+'</div>' +
      '</div>';
    }
    var cfg = rep.rows[0], tone = storageTone(cfg.pct);
    return '<h1 style="font-size:20px;margin:0 0 4px;">Data &amp; storage</h1>' +
      '<div class="helper" style="margin-bottom:12px;">Everything is saved to your cloud database and also kept on this device. Audits, clients, actions, content ideas and tasks are each stored one record at a time, so there is no limit on how many you can keep. Only your settings and checklists share one record, which holds about 1 MB.</div>' +
      '<div class="card" style="padding:4px 16px 8px;margin-bottom:8px;">' +
        rep.sets.map(function(s, i){ return setRow(s, i===0); }).join('') +
        '<div style="padding:10px 0;border-top:1px solid var(--line);">' +
          '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;"><span style="font-weight:700;">'+esc(cfg.label)+'</span><span class="pill '+tone+'" style="white-space:nowrap;flex:none;">'+(cfg.pct<1?'<1':Math.round(cfg.pct))+'% full</span></div>' +
          '<div class="histmeta" style="margin-top:2px;">'+fmtKB(cfg.bytes)+' of 1 MB</div>' +
          '<div class="progtrack" style="margin-top:6px;"><div class="progfill" style="width:'+Math.min(100, Math.max(2, Math.round(cfg.pct)))+'%;background:'+barColor[tone]+';"></div></div>' +
        '</div>' +
      '</div>' +
      '<div class="helper" style="margin-bottom:28px;">Sizes are approximate. The settings record turns amber above 70% and red above 90%.</div>';
  }

        '<div class="helper" style="margin-top:4px;">'+((s.auditAreas||[]).length ? 'Linked to your checklist: a New Audit for this package pre-selects just these areas ('+serviceChecklistCounts(s)+').' : 'None picked — a New Audit for this package covers every checklist area.')+'</div></div>' +
        '<div class="field"><label>Metrics to follow</label>' +
          (state.paramLibrary.length ? msel('svc-metrics-'+s.id, 'None picked', state.paramLibrary.map(function(l){ return { label:l.name, on:(s.metrics||[]).indexOf(l.id)>=0, attrs:'data-action="service-metric-toggle" data-svc="'+s.id+'" data-lib="'+esc(l.id)+'"' }; })) : '<span class="helper">Add parameters in Settings → Parameter library first.</span>') +
        '<div class="helper" style="margin-top:4px;">Added to the client\'s Analysis parameters when you assign this package.</div></div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +

        '</div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
          fieldNum('Retainer min (₹/mo)', 'retainerMin', s) + fieldNum('Retainer max (₹/mo)', 'retainerMax', s) + fieldNum('Min months', 'retainerMinMonths', s) +
        '</div>' +
        '<div class="field"><label>Steps / actions — what you do for this package</label>' +
          (s.steps||[]).map(function(st, i){
            return '<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:6px;"><span style="flex:none;font-weight:800;color:var(--accent-ink);padding-top:6px;min-width:20px;">'+(i+1)+'.</span>' +
              '<textarea rows="1" class="edtext" data-svc-step="'+i+'" data-svc="'+s.id+'" placeholder="e.g. Walk the kitchen and photograph issues">'+esc(st)+'</textarea>' +
              '<button class="iconbtn" data-action="service-step-remove" data-svc="'+s.id+'" data-idx="'+i+'" title="Remove step" aria-label="Remove step">✕</button></div>';
          }).join('') +
          '<button type="button" class="btn btn-ghost btn-sm" data-action="service-step-add" data-svc="'+s.id+'">+ Add step</button></div>' +
        '<div class="field" style="margin-bottom:0;"><label>Notes — QSR scaling, per-outlet fees, GST, anything price-shaped that doesn\'t fit the boxes above</label><textarea class="autogrow" data-svc-field="priceNote" data-svc="'+s.id+'" placeholder="e.g. Scale down ~20% for QSR. Excludes 18% GST.">'+esc(s.priceNote||'')+'</textarea></div>' +
        '<button type="button" class="btn btn-primary btn-sm" style="margin-top:14px;" data-action="toggle-service-open" data-svc="'+s.id+'">Done</button>' +
      '</div>';
    }
    return '<main>' +
      '<div class="eyebrow">Settings</div>' +
      '<h1 style="font-size:26px;margin-top:6px;margin-bottom:6px;">Services &amp; pricing catalog</h1>' +
      '<div class="helper" style="margin-bottom:14px;">The packages you sell. Tap one to edit its price, visit cadence, tracking method, the audit areas it covers and the metrics it follows. Pick a package in New Audit or on a client\'s page — the audit areas, metrics and follow-up visits then set themselves up.</div>' +
      '<button class="btn btn-primary btn-sm" style="margin-bottom:16px;" data-action="service-add">+ Add package</button>' +
      catOrder.map(function(cat){
        return '<h2 style="font-size:14px;color:var(--ink-400);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px;">'+esc(cat)+'</h2>' + groups[cat].map(card).join('');
      }).join('') +
      '<button class="btn btn-text btn-danger" style="margin-top:6px;" data-action="service-reset">Reset catalog to defaults</button>' +
    '</main>';
  }

  function renderActionsView(){
    var tab = state.actionsTab;
    return '<main>' +
      '<div class="eyebrow">Actions</div>' +
      '<h1 style="font-size:26px;margin-top:6px;margin-bottom:14px;">Follow-ups &amp; schedule</h1>' +
      '<div class="tabs">' +
        '<button class="tab '+(tab==='corrective'?'on':'')+'" data-action="actions-tab" data-tab="corrective">Corrective Actions</button>' +
        '<button class="tab '+(tab==='schedule'?'on':'')+'" data-action="actions-tab" data-tab="schedule">Re-audit Due</button>' +
        '<button class="tab '+(tab==='task'?'on':'')+'" data-action="actions-tab" data-tab="task">Tasks</button>' +
        '<button class="tab '+(tab==='lookup'?'on':'')+'" data-action="actions-tab" data-tab="lookup">Lookups</button>' +
      '</div>' +
      (tab==='schedule' ? renderDueList() : (tab==='task' || tab==='lookup') ? lookupInner(tab) : renderCorrectiveList()) +
    '</main>';
  }

  function renderCorrectiveList(){
    var showDone = !!state.actionsShowDone;
    var all = state.correctiveActions.slice().sort(function(a,b){
      var ad = a.dueDate ? new Date(a.dueDate+'T00:00:00').getTime() : Infinity;
      var bd = b.dueDate ? new Date(b.dueDate+'T00:00:00').getTime() : Infinity;
      return ad-bd;
    });
    var open = all.filter(function(a){ return !a.done; });
    var done = all.filter(function(a){ return a.done; });
    var todayStr = todayISO();
    var overdueCount = open.filter(function(a){ return a.dueDate && a.dueDate < todayStr; }).length;

    function row(a, isDone){
      var overdue = !isDone && a.dueDate && a.dueDate < todayStr;
      return '<div class="card cacard2">' +
        '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">' +
          '<textarea rows="1" class="lookuptext" data-ca-edit-field="description" data-ca-edit-id="'+a.id+'" placeholder="What needs fixing?" style="font-weight:700;">'+esc(a.description||'')+'</textarea>' +
          '<button class="btn btn-ghost btn-sm" style="flex:none;" data-action="'+(isDone?'reopen-action':'resolve-action')+'" data-id="'+a.id+'">'+(isDone?'Reopen':'Mark done')+'</button>' +
        '</div>' +
        '<div class="histmeta">'+esc(a.storeName||'Unnamed store')+(a.storeLocation?' · '+esc(a.storeLocation):'')+'</div>' +
        '<div style="display:flex; align-items:center; gap:8px; margin-top:6px; flex-wrap:wrap;">' +
          '<input type="date" data-ca-edit-field="dueDate" data-ca-edit-id="'+a.id+'" value="'+esc(a.dueDate||'')+'" style="border:1px solid var(--line-strong); border-radius:var(--r-s); padding:5px 7px; font-size:12.5px; background:var(--surface); color:var(--ink);">' +
          (overdue?'<span class="pill bad">OVERDUE</span>':'') +
          (!isDone ? '<button type="button" class="btn btn-text btn-sm" style="margin-left:auto;" data-action="snooze-action" data-id="'+a.id+'">Snooze +3d</button>' : '') +
        '</div>' +
      '</div>';
    }

    return '<div class="statgrid">' +
        '<div class="stattile t-accent"><div class="v">'+open.length+'</div><div class="k">Open</div></div>' +
        '<div class="stattile'+(overdueCount?' t-bad':'')+'"><div class="v">'+overdueCount+'</div><div class="k">Overdue</div></div>' +
        '<div class="stattile t-good"><div class="v">'+done.length+'</div><div class="k">Resolved</div></div>' +
      '</div>' +
      (open.length===0 ? '<div class="empty"><div class="big">✅</div>No open corrective actions.</div>' : open.map(function(a){ return row(a,false); }).join('')) +
      (done.length ? (
        '<button class="btn btn-text" style="margin-top:10px;" data-action="toggle-show-done">'+(showDone?'Hide':'Show')+' '+done.length+' resolved</button>' +
        (showDone ? done.map(function(a){ return row(a,true); }).join('') : '')
      ) : '');
  }

  function renderScheduledAudits(){
    var todayStr = todayISO();
    var scheduled = state.prospects.filter(function(p){ return p.plannedAuditDate && !p.auditId; })
      .sort(function(a,b){ return a.plannedAuditDate<b.plannedAuditDate?-1:1; });
    if (!scheduled.length) return '';
    return sh('⭐','Scheduled Audits — High Priority','var(--accent-soft)') +
      '<div style="margin-bottom:20px;">' +
        scheduled.map(function(p){
          var overdue = p.plannedAuditDate < todayStr;
          return '<div class="card histcard" data-action="goto-prospect" data-id="'+p.id+'" style="border-color:var(--accent);">' +
            '<div class="histtop"><span class="badge">⭐ Scheduled</span><span class="pill '+(overdue?'bad':'warn')+'">'+(overdue?'Overdue':fmtDateShort(new Date(p.plannedAuditDate+'T00:00:00').getTime())+plannedTimeSuffix(p))+'</span></div>' +
            '<div style="font-weight:700;margin-top:8px;">'+esc(p.name||'Unnamed client')+'</div>' +
            '<div class="histmeta">'+esc(p.location||'—')+' · Audit planned for '+fmtDateShort(new Date(p.plannedAuditDate+'T00:00:00').getTime())+plannedTimeSuffix(p)+'</div>' +
          '</div>';
        }).join('') +
      '</div>';
  }

  // Next recurring audit for one client: set automatically from their package's visit cadence (or the checklist type's default).
  function renderNextAuditCard(p){
    var key = (p.name||'').trim().toLowerCase();
    var due = computeDueList().filter(function(x){ return x.key===key; })[0];
    if (!due) return '';
    var over = due.dueAt < Date.now();
    var tone = over ? 'bad' : (due.daysUntil<=7 ? 'warn' : 'good');
    var label = over ? 'Overdue by '+Math.abs(due.daysUntil)+'d' : (due.daysUntil===0 ? 'Due today' : 'In '+due.daysUntil+'d');
    var why = due.overridden ? 'set manually' : (due.cadenceSource==='package' ? 'every '+due.intervalDays+' days · '+due.packageName : (due.customCadence ? 'every '+due.intervalDays+' days · custom' : 'every '+due.intervalDays+' days · '+((state.templates[due.type]||{}).label||due.type)+' default'));
    return '<div class="card checkrow" style="margin-bottom:14px;border-left:3px solid var(--'+(over?'bad':'accent')+');">' +
      '<div class="cr-main"><div class="cr-title">🗓️ Next audit: '+esc(fmtDateShort(due.dueAt))+' <span class="pill '+tone+'">'+label+'</span></div><div class="cr-sub">'+esc(why)+'</div></div>' +
      '<button type="button" class="btn btn-primary btn-sm" data-action="start-reaudit" data-name="'+esc(p.name)+'" data-location="'+esc(p.location||'')+'" data-type="'+esc(due.type)+'">Start</button></div>';
  }
  function renderDueList(){
    var list = computeDueList();
    var todayMs = Date.now();
    var overdue = list.filter(function(x){ return x.dueAt<todayMs; }).length;
    var scheduledHtml = renderScheduledAudits();
    var stat = '<div class="statgrid">' +
      '<div class="stattile"><div class="v">'+list.length+'</div><div class="k">Stores Tracked</div></div>' +
      '<div class="stattile"><div class="v">'+overdue+'</div><div class="k">Overdue</div></div>' +
      '<div class="stattile"><div class="v">'+(list.length-overdue)+'</div><div class="k">On Schedule</div></div>' +
    '</div>';
    if (!list.length) return scheduledHtml + stat + '<div class="empty"><div class="big">🗓️</div>Complete an audit to start tracking re-audit schedules.</div>';
    return scheduledHtml + stat + list.map(function(x){
      var isOverdue = x.dueAt < todayMs;
      var daysAbs = Math.abs(x.daysUntil);
      var statusText = isOverdue ? ('Overdue by '+daysAbs+'d') : (x.daysUntil===0 ? 'Due today' : 'Due in '+x.daysUntil+'d');
      var tone = isOverdue ? 'bad' : (x.daysUntil<=7 ? 'warn' : 'good');
      var tmpl = state.templates[x.type] || { label: x.type };
      var dueProspect = findProspectByName(x.storeName);
      return '<div class="card histcard">' +
        '<div class="histtop"><span class="badge">'+esc(tmpl.label||x.type)+'</span><span class="pill '+tone+'">'+statusText+'</span></div>' +
        '<div style="font-weight:700;margin-top:8px;">'+esc(x.storeName||'Unnamed store')+serviceBadgeHtml(dueProspect)+'</div>' +
        '<div class="histmeta">'+(x.storeLocation?esc(x.storeLocation)+' · ':'')+'Last audited '+fmtDateShort(x.lastAuditAt)+'</div>' +
        '<div class="histmeta">Next due '+fmtDateShort(x.dueAt)+(x.overrideTime?' · '+fmtTime12(x.overrideTime):'')+(x.overridden?' (manually set)':(x.customCadence?' (every '+x.intervalDays+'d — custom cadence)':(x.cadenceSource==='package'?' (every '+x.intervalDays+'d — '+esc(x.packageName)+')':'')))+'</div>' +
        '<div class="cardstack" style="margin-top:12px;">' +
          '<div style="display:flex; gap:10px;">' +
            '<div class="field" style="flex:1;"><label>Reschedule to</label><input type="date" data-reaudit-key="'+esc(x.key)+'" data-reaudit-part="date" value="'+esc(x.overrideDate)+'"></div>' +
            '<div class="field" style="flex:1;"><label>Time</label><input type="time" data-reaudit-key="'+esc(x.key)+'" data-reaudit-part="time" value="'+esc(x.overrideTime)+'"></div>' +
          '</div>' +
          '<div style="display:flex; gap:8px;">' +
            (x.overridden ? '<button type="button" class="btn btn-ghost btn-sm" style="flex:1;" data-action="clear-reaudit-override" data-key="'+esc(x.key)+'">Reopen schedule</button>' : '') +
            '<button type="button" class="btn btn-primary btn-sm" style="flex:1;" data-action="start-reaudit" data-name="'+esc(x.storeName)+'" data-location="'+esc(x.storeLocation||'')+'" data-type="'+esc(x.type)+'">Start Audit</button>' +
          '</div>' +
        '</div>' +
        '<button type="button" class="btn btn-text btn-danger btn-sm" style="margin-top:8px;" data-action="delete-store-audits" data-key="'+esc(x.key)+'" data-name="'+esc(x.storeName)+'">Delete audit history for this store</button>' +
      '</div>';
    }).join('');
  }

  // ---------- prospects ----------
  function prospectStatus(p){
    if (p.converted) return { label:'CONVERTED', tone:'good' };
    if (p.declined) return { label:'NOT CONVERTED', tone:'bad' };
    if (p.auditId && (p.proposed||'').trim()) return { label:'PROPOSED', tone:'warn' };
    if (p.auditId) return { label:'AUDITED', tone:'warn' };
    if (p.plannedAuditDate) return { label:'⭐ SCHEDULED', tone:'warn' };
    return { label:'FRESH LEAD', tone:'warn' };
  }

  function findProspect(id){ return state.prospects.filter(function(p){ return p.id===id; })[0]; }

  function findProspectByName(name){
    var key = (name||'').trim().toLowerCase();
    if (!key) return null;
    return state.prospects.filter(function(p){ return (p.name||'').trim().toLowerCase()===key; })[0] || null;
  }

  function findService(id){ return state.services.filter(function(s){ return s.id===id; })[0] || null; }
  function norm(s){ return String(s||'').trim().toLowerCase(); }
  function templateKeys(){
    var base = ['dinein','qsr','hotel'].filter(function(k){ return state.templates[k]; });
    return base.concat(Object.keys(state.templates).filter(function(k){ return base.indexOf(k)<0; }));
  }
  function isBuiltinTemplate(k){ return k==='dinein' || k==='qsr' || k==='hotel'; }
  function clientExtraItems(storeName){
    var key = norm(storeName);
    if (!key) return [];
    var p = state.prospects.filter(function(x){ return norm(x.name)===key; })[0];
    return (p && p.extraItems) ? p.extraItems.filter(function(x){ return (x.text||'').trim(); }) : [];
  }
  function repeatMissStreaks(storeName, excludeId){
    var key = norm(storeName), out = {}, dead = {};
    if (!key) return out;
    state.history.filter(function(h){ return h.id!==excludeId && norm(h.storeName)===key; })
      .sort(function(a,b){ return b.finishedAt-a.finishedAt; })
      .forEach(function(h){
        (h.sections||[]).forEach(function(s){ (s.items||[]).forEach(function(it){
          if (dead[it.id] || it.state==='na') return;
          if (it.state==='checked'){ dead[it.id] = true; return; }
          out[it.id] = (out[it.id]||0)+1;
        }); });
      });
    return out;
  }
  function repeatProblemsFor(storeName){
    var streaks = repeatMissStreaks(storeName, null), list = [], seen = {};
    state.history.filter(function(h){ return norm(h.storeName)===norm(storeName); })
      .sort(function(a,b){ return b.finishedAt-a.finishedAt; })
      .forEach(function(h){
        (h.sections||[]).forEach(function(s){ (s.items||[]).forEach(function(it){
          if (streaks[it.id]>=2 && !seen[it.id]){ seen[it.id] = true; list.push({ text:it.text, section:s.name, streak:streaks[it.id], critical:!!it.critical }); }
        }); });
      });
    return list.sort(function(a,b){ return b.streak-a.streak; });
  }
  function serviceSectionIds(type, svc){
    var tmpl = state.templates[type];
    if (!tmpl) return [];
    var all = tmpl.sections.map(function(s){ return s.id; });
    if (!svc || !svc.auditAreas || !svc.auditAreas.length) return all;
    var wanted = svc.auditAreas.map(norm);
    var hit = tmpl.sections.filter(function(s){ return wanted.indexOf(norm(s.name))>=0; }).map(function(s){ return s.id; });
    return hit.length ? hit : all;
  }
  function serviceStepsHtml(svc){
    var st = ((svc && svc.steps) || []).filter(function(x){ return (x||'').trim(); });
    if (!st.length) return '';
    return '<ol style="margin:6px 0 2px 20px;padding:0;font-size:13px;color:var(--ink-600);line-height:1.45;">' + st.map(function(x){ return '<li style="margin:2px 0;overflow-wrap:anywhere;">'+esc(x)+'</li>'; }).join('') + '</ol>';
  }
  function serviceChecklistCounts(svc){
    return templateKeys().map(function(k){
      var ids = serviceSectionIds(k, svc), tmpl = state.templates[k];
      var n = tmpl.sections.filter(function(s){ return ids.indexOf(s.id)>=0; }).reduce(function(a,s){ return a+s.items.length; }, 0);
      return n+' '+tmpl.label+' items';
    }).join(' · ');
  }
  // The price a client is quoted: package base + chosen tracking add-on, less any discount.
  function quoteFor(p){
    var svc = p && p.servicesOffered ? findService(p.servicesOffered) : null;
    if (!svc) return null;
    var kind = p.pricingType || (svc.oneTimeMax ? 'onetime' : (svc.retainerMax ? 'retainer' : ''));
    if (!kind) return null;
    var opt = p.trackingChoice ? trackingOpt(svc, p.trackingChoice) : null;
    var isRet = kind==='retainer';
    var baseLo = Number(isRet ? svc.retainerMin : svc.oneTimeMin)||0, baseHi = Number(isRet ? svc.retainerMax : svc.oneTimeMax)||0;
    var add = opt ? trackingAdd(opt, isRet) : 0;
    var dv = Number(p.discountValue)||0, dt = p.discountType;
    function disc(x){ if (!dv || !dt) return x; return Math.max(0, Math.round(dt==='pct' ? x*(1-Math.min(dv,100)/100) : x-dv)); }
    var lo = baseLo+add, hi = baseHi+add;
    if (!lo && !hi) return null;
    return { kind:kind, isRet:isRet, baseLo:baseLo, baseHi:baseHi, add:add, opt:opt, lo:lo, hi:hi, dlo:disc(lo), dhi:disc(hi), discounted:!!(dv && dt) };
  }
  function quoteRange(a, b){ var cur = state.pricing.currency||'₹'; return a===b ? cur+fmtCompact(a) : cur+fmtCompact(a)+'–'+cur+fmtCompact(b); }
  function quoteHtml(p){
    var q = quoteFor(p);
    if (!q) return '<div class="helper" style="margin:0;">No price set on this package — nothing to quote.</div>';
    var suffix = q.isRet ? '/mo' : ' one-time';
    return '<div class="histmeta">Package: '+quoteRange(q.baseLo, q.baseHi)+suffix+'</div>' +
      (q.opt ? '<div class="histmeta">+ '+esc(trackingMethodOf(q.opt.key).label)+' tracking: '+(state.pricing.currency||'₹')+fmtCompact(q.add)+suffix+'</div>' : '') +
      (q.discounted ? '<div class="histmeta">− Discount: '+(p.discountType==='pct' ? esc(String(p.discountValue))+'%' : (state.pricing.currency||'₹')+fmtCompact(Number(p.discountValue)))+'</div>' : '') +
      '<div style="font-weight:800;font-size:17px;margin-top:6px;">Quote: '+quoteRange(q.dlo, q.dhi)+suffix+'</div>' +
      '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:8px;" data-action="use-quote-price" data-id="'+p.id+'">Use '+(state.pricing.currency||'₹')+fmtCompact(q.dhi)+' as the price</button>';
  }
  function serviceMetricNames(svc){
    return ((svc && svc.metrics) || []).map(function(id){ var l = state.paramLibrary.filter(function(x){ return x.id===id; })[0]; return l ? l.name : null; }).filter(Boolean);
  }
  function serviceAuditLine(svc){
    if (!svc) return '';
    var areas = (svc.auditAreas && svc.auditAreas.length) ? svc.auditAreas.join(', ') : 'All areas';
    var mets = serviceMetricNames(svc);
    return 'Audits: '+areas+(mets.length ? ' · Tracks: '+mets.join(', ') : '');
  }
  function serviceMetricList(svc){
    return ((svc && svc.metrics) || []).map(function(id){
      var l = state.paramLibrary.filter(function(x){ return x.id===id; })[0];
      return l ? { libId:l.id, name:l.name, unit:l.unit||'', better:l.better||'lower', value:'' } : null;
    }).filter(Boolean);
  }
  function lastReadingFor(storeName, metricName){
    var p = state.prospects.filter(function(x){ return norm(x.name)===norm(storeName); })[0];
    var prm = p && (p.parameters||[]).filter(function(x){ return norm(x.name)===norm(metricName); })[0];
    if (!prm) return null;
    var rs = state.readings.filter(function(r){ return r.clientId===p.id && r.paramId===prm.id; }).sort(function(a,b){ return (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0); });
    return rs[0] || null;
  }
  function addServiceMetrics(p, svc){
    if (!p || !svc) return;
    p.parameters = p.parameters || [];
    ((svc.metrics)||[]).forEach(function(id){
      var l = state.paramLibrary.filter(function(x){ return x.id===id; })[0];
      if (!l) return;
      if (p.parameters.some(function(x){ return norm(x.name)===norm(l.name); })) return;
      p.parameters.push({ id: uid(), name:l.name, unit:l.unit||'', better:l.better||'lower', target:'', createdAt: Date.now() });
    });
  }
  function servicePriceLine(s){
    var cur = state.pricing.currency||'₹';
    var oneTime = s.oneTimeMax ? cur+fmtCompact(s.oneTimeMin)+'–'+cur+fmtCompact(s.oneTimeMax)+' one-time' : '';
    var retainer = s.retainerMax ? cur+fmtCompact(s.retainerMin)+'–'+cur+fmtCompact(s.retainerMax)+'/mo'+(s.retainerMinMonths?' · '+s.retainerMinMonths+'mo min':'') : '';
    return [oneTime, retainer].filter(Boolean).join(' · ') || 'Complimentary';
  }

  function prospectAudits(p){
    var key = (p.name||'').trim().toLowerCase();
    if (!key) return [];
    return memo('pa:'+key, function(){
      return state.history.filter(function(h){ return (h.storeName||'').trim().toLowerCase()===key; })
        .sort(function(a,b){ return b.finishedAt-a.finishedAt; });
    }).slice();

    if (p.category && state.templates[p.category]) return state.templates[p.category].label;

  function serviceBadgeHtml(p){

  function renderProspectsDaily(){
    var days = [];
    for (var di=13; di>=0; di--){
      var dd = new Date(); dd.setHours(0,0,0,0); dd.setDate(dd.getDate()-di);
      var dayStart = dd.getTime(), dayEnd = dayStart + 24*60*60*1000;
      var audits = state.history.filter(function(h){ return h.finishedAt>=dayStart && h.finishedAt<dayEnd; })
        .sort(function(a,b){ return b.finishedAt-a.finishedAt; });
      days.push({ iso: dayStart, label: dd.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2), dayNum: dd.getDate(), audits: audits });
    }
    var maxBar = Math.max.apply(null, days.map(function(d){ return d.audits.length; })) || 1;
    var barChartHtml = '<div class="barchart">' + days.map(function(d){
      var h = d.audits.length===0 ? 0 : Math.max(10, Math.round((d.audits.length/maxBar)*100));
      return '<div class="bar-col"><div class="bar-track"><div class="bar-fill" style="height:'+h+'%"></div></div><div class="bar-val">'+d.audits.length+'</div><div class="bar-lbl">'+d.label+' '+d.dayNum+'</div></div>';
    }).join('') + '</div>';

    var daysWithAudits = days.slice().reverse().filter(function(d){ return d.audits.length>0; });

    return '<div class="card dashcard" style="margin-bottom:20px;"><div class="dashcard-title">Audits per day (last 14 days)</div>'+barChartHtml+'</div>' +
      (daysWithAudits.length===0 ? '<div class="empty"><div class="big">📅</div>No audits logged in the last 14 days.</div>' :
        daysWithAudits.map(function(d){
          return '<h2 style="font-size:13px;margin-bottom:6px;color:var(--ink-400);">'+new Date(d.iso).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})+' · '+d.audits.length+' audit'+(d.audits.length>1?'s':'')+'</h2>' +
          '<div style="margin-bottom:16px;">' +
            d.audits.map(function(h){
              return '<div class="card histcard" data-action="view-audit" data-id="'+h.id+'">' +
                '<div class="histtop"><span class="badge">'+esc((state.templates[h.type]||{}).label||h.type)+'</span><span class="histpct">'+h.completionPct+'%</span></div>' +
                '<div style="font-weight:700;margin-top:8px;">'+esc(h.storeName||'Unnamed store')+'</div>' +
                '<div class="histmeta">'+fmtAuditWhen(h.auditDate,h.auditTime)+' · Tap to view full report</div>' +
              '</div>';
            }).join('') +
          '</div>';
        }).join('')

  function renderProspects(){
    if (state.activeProspectId) return renderProspectDetail();
    if (state.activeCallId){
      var openCall = state.systemMaps.filter(function(m){ return m._id===state.activeCallId; })[0];

    var pTab = state.prospectsTab || 'pipeline';
    var locs = [], cats = [];
    state.prospects.forEach(function(p){

    });
    locs.sort(); cats.sort();
    var fl = state.prospectsFilterLocation||'all', fc = state.prospectsFilterCategory||'all';

          (cats.length ? '<div class="field" style="flex:1; min-width:150px; margin-bottom:0;"><label>Category</label><select data-prospect-filter="category"><option value="all">All categories</option>'+cats.map(function(c){ return '<option value="'+esc(c)+'" '+(fc===c?'selected':'')+'>'+esc(state.templates[c]?state.templates[c].label:c)+'</option>'; }).join('')+'</select></div>' : '') +
        '</div>'
      ) : '') +
      (pTab==='clients' ? (
        '<div class="statgrid" style="margin-top:0;">' +
          '<div class="stattile t-accent"><div class="v">'+clientsList.length+'</div><div class="k">Total Clients</div></div>' +
          '<div class="stattile'+(clientsDueSoon?' t-bad':'')+'"><div class="v">'+clientsDueSoon+'</div><div class="k">Due This Week</div></div>' +
          '<div class="stattile t-good"><div class="v">'+esc(state.pricing.currency)+clientsRevenue+'</div><div class="k">Revenue This Month</div></div>' +
        '</div>' +
        (clientsList.length===0 ? '<div class="empty"><div class="big">🤝</div>No clients yet.<br>Convert a pipeline entry to see them here.</div>' :
          clientsList.map(function(p){
            var audits = prospectAudits(p);
            var next = computeClientNextAction(p, audits);
            var last = audits[0];
            var toneColor = { bad:'var(--bad)', warn:'var(--accent)', good:'var(--good)', accent:'var(--accent)' };
            return '<div class="card histcard" style="border-left:3px solid '+(toneColor[next.tone]||'var(--line)')+';" data-action="open-prospect" data-id="'+p.id+'">' +
              '<div class="histtop"><span><span class="badge">'+esc(prospectCategoryLabel(p))+'</span>'+serviceBadgeHtml(p)+'</span>'+(last?'<span class="histpct">'+last.completionPct+'%</span>':'')+'</div>' +
              '<div style="font-weight:700;margin-top:8px;">'+esc(p.name||'Unnamed client')+'</div>' +
              '<div class="histmeta">'+esc(p.location||'—')+(p.address?' · '+esc(p.address):'')+'</div>' +
              '<div class="histmeta" style="margin-top:4px;">'+next.icon+' '+esc(next.text)+'</div>' +
            '</div>';
          }).join('')
        ) +
        histSummaryHtml
      ) : (
      '<div class="statgrid" style="margin-top:0;">' +

        '<div class="stattile'+(pipelineDeclinedCount?' t-bad':'')+'"><div class="v">'+pipelineDeclinedCount+'</div><div class="k">Not Converted</div></div>' +
      '</div>' +
      (pipelineList.length===0 ? '<div class="empty"><div class="big">🎯</div>No clients yet.<br>Add one to start tracking your pipeline.</div>' :
        pipelineList.map(function(p){

          var stColor = { good:'var(--good)', bad:'var(--bad)', warn:'var(--accent)' }[st.tone] || 'var(--line)';

          var missing = prospectProblems(p);
          var who = [p.contactName, p.contactDesignation].filter(function(x){ return (x||'').trim(); }).map(esc).join(' · ');
          var btns = contactButtons(p);

            '<div class="histtop"><span><span class="badge">'+esc(prospectCategoryLabel(p))+'</span>'+serviceBadgeHtml(p)+'</span><span class="pill '+st.tone+'">'+st.label+'</span></div>' +

            (nextFu ? '<div class="histmeta">📞 Next follow-up: '+esc(fmtFollowUpWhen(nextFu))+(nextFu.note?' — '+esc(nextFu.note):'')+(p.declined ? '' : ' <span class="pill '+followUpTone(nextFu).tone+'">'+followUpTone(nextFu).label+'</span>')+'</div>'
              : (p.declined && p.followUpDate ? '<div class="histmeta">📞 Follow up: '+fmtDateShort(new Date(p.followUpDate+'T00:00:00').getTime())+'</div>' : '')) +

              '<button type="button" class="qbtn no '+(p.declined?'on':'')+'" data-action="quick-decline" data-id="'+p.id+'">'+(p.declined?'↺ Reopen':'✗ Not converted')+'</button>' +
            '</div>' +

        }).join('')
      )
      ))
      )) +

  function computeClientNextAction(p, audits){
    var todayStr = todayISO();
    var nowMs = Date.now();
    var openIssues = openActionsForStore(p.name);
    if (p.declined) return { tone:'bad', icon:'✗', text:'Marked as not converted'+(p.followUpDate?' — follow up '+fmtDateShort(new Date(p.followUpDate+'T00:00:00').getTime()):'') };
    if (audits.length){
      var key = (p.name||'').trim().toLowerCase();
      var due = computeDueList().filter(function(x){ return x.key===key; })[0];
      if (due){
        if (due.dueAt < nowMs) return { tone:'bad', icon:'⏰', text:'Re-audit overdue since '+fmtDateShort(due.dueAt) };
        var diso = new Date(due.dueAt); var dstr = diso.getFullYear()+'-'+String(diso.getMonth()+1).padStart(2,'0')+'-'+String(diso.getDate()).padStart(2,'0');
        if (dstr===todayStr) return { tone:'warn', icon:'🗓️', text:'Re-audit due today' };
      }
      if (p.proposalStatus==='meeting_scheduled' && p.proposalMeetingDate && p.proposalMeetingDate<=todayStr && !p.converted){
        var mOverdue = p.proposalMeetingDate < todayStr;
        return { tone: mOverdue?'bad':'warn', icon:'🤝', text:'Proposal meeting '+(mOverdue?'was due '+fmtDateShort(new Date(p.proposalMeetingDate+'T00:00:00').getTime()):'due today') };
      }
      if (openIssues.length) return { tone:'warn', icon:'⚠', text: openIssues.length+' unresolved issue'+(openIssues.length>1?'s':'')+' from last visit — worth a check-in' };
      if (due && due.daysUntil<=7) return { tone:'accent', icon:'🗓️', text:'Re-audit due in '+Math.max(due.daysUntil,0)+' day'+(due.daysUntil===1?'':'s') };
      if (!p.converted && !p.proposalStatus) return { tone:'accent', icon:'📝', text:'Audit done — log a proposal to move this forward' };
      return { tone:'good', icon:'✓', text:'All caught up' };
    }
    if (p.plannedAuditDate && p.plannedAuditDate<=todayStr){
      return { tone: p.plannedAuditDate<todayStr?'bad':'warn', icon:'⭐', text:'Scheduled audit '+(p.plannedAuditDate<todayStr?'was due '+fmtDateShort(new Date(p.plannedAuditDate+'T00:00:00').getTime()):'due today'+plannedTimeSuffix(p))+', needs check-in' };
    }
    return { tone:'accent', icon:'▶', text:'No audit yet — start one to kick things off' };
  }

  function buildClientTimeline(p, audits){
    var key = (p.name||'').trim().toLowerCase();
    var events = [];
    audits.forEach(function(h){ events.push({ t: h.finishedAt, type:'audit', data:h }); });
    state.correctiveActions.filter(function(a){ return (a.storeName||'').trim().toLowerCase()===key; }).forEach(function(a){
      if (a.createdAt) events.push({ t:a.createdAt, type:'action-created', data:a });
      if (a.done && a.resolvedAt) events.push({ t:a.resolvedAt, type:'action-resolved', data:a });
    });
    (p.actionLog||[]).forEach(function(s, i){ events.push({ t:s.doneAt, type:'loop-step', data:s, n:i+1 }); });
    (p.followUps||[]).filter(function(f){ return f.done && f.doneAt; }).forEach(function(f){ events.push({ t:f.doneAt, type:'followup', data:f }); });
    (p.inquiry||[]).forEach(function(e){ if (e.createdAt) events.push({ t:e.createdAt, type:'inquiry', data:e }); });
    state.readings.filter(function(r){ return r.clientId===p.id && r.createdAt; }).forEach(function(r){ events.push({ t:r.createdAt, type:'reading', data:r }); });
    state.lookups.filter(function(l){ return l.clientId===p.id; }).forEach(function(l){
      var kind = l.source==='solution' ? 'task' : 'request';
      if (l.createdAt) events.push({ t:l.createdAt, type:kind+'-created', data:l });
      if (l.done && l.doneAt) events.push({ t:l.doneAt, type:kind+'-done', data:l });
    });
    if (p.convertedAt) events.push({ t:p.convertedAt, type:'converted', data:p });
    if (p.declinedAt) events.push({ t:p.declinedAt, type:'declined', data:p });
    if (p.createdAt) events.push({ t:p.createdAt, type:'added', data:p });
    events.sort(function(a,b){ return b.t-a.t; });
    return events;
  }

  function renderClientTimeline(p, audits){
    var events = buildClientTimeline(p, audits);
    if (!events.length) return '';
    return '<div style="margin-bottom:20px;">' +
      events.map(function(e){
        var d = e.data;
        if (e.type==='audit'){
          return '<div class="card histcard" data-action="view-audit" data-id="'+d.id+'">' +
            '<div class="histtop"><span class="badge">'+esc((state.templates[d.type]||{}).label||d.type)+' audit</span><span class="histpct">'+d.completionPct+'%</span></div>' +
            '<div class="histmeta" style="margin-top:8px;">'+fmtDateShort(e.t)+' · Tap to view full report</div>' +
          '</div>';
        }
        if (e.type==='followup'){
          return '<div class="card histcard static"><div class="histtop"><span>📞 Follow-up done</span><span class="histmeta">'+fmtDateShort(e.t)+'</span></div>' + (d.note ? '<div class="histmeta" style="margin-top:6px;">'+esc(d.note)+'</div>' : '') + '</div>';
        }
        if (e.type==='loop-step'){
          var ls = LOOP_STEPS[d.type] || LOOP_STEPS.other;
          return '<div class="card histcard static"><div class="histtop"><span>'+ls.icon+' Step '+e.n+' — '+esc(ls.label)+'</span><span class="histmeta">'+fmtDateShort(e.t)+'</span></div>' +
            '<div style="margin-top:6px;">'+loopFieldRowsHtml(d.type, d.data, d.note)+'</div></div>';
        }
        if (e.type==='action-created'){
          return '<div class="card histcard static"><div class="histtop"><span>⚠️ Corrective action logged</span></div><div class="histmeta" style="margin-top:8px;">'+esc(d.description||'(unspecified)')+' · '+fmtDateShort(e.t)+'</div></div>';
        }
        if (e.type==='action-resolved'){
          return '<div class="card histcard static"><div class="histtop"><span>✓ Issue fixed</span></div><div class="histmeta" style="margin-top:8px;">'+esc(d.description||'(unspecified)')+' · '+fmtDateShort(e.t)+'</div></div>';
        }
        if (e.type==='reading'){
          var rdPrm = (p.parameters||[]).filter(function(x){ return x.id===d.paramId; })[0];
          if (!rdPrm) return '';
          var rdList = paramReadings(p, rdPrm.id), rdIdx = rdList.map(function(r){ return r.id; }).indexOf(d.id);
          var rdPrev = rdIdx>0 ? rdList[rdIdx-1] : null, rdU = esc(rdPrm.unit||'');
          return '<div class="card histcard static"><div class="histtop"><span>📈 '+esc(rdPrm.name)+': '+fmtNum(d.value)+rdU+'</span><span class="histmeta">'+fmtDateShort(e.t)+'</span></div>' +
            '<div class="histmeta" style="margin-top:6px;">'+(rdPrev ? 'Was '+fmtNum(rdPrev.value)+rdU : 'Starting value')+(d.note ? ' · '+esc(d.note) : '')+'</div></div>';
        }

  // Overdue follow-ups are placed first, then each day keeps its own up to the cap; the excess rolls to the next day.
  function computeFollowUpPlan(){ return memo('fuPlan', computeFollowUpPlanRaw); }
  function computeFollowUpPlanRaw(){
    var cfg = planCfg(), today = todayISO(), items = [];
    state.prospects.forEach(function(p){
      if (p.converted || p.declined) return;
      (p.followUps||[]).forEach(function(f){ if (!f.done && !f.serviceRecurring && f.date) items.push({ p:p, f:f }); });
    });
    function key(x){ return x.f.date+' '+(x.f.time||'99:99'); }
    var overdue = items.filter(function(x){ return x.f.date < today; }).sort(function(a,b){ return key(a).localeCompare(key(b)); });
    var byDate = {}, maxDate = today;
    items.filter(function(x){ return x.f.date >= today; }).forEach(function(x){ (byDate[x.f.date] = byDate[x.f.date] || []).push(x); if (x.f.date>maxDate) maxDate = x.f.date; });
    var carry = overdue.slice(), moves = [], d = new Date(today+'T00:00:00'), guard = 0;
    while (guard++ < 400){
      var iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      if (!carry.length && iso > maxDate) break;
      var isToday = iso===today, slots = planSlots(iso, cfg, isToday);
      var own = (byDate[iso]||[]).slice().sort(function(a,b){ return key(a).localeCompare(key(b)); });
      if (!(isToday && !slots.length)){
        var ordered = carry.concat(own), take = ordered.slice(0, slots.length);
        var changed = carry.length>0 || own.length>slots.length;
        carry = ordered.slice(slots.length);
        if (changed) take.forEach(function(x, i){ if (x.f.date!==iso || x.f.time!==slots[i]) moves.push({ x:x, date:iso, time:slots[i] }); });
      }
      d.setDate(d.getDate()+1);
    }
    return moves;
  }

  function paramStatus(p, prm){
    var st = paramStats(p, prm), kind = 'none', age = null;
    if (st.now!==null){
      var last = st.readings[st.readings.length-1].date;
      age = Math.floor((Date.now()-new Date(last+'T00:00:00').getTime())/86400000);
      var reached = st.target!==null && (prm.better==='higher' ? st.now>=st.target : st.now<=st.target);
      if (reached) kind = 'reached';
      else if (st.improving===false) kind = 'wrong';
      else if (age>30) kind = 'stale';
      else kind = st.improving ? 'improving' : 'flat';
    }
    return { st:st, kind:kind, age:age };
  }

  function computeProgressSummary(p, audits){
    if (audits.length < 2) return null;
    var latest = audits[0], first = audits[audits.length-1];
    var firstMap = {};
    first.sections.forEach(function(s){ (s.items||[]).forEach(function(it){ firstMap[it.id] = it.state; }); });
    var improved = [], regressed = [], persistent = [];
    latest.sections.forEach(function(s){
      (s.items||[]).forEach(function(it){
        var prevState = firstMap[it.id];
        if (prevState===undefined) return;
        if (prevState==='unchecked' && it.state==='checked') improved.push({ text:it.text, section:s.name });
        else if (prevState==='checked' && it.state==='unchecked') regressed.push({ text:it.text, section:s.name });
        else if (prevState==='unchecked' && it.state==='unchecked') persistent.push({ text:it.text, section:s.name });
      });
    });
    var key = (p.name||'').trim().toLowerCase();
    var allActions = state.correctiveActions.filter(function(a){ return (a.storeName||'').trim().toLowerCase()===key; });
    var resolvedActions = allActions.filter(function(a){ return a.done; });
    return {
      first: first, latest: latest,
      scoreDelta: latest.completionPct - first.completionPct,
      improved: improved, regressed: regressed, persistent: persistent,
      auditsCount: audits.length,
      daysSinceFirst: Math.max(0, Math.round((Date.now()-first.finishedAt)/86400000)),
      actionsRaised: allActions.length, actionsResolved: resolvedActions.length, actionsOpen: openActionsForStore(p.name).length
    };
  }

  function findContent(id){ return state.contentIdeas.filter(function(c){ return c.id===id; })[0]; }

  function contentStatus(c){
    if (c.posted) return { label:'✓ POSTED', tone:'good' };
    if (c.shootDate) return { label:'Shoot '+fmtDateShort(new Date(c.shootDate+'T00:00:00').getTime()), tone: (c.shootDate<todayISO()?'bad':'warn') };
    if (c.notScheduled) return { label:'Not scheduled', tone:'warn' };
    return { label:'Draft', tone:'warn' };
  }

  // The four proven angles a piece of content can take (an Instagram-creator tip). Every idea should lean on one or two of these, not the topic itself.
  var CONTENT_ANGLES = [
    { key:'belief', icon:'💭', label:'Belief', helper:'An opinion or honest take — say what you really think about how the industry does things.',
      c1:{ label:'What people usually think or do', ph:'The common view or habit you’re pushing back on' },
      c2:{ label:'Your honest take', ph:'What you actually believe, and why — say this on camera' } },
    { key:'myth', icon:'❌', label:'Myth-buster', helper:'Call out a myth or misconception people in the niche believe.',
      c1:{ label:'The myth', ph:'The misconception people in the niche believe' },
      c2:{ label:'The truth', ph:'What’s actually true, and the proof or reasoning behind it' } },
    { key:'process', icon:'🎬', label:'Insight / Process', helper:'Behind-the-scenes, a case study, or a before-after transformation.',
      c1:{ label:'Before — the problem', ph:'The situation before: the pain point, the mess, the starting case' },
      c2:{ label:'Behind the scenes — the after', ph:'What you did and the result — full script / shot list' } },
    { key:'offer', icon:'🎯', label:'Offer', helper:'What you sell — a direct pitch or call to action.',
      c1:{ label:'Who this is for', ph:'The problem your offer solves for them' },
      c2:{ label:'The offer', ph:'What you’re offering — the pitch and script for it' } }
  ];
  function contentAngleOf(key){ return CONTENT_ANGLES.filter(function(a){ return a.key===key; })[0]; }
  function contentAngleChips(c){
    return (c.angles||[]).map(function(k){ var a = contentAngleOf(k); return a ? '<span class="angletag">'+a.icon+' '+esc(a.label)+'</span>' : ''; }).join('');
  }

  // The angle you picked reshapes Context 1/2 so the field asks for what that angle actually needs, instead of a generic "problem / script".
  function contentContextFields(c){
    var keys = c.angles || [];
    var primary = keys.length ? contentAngleOf(keys[0]) : null;
    if (!primary) return {
      c1lbl:'Context 1 — the problem', c1ph:'The problem / pain point that makes viewers pay attention',
      c2lbl:'Context 2 — the script', c2ph:'Everything to say/do on shoot day — full script / shot list',
      note:'Pick a content angle above to shape this field for it.'
    };
    var second = keys.length>1 ? contentAngleOf(keys[1]) : null;
    return {
      c1lbl:'Context 1 — '+primary.c1.label, c1ph:primary.c1.ph,
      c2lbl:'Context 2 — '+primary.c2.label, c2ph:primary.c2.ph,
      note:'Shaped for '+primary.icon+' '+primary.label+(second ? ' — also touch on '+second.icon+' '+second.label+' somewhere in the script.' : '.')
    };
  }

  var CONTENT_HEADS = [
    { key:'__gov', label:'System', icon:'⚙️' },
    { key:'__sop', label:'SOP', icon:'📘' }
  ];
  function contentHeadFor(area){ return CONTENT_HEADS.filter(function(h){ return h.key===area; })[0]; }
  var SEGMENT_LABELS = { dinein:'Dine-In', qsr:'QSR', both:'Dine-In + QSR' };
  function contentAreaOptions(segment){
    var keys = segment==='qsr' ? ['qsr'] : (segment==='dinein' ? ['dinein'] : ['dinein','qsr']);
    var seen = {}, out = [];
    keys.forEach(function(k){
      state.templates[k].sections.forEach(function(s){
        var n = (s.name||'').trim(), lk = n.toLowerCase();
        if (n && !seen[lk]){ seen[lk] = true; out.push(n); }
      });
    });
    return out;
  }
  function contentMatchesSegment(c, seg){ return c.segment===seg || c.segment==='both'; }
  function contentAreaLabel(c){
    var head = contentHeadFor(c.area);
    return head ? head.label : (c.area || '');
  }
  function contentTagHtml(c){
    if (!c.segment) return '<span class="pill warn">Untagged</span>';
    return '<span class="pill good">'+esc(SEGMENT_LABELS[c.segment])+'</span>' + (c.area ? ' <span class="pill warn">'+esc(contentAreaLabel(c))+'</span>' : ' <span class="pill bad">No area</span>');
  }
  function contentSortInGroup(a, b){
    if (!!a.posted !== !!b.posted) return a.posted ? 1 : -1;
    if (a.posted) return (b.postedAt||0)-(a.postedAt||0);
    if (a.shootDate && b.shootDate && a.shootDate!==b.shootDate) return a.shootDate<b.shootDate ? -1 : 1;
    if (a.shootDate && !b.shootDate) return -1;
    if (!a.shootDate && b.shootDate) return 1;
    return (b.createdAt||0)-(a.createdAt||0);
  }
  function nextShootOf(items){
    var d = items.filter(function(c){ return !c.posted && !c.notScheduled && c.shootDate; }).map(function(c){ return c.shootDate; }).sort();
    return d[0] || '';
  }
  function shootPillFor(iso){
    var today = todayISO();
    var label = iso<today ? 'Overdue · '+fmtDateShort(new Date(iso+'T00:00:00').getTime())
      : (iso===today ? 'Shoot today' : 'Next shoot '+fmtDateShort(new Date(iso+'T00:00:00').getTime()));
    return '<span class="pill '+(iso<today?'bad':(iso===today?'good':'warn'))+'" style="white-space:nowrap;">'+esc(label)+'</span>';
  }
  // Hook / Context 1 / Context 2 / CTA used to be four fields; they're now one combined script box (c.script).
  // This pulls old items' separate fields into that box the first time they're opened, so nothing written before is lost.
  function migrateContentScript(c){
    if ((c.script||'').trim()) return false;
    var parts = [c.hook, c.context1, c.context2, c.cta].filter(function(v){ return (v||'').trim(); });
    if (!parts.length) return false;
    c.script = parts.join('\n\n');
    return true;
  }
  function contentCardHtml(c, showTags){
    var st = contentStatus(c);
    var preview = (c.script||c.hook||'').split('\n')[0];
    return '<div class="card histcard" data-action="open-content" data-id="'+c.id+'">' +
      '<div class="histtop"><span class="badge">'+((c.script||c.context2||'').trim()?'Scripted':'No script yet')+'</span><span class="pill '+st.tone+'">'+esc(st.label)+'</span></div>' +
      '<div style="font-weight:700;margin-top:8px;">'+esc(c.topic||'Untitled idea')+'</div>' +
      (showTags ? '<div style="margin-top:6px;">'+contentTagHtml(c)+'</div>' : (c.segment==='both' ? '<div style="margin-top:6px;"><span class="pill good">'+esc(SEGMENT_LABELS.both)+'</span></div>' : '')) +
      ((c.angles||[]).length ? '<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;">'+contentAngleChips(c)+'</div>' : '') +
      (preview ? '<div class="histmeta">'+esc(preview.slice(0,90))+'</div>' : '') +
    '</div>';
  }
  function renderContentBoard(){
    var seg = state.contentCoverageTab==='qsr' ? 'qsr' : 'dinein';
    var items = state.contentIdeas.filter(function(c){ return contentMatchesSegment(c, seg); });
    var groups = CONTENT_HEADS.map(function(h){ return { key:h.key, area:h.key, name:h.label, icon:h.icon, head:true }; })
      .concat(contentAreaOptions(seg).map(function(n){ return { key:n.toLowerCase(), area:n, name:n, icon:'🍴', head:false }; }));
    var claimed = {};
    groups.forEach(function(g, i){
      g.order = i;
      g.items = items.filter(function(c){ return (c.area||'').toLowerCase()===g.key; }).sort(contentSortInGroup);
      g.items.forEach(function(c){ claimed[c.id] = true; });
      g.made = g.items.filter(function(c){ return c.posted; }).length;
      g.next = nextShootOf(g.items);
    });
    groups.sort(function(a, b){
      var ra = a.next ? 0 : (a.items.length ? 1 : 2), rb = b.next ? 0 : (b.items.length ? 1 : 2);
      if (ra!==rb) return ra-rb;
      if (ra===0 && a.next!==b.next) return a.next<b.next ? -1 : 1;
      if (ra===1 && a.items.length!==b.items.length) return b.items.length-a.items.length;
      return a.order-b.order;
    });
    var loose = state.contentIdeas.filter(function(c){ return (!c.segment || contentMatchesSegment(c, seg)) && !claimed[c.id]; }).sort(contentSortInGroup);
    var firstNext = groups.filter(function(g){ return g.next; })[0];

    function groupHtml(g, isLoose){
      var gkey = seg+'|'+(isLoose ? '__loose' : g.key);
      var defOpen = isLoose ? false : (firstNext===g);
      var open = state.contentOpen[gkey]===undefined ? defOpen : state.contentOpen[gkey];
      var list = isLoose ? loose : g.items;
      var total = list.length;
      var made = list.filter(function(c){ return c.posted; }).length;
      var title = isLoose ? '🏷️ Needs a segment or area' : g.icon+' '+esc(g.name);
      var meta = (!isLoose && g.head ? 'All departments' : '') +
        (total ? (!isLoose && g.head ? ' · ' : '')+made+' posted · '+(total-made)+' planned' : (isLoose ? '' : (g.head ? ' · ' : '')+'Nothing made yet'));
      var next = isLoose ? '' : g.next;
      return '<div class="card cgroup'+(open?' open':'')+(!isLoose && g.head?' head':'')+'">' +
        '<button type="button" class="cghead" data-action="toggle-content-group" data-key="'+esc(gkey)+'" aria-expanded="'+(open?'true':'false')+'">' +
          '<span style="min-width:0;"><span class="cgtitle">'+title+'</span>' +
            (meta ? '<span class="histmeta" style="display:block;margin-top:2px;">'+meta+'</span>' : '') +
          '</span>' +
          '<span class="cgright">' +
            (next ? shootPillFor(next) : '') +
            '<span class="pill '+(total?'good':'bad')+'" style="white-space:nowrap;">'+(total?total:'None')+'</span>' +
            '<span class="chev">▶</span>' +
          '</span>' +
        '</button>' +
        (open ? '<div class="cgbody">' +
          (total ? list.map(function(c){ return contentCardHtml(c, isLoose); }).join('') : '<div class="helper" style="margin:12px 2px 0;">No content here yet — add the first idea.</div>') +
          (isLoose ? '' : '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:10px;width:100%;" data-action="add-content-in" data-seg="'+seg+'" data-area="'+esc(g.area)+'">+ Add idea to '+esc(g.name)+'</button>') +
        '</div>' : '') +
      '</div>';
    }

  // A one-line week-in-review pulled from data already in the app — audits, conversions, posts, hours worked —
  // so the week's shape is visible without opening Actions, Clients, Content and The Day separately.
  // ---- Dashboard: open tasks, lookups and corrective actions in one tabbed card ----
  function renderWorkBoard(){
    var tasks = state.lookups.filter(function(l){ return !l.done && lookupGroup(l)==='task'; }).sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
    var looks = state.lookups.filter(function(l){ return !l.done && lookupGroup(l)==='lookup'; }).sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
    var fixes = state.correctiveActions.filter(function(a){ return !a.done; }).sort(function(a,b){ return (a.dueDate||'9999')<(b.dueDate||'9999') ? -1 : 1; });
    if (!tasks.length && !looks.length && !fixes.length) return '';
    var today = todayISO(), weekAgo = Date.now()-7*86400000;
    var tabs = [['fix','🛠️ Fixes',fixes],['task','✅ Tasks',tasks],['lookup','🔎 Lookups',looks]];
    var cur = state.dashLookupTab;
    if (!cur || !tabs.some(function(x){ return x[0]===cur; })) cur = (tabs.filter(function(x){ return x[2].length; })[0] || tabs[0])[0];
    var sel = tabs.filter(function(x){ return x[0]===cur; })[0], items = sel[2];
    var overdueFixes = fixes.filter(function(a){ return a.dueDate && a.dueDate<today; }).length;
    var resolvedWeek = state.correctiveActions.filter(function(a){ return a.done && (a.resolvedAt||0)>=weekAgo; }).length;
    var body;
    if (!items.length){
      body = '<div class="empty" style="padding:22px 10px;"><div class="big">✅</div>Nothing open here — nice.</div>';
    } else if (cur==='fix'){
      body = items.slice(0,5).map(function(a){
        var over = a.dueDate && a.dueDate<today;
        return '<div class="workrow"><button class="chk" data-action="resolve-action" data-id="'+a.id+'" aria-label="Mark resolved"></button>' +
          '<div class="wr-main"><div class="wr-text">'+esc(a.description||'(unspecified)')+'</div><div class="histmeta">'+esc(a.storeName||'Unnamed store')+(a.dueDate ? ' · '+(over?'was due ':'due ')+esc(fmtDateShort(new Date(a.dueDate+'T00:00:00').getTime())) : '')+'</div></div>' +
          (over ? '<span class="pill bad">Overdue</span>' : '') + '</div>';
      }).join('');
    } else {
      body = items.slice(0,5).map(function(l){
        var cl = l.clientId ? state.prospects.filter(function(p){ return p.id===l.clientId; })[0] : null;
        return '<div class="workrow"><button class="chk" data-action="toggle-lookup-done" data-id="'+l.id+'" aria-label="Mark done"></button>' +
          '<div class="wr-main"><div class="wr-text">'+esc(l.text||'(empty)')+'</div>'+(cl ? '<div class="histmeta">👤 '+esc(cl.name||'Client')+'</div>' : '')+'</div></div>';
      }).join('');
    }
    return sh('🗂️','Tasks & fixes') +
      '<div class="card" style="padding:12px 16px 14px;margin-bottom:20px;">' +
        '<div class="tabs tabs-auto" style="margin:0 0 8px;">' + tabs.map(function(x){ return '<button class="tab '+(cur===x[0]?'on':'')+'" data-action="dash-lookup-tab" data-tab="'+x[0]+'">'+x[1]+'<span class="tabcount'+(x[0]==='fix' && overdueFixes ? ' bad' : '')+'">'+x[2].length+'</span></button>'; }).join('') + '</div>' +
        body +
        (items.length>5 ? '<div class="helper" style="margin:8px 0 0;">+'+(items.length-5)+' more</div>' : '') +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;">' +
          '<span class="helper" style="margin:0;">'+(cur==='fix' ? (overdueFixes ? overdueFixes+' overdue · ' : '')+resolvedWeek+' resolved this week' : '')+'</span>' +
          '<button type="button" class="btn btn-text btn-sm" data-action="go-actions" data-tab="'+(cur==='fix'?'corrective':cur)+'">See all →</button>' +
        '</div>' +
      '</div>';
  }
  // ---- Undo bar: after a delete / done / convert tap, a short "Undo" lets you take it back ----
  var undoTimer = null;
  var UNDO_ACTIONS = {
    'done-followup':'Follow-up marked done', 'delete-followup':'Follow-up deleted', 'delete-lookup':'Item deleted', 'toggle-lookup-done':'Item updated',
    'delete-recent-audit':'Audit removed', 'delete-store-audits':'Audit history deleted', 'delete-prospect':'Client deleted',
    'resolve-action':'Action resolved', 'quick-convert':'Marked converted', 'quick-decline':'Marked not converted',
    'delete-invoice':'Invoice deleted', 'add-invoice':'Invoice added', 'quick-invoice':'Invoice created', 'toggle-invoice-paid':'Invoice updated'
  };
  function undoSnap(){ return { prospects:JSON.stringify(state.prospects), history:JSON.stringify(state.history), lookups:JSON.stringify(state.lookups), correctiveActions:JSON.stringify(state.correctiveActions) }; }
  function undoChanged(a){ var b = undoSnap(); return Object.keys(a).some(function(k){ return a[k]!==b[k]; }); }
  function undoRestore(s){
    state.prospects = JSON.parse(s.prospects); state.history = JSON.parse(s.history);
    state.lookups = JSON.parse(s.lookups); state.correctiveActions = JSON.parse(s.correctiveActions);
    persistProspects(); persistHistory(); persistLookups(); persistActions(); render();
  }
  function showUndo(msg, snap){
    var bar = document.getElementById('undoBar');
    if (!bar){ bar = document.createElement('div'); bar.id = 'undoBar'; bar.className = 'undobar'; bar.setAttribute('role','status'); document.body.appendChild(bar); }
    bar.innerHTML = '<span></span><button type="button">Undo</button>';
    bar.firstChild.textContent = msg;
    bar.lastChild.onclick = function(){ clearTimeout(undoTimer); bar.remove(); undoRestore(snap); };
    clearTimeout(undoTimer);
    undoTimer = setTimeout(function(){ if (bar.parentNode) bar.remove(); }, 7000);
  }

  // ---- Day wins and weekly summary: what you actually got done, shown on the Dashboard ----
  function dayStartMs(offset){ var d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+offset); return d.getTime(); }
  function activityBetween(a, b){
    var calls = 0, conv = 0;
    state.prospects.forEach(function(p){
      (p.followUps||[]).forEach(function(f){ if (f.done && f.doneAt>=a && f.doneAt<b) calls++; });
      if (p.converted && (p.convertedAt||0)>=a && p.convertedAt<b) conv++;
    });
    return {
      calls: calls, converted: conv,
      audits: state.history.filter(function(h){ return (h.finishedAt||0)>=a && h.finishedAt<b; }).length,
      resolved: state.correctiveActions.filter(function(x){ return x.done && (x.resolvedAt||0)>=a && x.resolvedAt<b; }).length,
      tasks: state.lookups.filter(function(l){ return l.done && (l.doneAt||0)>=a && l.doneAt<b; }).length,
      workMs: state.workdays.filter(function(w){ return (w.checkInAt||0)>=a && w.checkInAt<b; }).reduce(function(s,w){ return s+workdayWorkElapsed(w); }, 0)
    };
  }
  function activityTotal(x){ return x.calls+x.audits+x.converted+x.resolved+x.tasks; }
  var ACT_TILES = [['calls','Calls & follow-ups'],['audits','Audits'],['converted','Clients won'],['resolved','Issues fixed'],['tasks','Tasks done']];
  function fmtHM(ms){ var m = Math.round(ms/60000); return m>=60 ? Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m' : m+'m'; }
  function renderTodayWins(){
    var a = activityBetween(dayStartMs(0), dayStartMs(1)), total = activityTotal(a);
    var open = openWorkday();
    if (!total && !a.workMs) return '';
    var finished = !open && state.workdays.some(function(w){ return w.date===todayISO() && w.checkOutAt; });
    var line = total>=8 ? 'Outstanding — you crushed it today.' : (total>=4 ? 'Strong day — that\'s real momentum.' : (total>=1 ? 'Good progress — every call counts.' : 'You\'re on the clock — let\'s get the first win.'));
    var tiles = ACT_TILES.filter(function(t){ return a[t[0]]>0; }).map(function(t){ return '<div class="stattile t-good"><div class="v">'+a[t[0]]+'</div><div class="k">'+t[1]+'</div></div>'; });
    if (a.workMs>0) tiles.push('<div class="stattile t-accent"><div class="v">'+fmtHM(a.workMs)+'</div><div class="k">Time worked</div></div>');
    return sh(finished ? '🏁' : '🔥', finished ? 'Day complete' : 'Today so far') +
      '<div class="card winscard"><div class="winsline">'+esc(line)+'</div>' +

  function computeAlerts(){ return memo('alerts', computeAlertsRaw); }
  function computeAlertsRaw(){
    var todayStr = todayISO();
    var nowMs = Date.now();
    var due = computeDueList();
    var alerts = [];
    due.forEach(function(x){
      if (x.dueAt < nowMs){
        alerts.push({ tone:'bad', icon:'⏰', text: (x.storeName||'Unnamed store')+' — re-audit overdue', action:'go-actions', tab:'schedule' });
      } else {
        var dd = new Date(x.dueAt); var diso = dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');
        if (diso===todayStr) alerts.push({ tone:'warn', icon:'🗓️', text: (x.storeName||'Unnamed store')+' — re-audit due today', action:'go-actions', tab:'schedule' });
      }
    });
    state.prospects.forEach(function(p){
      if (isLiveClient(p)){
        var stuckDays = loopDaysOnStep(p);
        var stuckLimit = loopStuckDays(p);
        if (stuckDays >= stuckLimit){
          alerts.push({ tone: stuckDays>=stuckLimit*2?'bad':'warn', icon:'⏳', text: (p.name||'Unnamed client')+' — '+stuckDays+' days on "'+LOOP_STEPS[loopTypeOf(p)].label+'", needs a nudge', action:'goto-prospect', id:p.id });
        }
      }
      if (p.plannedAuditDate && p.plannedAuditDate<=todayStr && !p.auditId && !p.declined){
        var overdue = p.plannedAuditDate < todayStr;
        alerts.push({ tone: overdue?'bad':'warn', icon:'⭐', text: (p.name||'Unnamed client')+' — scheduled audit '+(overdue?'was due '+fmtDateShort(new Date(p.plannedAuditDate+'T00:00:00').getTime()):'due today'+plannedTimeSuffix(p))+', needs check-in', action:'goto-prospect', id:p.id });
      }
      if (p.proposalStatus==='meeting_scheduled' && p.proposalMeetingDate && p.proposalMeetingDate<=todayStr && !p.converted && !p.declined){
        var mOverdue = p.proposalMeetingDate < todayStr;
        alerts.push({ tone: mOverdue?'bad':'warn', icon:'🤝', text: (p.name||'Unnamed client')+' — proposal meeting '+(mOverdue?'was due '+fmtDateShort(new Date(p.proposalMeetingDate+'T00:00:00').getTime()):'due today')+', follow up', action:'goto-prospect', id:p.id });
      }
    });
    var overInv = allInvoices().filter(function(x){ return !x.inv.paid && invDue(x.inv)<todayStr; });
    if (overInv.length) alerts.push({ tone:'bad', icon:'💸', text: overInv.length+' invoice'+(overInv.length===1?'':'s')+' overdue — '+fmtMoney(overInv.reduce(function(s,x){ return s+invAmount(x.inv); },0))+' to collect', action:'go-time' });
    smCalls().forEach(function(c){
      var ct = c.contact, s = c.status||'new';
      if (!smOpen(c)) return;
      var who = (ct.name||'Someone')+(smBiz(c)?' ('+smBiz(c)+')':'');
      if (c.kind==='inquiry'){ if (s==='new') alerts.push({ tone:'good', icon:'✉️', text: who+' sent an inquiry from your website', action:'sm-open', id:c._id }); return; }
      if (ct.date && ct.date<todayStr) alerts.push({ tone:'bad', icon:'📞', text: who+' — Snapshot Call was due '+fmtDateShort(new Date(ct.date+'T00:00:00').getTime())+', '+(s==='new'?'not contacted yet':'not marked done'), action:'sm-open', id:c._id });
      else if (ct.date===todayStr) alerts.push({ tone:'warn', icon:'📞', text: who+' — Snapshot Call today, '+(ct.slot||''), action:'sm-open', id:c._id });
      else if (s==='new') alerts.push({ tone:'good', icon:'📞', text: who+' booked a Snapshot Call for '+smWhenLabel(c), action:'sm-open', id:c._id });
    });
    var noPrice = clientsMissingPrice();
    if (noPrice.length){
      alerts.push({ tone:'warn', icon:'💰', text: noPrice.length===1 ? (noPrice[0].name||'A client')+' is converted but has no price or pricing type — add it so it counts toward your target' : noPrice.length+' converted clients have no price or pricing type — add them so they count toward your target', action: noPrice.length===1 ? 'goto-prospect' : 'go-prospects', id: noPrice.length===1 ? noPrice[0].id : '' });
    }
    storageReport(false).rows.forEach(function(r){
      if (r.pct>=80) alerts.push({ tone: r.pct>=90?'bad':'warn', icon:'🗄️', text: r.label+' storage is '+Math.round(r.pct)+'% full — it needs to be moved to separate records soon', action:'go-pricing' });
    });
    var lb = lastBackupAt();
    if ((state.history.length || state.prospects.length) && (!lb || Date.now()-lb > 30*86400000)){
      alerts.push({ tone:'warn', icon:'💾', text: lb ? 'No backup in over 30 days — download one in Settings' : 'No backup downloaded yet — take your first one in Settings', action:'go-pricing' });
    }
    var owAlert = openWorkday();
    if (owAlert){
      var hoursOpen = (nowMs-owAlert.checkInAt)/3600000;
      if (owAlert.date!==todayStr || hoursOpen>16){
        alerts.push({ tone:'bad', icon:'⏱️', text: 'Still checked in since '+fmtDateShort(owAlert.checkInAt)+' '+fmtClock(owAlert.checkInAt)+' — check out if the day is done', action:'go-dashboard' });
      }
    }
    return alerts;
  }

  // ---------- revenue history ----------
  function fmtCompact(n){
    n = Math.round(n);
    if (n>=100000) return (Math.round(n/1000)/100)+'L';
    if (n>=1000) return (Math.round(n/10)/100)+'k';
    return String(n);
  }
  function monthRevenueHistory(count){
    var out = [], now = new Date();
    for (var i=count-1; i>=0; i--){
      var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      var r = clientRevenueForMonth(d.getFullYear(), d.getMonth());
      r.label = d.toLocaleDateString(undefined,{month:'short'});
      r.current = (i===0);
      out.push(r);
    }
    return out;
  }
  function renderRevenueHistory(){
    var cur = esc(state.pricing.currency);
    var hist = monthRevenueHistory(6);
    var max = hist.reduce(function(m, r){ return Math.max(m, r.total); }, 0);
    var retainers = state.prospects.filter(function(p){
      return p.converted && !p.declined && !p.engagementEnded && p.pricingType==='retainer' && clientPriceOf(p);
    }).sort(function(a, b){ return clientPriceOf(b)-clientPriceOf(a); });
    if (!max && !retainers.length){

    var bars = hist.map(function(r){
      var hTot = r.total ? Math.max(4, Math.round(r.total/max*BAR_H)) : 0;

          '<div class="rev-one" style="height:'+(hTot-hRet)+'px;"></div><div class="rev-ret" style="height:'+hRet+'px;"></div>' +
        '</div></div>' +
        '<div class="revlbl">'+esc(r.label)+'</div>' +

    return sh('💰','Revenue history') +
      '<div class="card" style="padding:14px 14px 12px;margin-bottom:12px;">' +

          '<span><span class="revdot" style="background:var(--good);"></span>One-time</span>' +

      '<div class="statgrid" style="margin-top:0;">' +

        '<div class="stattile t-good"><div class="v">'+cur+sixTotal+'</div><div class="k">Last 6 months</div></div>' +
      '</div>' +
      (retainers.length ? (
        '<div class="card" style="padding:4px 16px;margin-bottom:20px;">' +
          retainers.slice(0, 6).map(function(p){
            return '<div class="sumrow" data-action="goto-prospect" data-id="'+p.id+'" style="cursor:pointer;">' +
              '<span class="k" style="min-width:0;"><span style="font-weight:700;color:var(--ink);">'+esc(p.name||'Unnamed client')+'</span>' +

              '<span class="v">'+cur+clientPriceOf(p)+' /mo</span>' +

          (retainers.length>6 ? '<div class="helper" style="padding:8px 0;">+'+(retainers.length-6)+' more retainer clients</div>' : '') +

  // ---------- week ahead ----------
  function isoFromDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function weekEventsAll(){ return memo('weekEvents', weekEventsAllRaw); }
  function weekEventsAllRaw(){
    var ev = [];
    function add(date, time, icon, tone, title, sub, action, id, tab){
      if (!date) return;
      ev.push({ date:date, time:time||'', icon:icon, tone:tone, title:title, sub:sub, action:action, id:id||'', tab:tab||'' });
    }
    state.prospects.forEach(function(p){
      var nm = p.name || 'Unnamed client';
      openFollowUps(p).forEach(function(f){ add(f.date, f.time, '📞', 'accent', f.note||'Follow-up', nm+' · Follow-up', 'goto-prospect', p.id); });
      if (p.plannedAuditDate && !p.auditId && !p.declined) add(p.plannedAuditDate, p.plannedAuditTime, '⭐', 'warn', 'Scheduled audit', nm, 'goto-prospect', p.id);
      if (p.proposalStatus==='meeting_scheduled' && p.proposalMeetingDate && !p.converted && !p.declined) add(p.proposalMeetingDate, '', '🤝', 'warn', 'Proposal meeting', nm, 'goto-prospect', p.id);
    });
    allInvoices().forEach(function(x){ if (!x.inv.paid) add(invDue(x.inv), '', '💸', 'bad', 'Payment due: '+fmtMoney(invAmount(x.inv)), (x.p.name||'Client')+(x.inv.note?' · '+x.inv.note:''), 'goto-prospect', x.p.id); });
    state.prospects.forEach(function(p){ var sg = nextInvoiceSuggestion(p); if (sg) add(sg.date, '', '🧾', 'warn', 'Raise invoice: '+fmtMoney(sg.amount), (p.name||'Client')+(sg.retainer?' · monthly':''), 'goto-prospect', p.id); });
    computeDueList().forEach(function(x){
      add(isoFromDate(new Date(x.dueAt)), x.overrideTime, '🗓️', 'accent', 'Re-audit due', (x.storeName||'Unnamed store')+(x.storeLocation?' · '+x.storeLocation:''), 'go-actions', '', 'schedule');
    });
    state.correctiveActions.forEach(function(a){
      if (!a.done && a.dueDate) add(a.dueDate, '', '🛠️', 'bad', 'Fix due: '+(a.description||'(unspecified)'), a.storeName||'', 'go-actions', '', 'corrective');
    });
    smCalls().forEach(function(c){
      if (c.kind!=='call' || !smOpen(c) || !c.contact.date) return;
      var st = smSlotStart(c);
      add(c.contact.date, st!=='23:59' ? st : '', '☎️', 'warn', 'Snapshot Call: '+(c.contact.name||'Unnamed'), [smBiz(c), c.contact.slot, c.contact.phone].filter(Boolean).join(' · '), 'sm-open', c._id);
    });
    ev.sort(function(a, b){
      if (a.date!==b.date) return a.date<b.date ? -1 : 1;
      if (!!a.time !== !!b.time) return a.time ? -1 : 1;
      return a.time<b.time ? -1 : (a.time>b.time ? 1 : 0);
    });
    return ev;
  }
  function weekGroups(days){
    var todayStr = todayISO(), endStr = isoDaysFromNow(days-1), nowHM = nowHHMM();
    var all = weekEventsAll();
    // A follow-up call whose time today has already passed counts as overdue, matching the Follow-ups board and the client list.
    function isOver(e){ return e.date<todayStr || (e.date===todayStr && e.icon==='📞' && e.time && e.time<nowHM); }
    var groups = [];
    for (var i=0; i<days; i++){
      var ds = isoDaysFromNow(i);
      groups.push({ date:ds, offset:i, items:all.filter(function(e){ return e.date===ds && !isOver(e); }) });
    }
    return {
      overdue: all.filter(isOver),
      days: groups,
      count: all.filter(function(e){ return e.date>=todayStr && e.date<=endStr && !isOver(e); }).length
    };
  }
  function weekRowHtml(e, showDate){
    var toneColor = { bad:'var(--bad)', warn:'var(--accent)', good:'var(--good)', accent:'var(--accent)' };
    var when = showDate

    return '<div class="card weekrow" data-action="'+e.action+'"'+(e.id?' data-id="'+esc(e.id)+'"':'')+(e.tab?' data-tab="'+e.tab+'"':'')+' style="border-left:3px solid '+toneColor[e.tone]+';">' +
      '<div class="wtime">'+when+'</div>' +
      '<div class="wbody"><div class="wtitle">'+e.icon+' '+esc(e.title)+'</div>'+(e.sub ? '<div class="histmeta">'+esc(e.sub)+'</div>' : '')+'</div>' +

  function weekDayLabel(g){
    if (g.offset===0) return 'Today';
    if (g.offset===1) return 'Tomorrow';

  function renderWeekView(){

      body = g.overdue.length

        g.days.map(function(day){

    return '<main>' +

      '<div class="tabs tabs-auto">' +
